<html lang="en">
<head><meta charset="utf-8"><title>Embryo study</title><style>html, body { margin: 0; background: #111; }</style></head>

<canvas id="film" width="1080" height="1080"></canvas>

<script src="../src/embryo.js"></script>

  "use strict";
  // Piece 2: the egg blueprint beat on its own, 5 seconds.
