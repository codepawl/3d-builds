<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Enigma Machine Anatomy</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>
.iso[data-theme="light"]{--anatomy-weight:.9px;--anatomy-lit:#d9480f;--en-lamp:#f5b83d;--anatomy-lo:#85858c;--anatomy-mid:#55555c;--anatomy-hi:#1a1a1e;--anatomy-faint:#bcbcc1;--anatomy-muted:#6c6c72;--anatomy-text:#3f3f45;--anatomy-shade-0:#cdcdc8;--anatomy-shade-1:#dadad5;--anatomy-shade-2:#e5e5e0;--anatomy-shade-3:#efefea;--anatomy-top:#f9f9f6;--en-cable:#3a3a40;--en-in:#d9480f;--en-back:#1864ab}

.iso[data-theme="dark"]{--anatomy-weight:.9px;--anatomy-lit:#ff9f43;--en-lamp:#ffd166;--anatomy-page:#09090a;--anatomy-card:#111113;--anatomy-lo:#7a7a82;--anatomy-mid:#a6a6ae;--anatomy-hi:#e4e4e8;--anatomy-faint:#4c4c53;--anatomy-muted:#8b8b93;--anatomy-text:#bcbcc3;--anatomy-shade-0:#1e1e22;--anatomy-shade-1:#26262b;--anatomy-shade-2:#2f2f35;--anatomy-shade-3:#38383f;--anatomy-top:#44444c;--en-cable:#c9c9d0;--en-in:#ff9f43;--en-back:#74c0fc}

.en-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);font-weight:600;text-anchor:middle;pointer-events:none;user-select:none;-webkit-user-select:none}
.en-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.en-path{--glow:0;fill:none;stroke:var(--en-in);stroke-width:calc(var(--anatomy-weight)*2.4);stroke-linecap:round;stroke-linejoin:round;opacity:var(--glow);pointer-events:none}
.en-path[data-return]{stroke:var(--en-back);stroke-dasharray:calc(var(--anatomy-weight)*5.5) calc(var(--anatomy-weight)*2.6)}

.en-tracebox{margin-top:12px;user-select:none;-webkit-user-select:none}
.en-trace{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:6px 2px;font-family:var(--anatomy-mono)}
.en-chip{--glow:0;display:grid;justify-items:center;gap:3px;min-width:38px;color:var(--en-in);opacity:calc(.3 + .7*var(--glow))}
.en-chip[data-back]{color:var(--en-back)}
.en-chip-place{font-size:9px;line-height:1;color:var(--anatomy-muted);white-space:nowrap}
.en-chip-letter{font-size:18px;font-weight:700;line-height:1}
.en-chip-arrow{color:var(--anatomy-lo);font-size:12px;line-height:18px}
.en-pathkey{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 20px;margin-top:10px;font-size:12px;color:var(--anatomy-muted)}
.en-pathkey span{display:flex;align-items:center;gap:8px;white-space:nowrap}
.en-swatch{display:block;width:24px;border-top:3px solid var(--en-in)}
.en-swatch[data-back]{border-top:3px dashed var(--en-back)}
.en-steps,.en-stepmark{display:none}
.en-lamp{--glow:0;fill:var(--en-lamp);stroke:var(--en-lamp);stroke-width:calc(var(--anatomy-weight)*5);stroke-opacity:.4;stroke-linejoin:round;opacity:var(--glow)}
.en-notch{fill:none;stroke:var(--anatomy-hi);stroke-width:calc(var(--anatomy-weight)*3);stroke-linecap:butt}
.en-cable{fill:none;stroke:var(--en-cable);stroke-width:calc(var(--anatomy-weight)*2.6);stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.en-plug{fill:none;stroke:var(--anatomy-hi);stroke-width:calc(var(--anatomy-weight)*2.6);stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.en-hit{fill:#000;fill-opacity:0;stroke:none;cursor:pointer;outline:none}
.iso[data-theme="dark"] .en-hit{fill:#fff}
.en-hit:hover,.en-hit:focus-visible{fill-opacity:.16}
.en-hit[data-picked]{fill:var(--anatomy-lit);fill-opacity:.4}
.iso-stage[data-open] .en-hit{display:none}
.iso-stage{position:relative;touch-action:pan-y;outline:none;user-select:none;-webkit-user-select:none}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.en-badges{position:absolute;inset:0;pointer-events:none}
.en-badge,.en-num{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;flex:none;font-family:var(--anatomy-mono);font-size:10.5px;font-weight:600;line-height:1;color:var(--anatomy-card);background:var(--anatomy-strong);font-variant-numeric:tabular-nums}
.en-badge{position:absolute;left:0;top:0;margin:-9px 0 0 -9px;opacity:0;box-shadow:0 0 0 2px var(--anatomy-card)}

.en-parts li{display:flex;align-items:center;gap:8px}
.en-controls{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-left:-10px;user-select:none;-webkit-user-select:none}
.en-controls button{font:inherit;font-size:13px;color:var(--anatomy-muted);background:none;border:0;border-radius:6px;padding:5px 10px;cursor:pointer}

.en-film-legend{display:none}

function letterOf(index) {

    reflector: reflectorTurn(path.forward[2], path.reflected),
    leftBack: throughRotor(0, path.reflected, path.backward[0], false),
    middleBack: throughRotor(1, path.backward[0], path.backward[1], false),
    rightBack: throughRotor(2, path.backward[1], path.backward[2], false),
    harnessOut: Layout.harnessRoute(leaving, path.exit, -RUN_SIDE).reverse(),
    plugOut: cableOut ? cableRun(leaving, press.output, false) : [],
    lamp: Layout.lampRoute(press.output, -RUN_SIDE, cableOut),
  };
}

function drawPath(press) {
  const segments = segmentsOf(press);
  for (const name of Enigma.PATH_SEGMENTS) write(parts.segments[name], "d", segments[name].length ? trace(segments[name]) : "");
}

// ---- drawing -------------------------------------------------------------------------------------------

// Lines across a turned part, one every `every` letters, wherever the part faces the viewer.
function crossLines(part, shown, ahead, every) {
  let d = "";
  for (let index = 0; index < Enigma.LETTERS; index += every) {
    const angle = Layout.letterAngle(index + ahead - shown);
    if (facing(angle) < 0.06) continue;
    d += trace([Layout.aroundSpindle(part.x0, part.r, angle), Layout.aroundSpindle(part.x1, part.r, angle)]);
  }
  return d;
}

function drawTyreLetters(rotor, tyre, shown) {
  const x = (tyre.x0 + tyre.x1) / 2;
  const first = Math.floor(shown) - LETTERS_BEHIND;
  Array.from(parts.tyreLetters[rotor].children).forEach((node, slot) => {
    const angle = Layout.letterAngle(first + slot - shown);
    const seen = Math.min(1, Math.max(0, (facing(angle) - 0.08) / 0.2));
    write(node, "opacity", seen.toFixed(2));
    if (seen === 0) return;
    write(node, "transform", textMatrix(Layout.aroundSpindle(x, tyre.r + 0.05, angle), [1, 0, 0], [0, Math.sin(angle), -Math.cos(angle)]));
    write(node, "text", Enigma.ringNumber(first + slot));
  });
}

// The notch reaches the pawl, at the back of the rotor, when its letter is in the window.
function drawNotch(rotor, ring, shown) {
  const angle = Math.PI + (Enigma.notchIndex(machine, rotor) - shown) * Layout.stepAngle;
  const seen = facing(angle) >= 0.06;
  write(parts.notches[rotor], "d", seen ? trace([Layout.aroundSpindle(ring.x0, ring.r, angle), Layout.aroundSpindle(ring.x1, ring.r, angle)]) : "");
}

// The 26 teeth of the ratchet, drawn on its right face: each rises slowly and drops sharply.
function ratchetTeeth(part, shown) {
  const points = [];
  for (let tooth = 0; tooth < Enigma.LETTERS; tooth++) {
    const angle = Layout.letterAngle(tooth + 0.5 - shown);
    points.push(Layout.aroundSpindle(part.x1, part.r - TOOTH_DEPTH, angle), Layout.aroundSpindle(part.x1, part.r - 0.2, angle + Layout.stepAngle));
  }
  return trace(points, true);
}

function drawRotor(rotor, shown) {
  if (typing.shown[rotor] === shown) return;
  typing.shown[rotor] = shown;
  const rotorParts = Layout.rotorParts(rotor);
  write(parts.tyreTicks[rotor], "d", crossLines(rotorParts.tyre, shown, 0.5, 1));
  write(parts.wheelGrips[rotor], "d", crossLines(rotorParts.fingerWheel, shown, 0, 2));
  write(parts.ratchetTeeth[rotor], "d", crossLines(rotorParts.ratchet, shown, 0.5, 1) + ratchetTeeth(rotorParts.ratchet, shown));
  drawTyreLetters(rotor, rotorParts.tyre, shown);
  drawNotch(rotor, rotorParts.notchRing, shown);
  write(parts.windows[rotor], "text", Enigma.ringNumber(shown));
}

// While a press plays, a stepping rotor is shown part-way between the letter it left and the next.
function shownPosition(rotor, press, pose) {
  if (!press) return machine.positions[rotor];
  return press.before[rotor] + (press.stepped[rotor] ? pose.step : 0);
}

// A plug has two pins, one for each hole of the socket, on a common body.
function plugShape(letter) {
  const out = (point) => [point[0], point[1] + SIZES.plugboard.plugLength, point[2]];
  const upper = Layout.socketHole(letter, true);
  const lower = Layout.socketHole(letter, false);
  return trace([upper, out(upper)]) + trace([lower, out(lower)]) + trace([out(upper), out(lower)]);
}

// The right rotor's 26 wires, from its pins to its contacts, shown while its two halves are apart.
function drawOpenRotor() {
  const share = Math.min(1, Math.max(0, Explode.shareOf(explode, "cap")));
  const shift = machine.positions[2] - machine.rings[2];
  const key = `${share.toFixed(3)} ${shift}`;
  if (typing.wiresDrawn === key) return;
  typing.wiresDrawn = key;
  parts.wires.style.setProperty("--wires", Enigma.smooth(0.05, 0.45, share).toFixed(2));
  if (share < 0.02) {
    write(parts.wires, "d", "");
    return;
  }
  const rotorParts = Layout.rotorParts(2);
  const pins = rotorParts.fingerWheel.x0 + Explode.PIECES.cap.move[0] * share;
  const wiring = Enigma.ROTORS[machine.rotorNames[2]].wiring;
  let d = "";
  for (let pin = 0; pin < Enigma.LETTERS; pin++) d += trace(Layout.rotorWire(pins, rotorParts.tyre.x1, pin - shift, Enigma.indexOf(wiring[pin]) - shift));
  write(parts.wires, "d", d);
}

// The strip of letters: what the current stands for after each stage, lit as the path gets there.
function drawTrace() {
  const press = typing.current;
  const stages = press ? Enigma.traceStages(machine, press) : null;
  parts.chips.forEach((chip, index) => {
    const stage = stages ? stages[index] : null;
    const start = stage ? Enigma.segmentStart(Enigma.PATH_SEGMENTS.indexOf(stage.segment)) : 0;
    write(chip.firstChild, "text", stage ? stage.place : TRACE_PLACES[index]);
    write(chip.lastChild, "text", stage ? stage.letter : "·");
    setGlow(chip, stage ? Enigma.smooth(start, start + T.pathRise, clock.phase) : 0);
  });
}

function drawSteps() {
  const levels = typing.current ? Enigma.stepsAt(clock.phase) : Enigma.STEPS.map(() => 0);
  parts.stepItems.forEach((item, index) => setGlow(item, levels[index]));
  return levels;
}

function drawCables() {
  const pairs = Enigma.plugPairs(machine);
  const key = pairs.map((pair) => pair.join("")).join(" ");
  if (typing.cablesDrawn === key) return;
  typing.cablesDrawn = key;
  let markup = "";
  for (const [first, second] of pairs) {
    const points = cablePoints(first, second);
    markup += `<path class="en-cable" d="${trace(points.slice(1, -1))}"/>`;
    markup += `<path class="en-plug" d="${plugShape(first)}${plugShape(second)}"/>`;
  }
  write(parts.cables, "html", markup);
}

// The lamp's letter joins the readout when the lamp lights, not when the key goes down.
function readoutText() {
  const windows = `windows ${Enigma.windowsText(machine.positions)} · ${Enigma.positionsText(machine.positions)}`;
  const press = typing.current;
  if (!press) return `${windows} · type a letter`;
  const lamp = clock.phase < T.lamp[0] ? "·" : press.output;
  return `${windows} · ${press.letter} → ${lamp}`;
}

function draw() {
  const pose = Enigma.poseAt(clock.phase);
  const glow = Enigma.glowAt(clock.phase);
  const press = clock.phase < 1 ? typing.current : null;
  const assembled = 1 - Math.min(1, Math.max(0, Explode.maxShare(explode)));

  for (const letter of Layout.letters) {
    const down = press && letter === press.letter ? pose.key : 0;
    write(parts.keys[letter], "transform", down > 0 ? translateAlong(P, [0, 0, -SIZES.keyboard.travel * down]) : null);
    setGlow(parts.lamps[letter], press && letter === press.output ? glow.lamp * assembled : 0);
    write(parts.sockets[letter], "data-picked", letter === typing.picked ? "" : null);
  }
  for (const rotor of ROTORS) drawRotor(rotor, shownPosition(rotor, press, pose));
  // All three pawls rise together; only one that finds a notch (the right one always does) leans in and pushes.
  for (const rotor of ROTORS) {
    const lift = press ? pose.pawl * SIZES.pawls.lift : 0;
    const bite = press && press.engaged[rotor] ? pose.pawl * PAWL_BITE : 0;
    write(parts.pawls[rotor], "transform", lift > 0 ? translateAlong(P, [0, bite, lift]) : null);
  }
  Enigma.PATH_SEGMENTS.forEach((name, index) => setGlow(parts.segments[name], press ? glow.segments[index] * assembled : 0));
  drawCables();
  drawOpenRotor();
  drawTrace();
  drawSteps();

  const text = apartReadout() ?? readoutText();
  if (readout.textContent !== text) readout.textContent = text;
  write(stage, "data-stage", clock.phase >= 1 ? "resting" : "pressing");
  drawApart();
}

// ---- loop, pointer, keyboard ---------------------------------------------------------------------------

function tick(now) {
  const dt = clock.last ? Math.min((now - clock.last) / 1000, 1 / 30) : 1 / 60;
  clock.last = now;
  const flying = stepApart(dt);
  if (!still.matches) advance(dt);
  draw();
  const typingNow = !still.matches && (clock.phase < 1 || typing.queue.length > 0 || wantsTour());
  clock.frame = clock.visible && (typingNow || flying) ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (manual || clock.frame || !clock.visible) return;
  clock.last = 0;
  clock.frame = requestAnimationFrame(tick);
}

function quietTour() {
  clock.touring = false;
  clearTimeout(clock.resumeTimer);
  clock.resumeTimer = setTimeout(() => {
    clock.touring = tourAllowed && !still.matches;
    run();
  }, RESUME_AFTER);
}

// Reduced motion: no travel, one still pose per key, with the path and the lamp lit.
function typeLetter(letter) {
  if (apartBusy()) return;
  quietTour();
  if (still.matches) {
    clock.phase = 1;
    startPress(letter);
    clock.phase = STILL_PHASE;
    draw();
    return;
  }
  if (typing.queue.length < QUEUE_LIMIT) typing.queue.push(letter);
  run();
}

function typeNext() {
  typeLetter(tourLetter());
}

function afterSetting(text) {
  say(text);
  quietTour();
  draw();
  run();
}

function turnRotor(rotor, by) {
  if (!settle()) return;
  Enigma.turnRotor(machine, rotor, by);
  afterSetting(`The ${ROTOR_NAMES[rotor]} rotor now shows ${Enigma.letterOf(machine.positions[rotor])}. Rotors at ${Enigma.positionsText(machine.positions)}.`);
}

function resetRotors() {
  if (!settle()) return;
  Enigma.setPositions(machine, "AAA");
  typing.input = "";
  typing.output = "";
  afterSetting("Rotors set to AAA.");
}

function clearCables() {
  if (!settle()) return;
  Enigma.clearPlugs(machine);
  typing.picked = null;
  afterSetting("All cables pulled from the plugboard.");
}

// A plugged socket gives up its cable; two free sockets picked one after the other get one.
function pickSocket(letter) {
  if (!settle()) return;
  const partner = machine.plugs[letter];
  if (partner) {
    Enigma.disconnect(machine, letter);
    typing.picked = null;
    afterSetting(`Cable ${letter} to ${partner} pulled.`);
  } else if (typing.picked === null) {
    typing.picked = letter;
    afterSetting(`Socket ${letter} picked. Pick a second socket to join them.`);
  } else if (typing.picked === letter) {
    typing.picked = null;
    afterSetting(`Socket ${letter} let go.`);
  } else {
    Enigma.connect(machine, typing.picked, letter);
    const first = typing.picked;
    typing.picked = null;
    afterSetting(`Cable plugged from ${first} to ${letter}.`);
  }
}

function activate(hit, backwards) {
  const kind = hit.getAttribute("data-hit");
  if (kind === "key") typeLetter(hit.getAttribute("data-letter"));
  if (kind === "rotor") turnRotor(Number(hit.getAttribute("data-rotor")), backwards ? -1 : 1);
  if (kind === "socket") pickSocket(hit.getAttribute("data-letter"));
}

function hold(value) {
  clock.held = value;
  if (!value) quietTour();
  run();
}

function onKey(event) {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const hit = event.target.closest("[data-hit]");
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    if (hit) activate(hit, false);
    else typeNext();
    return;
  }
  if (hit && hit.getAttribute("data-hit") === "rotor" && (event.key === "ArrowUp" || event.key === "ArrowDown")) {
    event.preventDefault();
    activate(hit, event.key === "ArrowDown");
    return;
  }
  const letter = event.key.toUpperCase();
  if (event.key.length !== 1 || !Enigma.ALPHABET.includes(letter)) return;
  // Shift+E belongs to the exploded view (apart.js).
  if (event.shiftKey && letter === "E") return;
  event.preventDefault();
  typeLetter(letter);
}

if (!manual) {
  stage.addEventListener("pointerenter", () => hold(true));
  stage.addEventListener("pointerleave", () => hold(false));
  stage.addEventListener("focusin", () => hold(true));
  stage.addEventListener("focusout", () => hold(false));
  stage.addEventListener("click", (event) => {
    const hit = event.target.closest("[data-hit]");
    if (hit) activate(hit, event.shiftKey);
    else typeNext();
  });
  stage.addEventListener("keydown", onKey);
  stepButton.addEventListener("click", typeNext);
  resetButton.addEventListener("click", resetRotors);
  clearButton.addEventListener("click", clearCables);
  new IntersectionObserver(
    (entries) => {
      clock.visible = entries[entries.length - 1].isIntersecting;
      if (clock.visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  still.addEventListener("change", () => {
    clock.touring = tourAllowed && !still.matches;
    draw();
    run();
  });
}

// The exploded view, the sounds and the film hooks of the Enigma figure. The build inlines this file
// right after live.js, inside the same block: it uses that file's clock, parts and helpers, and it ends
// with the start-up that brings the page to its first frame. Adapted from the Jacquard loom figure.

const EX = CONFIG.explode;
const explode = Explode.createExplode();
const world = one("world");
const lens = one("lens");
const itemNodes = Array.from(world.children);
const badges = Array.from(document.querySelectorAll("[data-badge]"));
const apartButton = document.querySelector("[data-apart]");
const soundButton = document.querySelector("[data-sound]");
const worldZero = iso([0, 0, 0], P);
const AXES = [[1, 0, 0], [0, 1, 0], [0, 0, 1]].map((axis) => {
  const tip = iso(axis, P);
  return [tip[0] - worldZero[0], tip[1] - worldZero[1]];
});
const apartState = { armed: false, painted: itemNodes.map((_, index) => index) };
const filmView = { camera: null };
const eventLog = [];
const FLIGHT_SECONDS = Explode.SPRING.stagger * Explode.LEAVE_ORDER.length + 0.5;

// ---- state ---------------------------------------------------------------------------------------------

function apartBusy() {
  return apartState.armed || explode.apart || !Explode.isResting(explode);
}

function apartReadout() {
  if (apartState.armed) return "finishing the key · then apart";
  if (explode.apart) return Explode.isResting(explode) ? "apart · typing paused" : "coming apart";
  if (!Explode.isResting(explode)) return "going back together";
  return null;
}

function openApart(calm) {
  apartState.armed = false;
  typing.queue.length = 0;
  typing.picked = null;
  Explode.setApart(explode, true, calm);
  emit("apart-open", { duration: FLIGHT_SECONDS });
  if (calm) emit("apart-hold", {});
  say("The machine is apart in eleven numbered assemblies. Typing is paused.");
}

function closeApart(calm) {
  apartState.armed = false;
  Explode.setApart(explode, false, calm);
  emit("apart-close", { duration: FLIGHT_SECONDS });
  if (calm) emit("apart-seated", {});
  say("The machine is going back together.");
}

// Arming: the machine only comes apart from rest, so a key that is down is let up first.
function setApartWanted(wanted) {
  const current = explode.apart || apartState.armed;
  if (wanted === current) return;
  if (!wanted && apartState.armed) apartState.armed = false;
  else if (!wanted) closeApart(still.matches);
  else if (still.matches) {
    clock.phase = 1;
    openApart(true);
  } else apartState.armed = true;
  draw();
  run();
}

function toggleApart() {
  setApartWanted(!(explode.apart || apartState.armed));
}

function everyShare(test) {
  return Explode.LEAVE_ORDER.every((name) => test(explode.shares[name]));
}

function stepApart(seconds) {
  if (apartState.armed && clock.phase >= 1) openApart(false);
  if (Explode.isResting(explode)) return apartState.armed;
  for (const event of Explode.stepExplode(explode, seconds)) {
    emit(`piece-${event.name}`, { piece: event.piece, number: Explode.PIECES[event.piece].number }, event.at);
    const arrived = (share) => !share.pending && (share.landed || share.crossed);
    if (event.name === "arrive" && everyShare((share) => share.target === 1 && arrived(share))) emit("apart-hold", {}, event.at);
    if (event.name === "land" && everyShare((share) => share.target === 0 && arrived(share))) emit("apart-seated", {}, event.at);
  }
  if (Explode.isResting(explode) && !explode.apart && !manual) quietTour();
  return true;
}

// ---- drawing -------------------------------------------------------------------------------------------

function sameList(a, b) {
  for (let index = 0; index < a.length; index++) {
    if (a[index] !== b[index]) return false;
  }
  return true;
}

// Re-appends the items only when the painter's order really changed.
function paintItems(shifts) {
  const assembled = Explode.isResting(explode) && !explode.apart;
  const order = assembled ? itemNodes.map((_, index) => index) : Explode.paintOrder(EX.items, shifts, AXES).order;
  if (sameList(order, apartState.painted)) return;
  const fragment = document.createDocumentFragment();
  for (const index of order) fragment.appendChild(itemNodes[index]);
  world.appendChild(fragment);
  apartState.painted = order;
}

// The page pulls back just far enough to keep the apart pose inside the card; the film sets its own camera.
function worldView(open) {
  if (filmView.camera) return filmView.camera;
  const centre = [EX.width / 2, EX.height / 2];
  if (EX.film) return { x: centre[0], y: centre[1], zoom: 1 };
  const fit = Math.min(1, (EX.width - 44) / EX.apart.width, (EX.height - 44) / EX.apart.height);
  const share = Enigma.smooth(0, 1, open);
  return { x: centre[0] + (EX.apart.x - centre[0]) * share, y: centre[1] + (EX.apart.y - centre[1]) * share, zoom: 1 + (fit - 1) * share };
}

function placeOnStage(node, point, view, opacity) {
  const spot = iso(point, P);
  const place = `${(((EX.width / 2 + (spot[0] - view.x) * view.zoom) / EX.width) * 100).toFixed(2)}%`;
  const drop = `${(((EX.height / 2 + (spot[1] - view.y) * view.zoom) / EX.height) * 100).toFixed(2)}%`;
  if (node.style.left !== place) node.style.left = place;
  if (node.style.top !== drop) node.style.top = drop;
  if (node.style.opacity !== opacity) node.style.opacity = opacity;
}

function placeBadges(shifts, view) {
  for (const badge of badges) {
    const name = badge.getAttribute("data-badge");
    const anchor = EX.anchors[name];
    const shift = shifts[name];
    const share = name === "case" ? Explode.maxShare(explode) : Explode.shareOf(explode, name);
    placeOnStage(badge, [anchor[0] + shift[0], anchor[1] + shift[1], anchor[2] + shift[2]], view, Enigma.smooth(0.5, 0.95, share).toFixed(2));
  }
}

// Where each of the six step numbers sits for this press: beside the part that step is about.
function stepPoints(press) {
  const key = Layout.keyPoint(press.letter);
  const socket = Layout.socketPoint(Enigma.letterOf(press.path.plugIn));
  const lamp = Layout.lampPoint(press.output);
  const wheel = Layout.rotorParts(1).fingerWheel;
  return [
    [key[0] - 10, key[1] + 4, key[2]],
    [wheel.x1, STACK.y, STACK.z + wheel.r + 7],
    [socket[0] + 8, socket[1], socket[2] + 2],
    [STACK.entry.x1 + 2, STACK.y + 16, STACK.z - 20],
    [STACK.reflector.x0, STACK.y, STACK.z + STACK.reflector.r + 6],
    [lamp[0] - 10, lamp[1] + 4, lamp[2]],
  ];
}

function placeStepMarks(view, open) {
  if (!parts.stepMarks.length) return;
  const press = typing.current;
  const levels = press ? Enigma.stepsAt(clock.phase) : null;
  const points = press ? stepPoints(press) : null;
  parts.stepMarks.forEach((mark, index) => {
    if (!press) {
      if (mark.style.opacity !== "0") mark.style.opacity = "0";
      return;
    }
    placeOnStage(mark, points[index], view, (levels[index] * steps.shown * (1 - open)).toFixed(2));
  });
}

function drawApart() {
  const shifts = Explode.shiftsOf(explode);
  const open = Math.min(1, Math.max(0, Explode.maxShare(explode)));
  itemNodes.forEach((node, index) => {
    const shift = shifts[EX.items[index].piece];
    const moved = Math.abs(shift[0]) + Math.abs(shift[1]) + Math.abs(shift[2]) > 1e-6;
    write(node, "transform", moved ? translateAlong(P, shift) : null);
  });
  paintItems(shifts);
  const view = worldView(open);
  const centredAtRest = view.zoom === 1 && view.x === EX.width / 2 && view.y === EX.height / 2;
  const centred = `translate(${EX.width / 2} ${EX.height / 2}) scale(${view.zoom.toFixed(4)}) translate(${(-view.x).toFixed(2)} ${(-view.y).toFixed(2)})`;
  write(lens, "transform", centredAtRest ? null : centred);
  placeBadges(shifts, view);
  placeStepMarks(view, open);
  const least = Math.min(...Explode.LEAVE_ORDER.map((name) => Explode.shareOf(explode, name)));
  const shown = Enigma.smooth(0.55, 0.95, least).toFixed(2);
  if (document.body.style.getPropertyValue("--en-apart") !== shown) document.body.style.setProperty("--en-apart", shown);
  write(stage, "data-open", open > 0.005 ? "" : null);
  const wanted = explode.apart || apartState.armed;
  write(apartButton, "aria-pressed", String(wanted));
  const label = wanted ? "Put together" : "Take apart";
  if (apartButton.textContent !== label) apartButton.textContent = label;
}

// ---- sound ---------------------------------------------------------------------------------------------
// The machine reports what happens as named events with a time on its own clock. The page plays them
// through Web Audio when the reader turns sound on; the recorder takes the log and renders the film's
// track offline (sound.mjs).

const sound = { on: false, context: null, master: null, bus: null, noise: null };
const PAN_WIDTH = 110;

const CUES = [
  [T.keyDown[1] - 0.02, "key-down"],
  [T.step[0] + 0.07, "rotor-step"],
  [T.lamp[0], "lamp-on"],
  [T.keyUp[1] - 0.02, "key-up"],
];

function cueDetail(name) {
  const press = typing.current;
  const keyPan = Layout.spots[press.letter].x / PAN_WIDTH;
  if (name === "rotor-step") return { count: press.stepped.filter(Boolean).length };
  if (name === "lamp-on") return { letter: press.output, duration: (T.keyUp[0] - T.lamp[0]) * clock.pressSeconds, pan: Layout.spots[press.output].x / PAN_WIDTH };
  return { letter: press.letter, pan: keyPan };
}

// Called by advance() for every stretch of a press it plays: `at` is the clock time at phase `from`.
function soundEvents(from, to, at) {
  for (const [phase, name] of CUES) {
    if (from < phase && to >= phase) emit(name, cueDetail(name), at + (phase - from) * clock.pressSeconds);
  }
}

function emit(name, detail, at = null) {
  if (manual) eventLog.push({ name, at: Math.round((at ?? clock.elapsed) * 10000) / 10000, ...detail });
  if (sound.on && sound.context) VOICES[name]?.(detail);
}

// The same recipe as the film's track (sound.mjs): every sound is a short, soft tap, a few milliseconds
// of noise that fades in and is heard through two heavily damped resonances. Nothing is continuous, the
// lamp is silent, and the master gain is low.
const MASTER_GAIN = 0.16;
const HIGH_PASS = 110;
const LOW_PASS = 3500;
const MODE_GAIN = 3;
const TAP_SECONDS = 0.07;
const STEP_SECOND_AFTER = 0.028;
const decibels = (value) => 10 ** (value / 20);
const BODIES = {
  key: { modes: [[210, 0.006, 1], [430, 0.004, 0.45]], attack: 0.005, blow: 0.006 },
  release: { modes: [[290, 0.005, 1], [560, 0.0035, 0.4]], attack: 0.004, blow: 0.005 },
  tik: { modes: [[820, 0.0035, 1], [1450, 0.0025, 0.5]], attack: 0.003, blow: 0.003 },
  tk: { modes: [[1100, 0.003, 1], [1900, 0.002, 0.4]], attack: 0.003, blow: 0.0025 },
  wood: { modes: [[260, 0.007, 1], [520, 0.005, 0.4]], attack: 0.005, blow: 0.006 },
  reseat: { modes: [[170, 0.009, 1], [340, 0.006, 0.5]], attack: 0.006, blow: 0.008 },
};
const LEVELS = { key: decibels(0), step: decibels(-4), stepSecond: decibels(-10), part: decibels(-6), partLeaving: decibels(-9), reseat: decibels(-3), release: decibels(-10) };

// Everything goes through a gentle high-pass and a gentle low-pass, then one low master gain.
function audioReady() {
  if (sound.context) return sound.context;
  const context = new AudioContext();
  const buffer = context.createBuffer(1, context.sampleRate, context.sampleRate);
  const samples = buffer.getChannelData(0);
  for (let index = 0; index < samples.length; index++) samples[index] = Math.random() * 2 - 1;
  sound.context = context;
  sound.noise = buffer;
  sound.master = context.createGain();
  sound.master.gain.value = MASTER_GAIN;
  sound.master.connect(context.destination);
  const dull = context.createBiquadFilter();
  dull.type = "lowpass";
  dull.frequency.value = LOW_PASS;
  dull.Q.value = 0.5;
  dull.connect(sound.master);
  sound.bus = context.createBiquadFilter();
  sound.bus.type = "highpass";
  sound.bus.frequency.value = HIGH_PASS;
  sound.bus.Q.value = 0.5;
  sound.bus.connect(dull);
  return context;
}

// No two taps are the same: a few per cent of pitch, a couple of decibels, a few milliseconds.
function variationOf() {
  const spread = () => Math.random() * 2 - 1;
  return { pitch: 1 + spread() * 0.07, level: decibels(spread() * 2), late: Math.random() * 0.004 };
}

// One tap: the noise of the blow fades in over a few milliseconds, never at once, and dies away; two
// low-Q resonances give it its body and are silent again within about 35 ms.
function tap(body, level, delay = 0) {
  const context = sound.context;
  const variation = variationOf();
  const start = context.currentTime + delay + variation.late;
  const source = context.createBufferSource();
  const blow = context.createGain();
  source.buffer = sound.noise;
  source.loop = true;
  blow.gain.setValueAtTime(0, start);
  blow.gain.linearRampToValueAtTime(1, start + body.attack);
  blow.gain.setTargetAtTime(0, start + body.attack, body.blow);
  source.connect(blow);
  for (const [frequency, ringTime, share] of body.modes) {
    const mode = context.createBiquadFilter();
    const out = context.createGain();
    mode.type = "bandpass";
    mode.frequency.value = frequency * variation.pitch;
    mode.Q.value = Math.max(1, Math.PI * frequency * ringTime);
    out.gain.value = share * level * variation.level * MODE_GAIN;
    blow.connect(mode).connect(out).connect(sound.bus);
  }
  source.start(start, Math.random() * 0.5);
  source.stop(start + TAP_SECONDS);
}

const VOICES = {
  "key-down": () => tap(BODIES.key, LEVELS.key),
  "rotor-step": (detail) => {
    for (let rotor = 0; rotor < detail.count; rotor++) {
      tap(BODIES.tik, LEVELS.step, rotor * 0.045);
      tap(BODIES.tk, LEVELS.stepSecond, rotor * 0.045 + STEP_SECOND_AFTER);
    }
  },
  "key-up": () => tap(BODIES.release, LEVELS.release),
  "piece-leave": () => tap(BODIES.wood, LEVELS.partLeaving),
  "piece-land": () => tap(BODIES.wood, LEVELS.part),
  "apart-seated": () => tap(BODIES.reseat, LEVELS.reseat),
};

function toggleSound() {
  sound.on = !sound.on;
  if (sound.on) audioReady().resume();
  soundButton.setAttribute("aria-pressed", String(sound.on));
  soundButton.textContent = sound.on ? "Sound on" : "Sound";
}

// ---- start ---------------------------------------------------------------------------------------------

if (!manual) {
  stage.addEventListener("keydown", (event) => {
    if (!event.shiftKey || event.ctrlKey || event.metaKey || event.altKey || event.key.toUpperCase() !== "E") return;
    event.preventDefault();
    toggleApart();
  });
  apartButton.addEventListener("click", toggleApart);
  soundButton.addEventListener("click", toggleSound);
}

const startPositions = (query.get("positions") ?? "").toUpperCase();
if (/^[A-Z]{3}$/.test(startPositions)) Enigma.setPositions(machine, startPositions);
clock.touring = !manual && tourAllowed && !still.matches;
if (query.get("apart") === "1") Explode.setApart(explode, true, true);
draw();

// A deterministic clock for frame-by-frame capture: open the page with ?clock=manual and drive it from
// here. Every call advances the figure's own clock, so the event log carries exact film times.
window.__enigma = {
  advance(seconds) {
    explode.time = clock.elapsed;
    stepApart(seconds);
    advance(seconds);
    draw();
  },
  setTyping(on) {
    clock.touring = on;
  },
  setPressSeconds(seconds) {
    clock.pressSeconds = seconds;
  },
  type(text) {
    typing.queue.push(...text);
  },
  setApart(apart) {
    explode.time = clock.elapsed;
    if (apart) openApart(false);
    else closeApart(false);
  },
  camera(x, y, zoom, weight) {
    filmView.camera = { x, y, zoom };
    document.body.style.setProperty("--anatomy-weight", `${weight}px`);
    draw();
  },
  steps(opacity) {
    steps.shown = opacity;
    document.body.style.setProperty("--en-steps", String(opacity));
  },
  trace() {
    return typing.current ? Enigma.traceStages(machine, typing.current) : [];
  },
  detail(opacity) {
    document.body.style.setProperty("--en-detail", String(opacity));
  },
  project(point) {
    return iso(point, P);
  },
  view() {
    return { width: EX.width, height: EX.height, apart: EX.apart };
  },
  takeEvents() {
    return eventLog.splice(0);
  },
  state() {
    return {
      positions: Enigma.positionsText(machine.positions),
      input: typing.input,
      output: typing.output,
      phase: Math.round(clock.phase * 10000) / 10000,
      apart: explode.apart,
      open: Math.round(Explode.maxShare(explode) * 10000) / 10000,
      resting: Explode.isResting(explode),
      time: Math.round(clock.elapsed * 10000) / 10000,
      readout: readout.textContent,
    };
  },
};

}
