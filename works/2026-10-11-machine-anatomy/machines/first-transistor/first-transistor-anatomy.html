el" data-side="out" x="180" y="62" text-anchor="start">collector</text><text class="tr-in-label" x="120" y="36" text-anchor="middle">plastic wedge</text><text class="tr-in-label" x="120" y="101" text-anchor="middle">slit</text><text class="tr-in-label" x="22" y="163" text-anchor="start">germanium</text><text class="tr-in-label" x="120" y="182.5" text-anchor="middle">metal base</text><g class="tr-mark" data-stepmark="1" transform="translate(74 128)"><circle r="8"/><text font-size="9.2" dy="0.36em">2</text></g><g class="tr-mark" data-stepmark="2" transform="translate(120 146)"><circle r="8"/><text font-size="9.2" dy="0.36em">3</text></g><rect class="tr-in-frame" x="0.75" y="0.75" width="238.5" height="198.5" rx="5"/></g></svg></div><div class="tr-tracebox" aria-hidden="true"><div class="tr-scope" data-side="in"><svg viewBox="0 0 200 84" aria-hidden="true"><rect class="tr-scope-frame" x="0.75" y="0.75" width="198.5" height="82.5" rx="5"/><path class="tr-scope-zero" d="M4 42H196"/><path class="tr-wave" data-dyn="wave-in" d=""/></svg><span class="tr-scope-label"><span data-dyn="label-in">input</span></span></div><div class="tr-trace"><span class="tr-chip" data-chip="0">small signal in</span><span class="tr-chip-arrow">→</span><span class="tr-chip" data-chip="1">charges cross the germanium</span><span class="tr-chip-arrow">→</span><span class="tr-chip" data-chip="2" data-side="out">big signal out</span></div><div class="tr-scope" data-side="out"><svg viewBox="0 0 200 84" aria-hidden="true"><rect class="tr-scope-frame" x="0.75" y="0.75" width="198.5" height="82.5" rx="5"/><path class="tr-scope-zero" d="M4 42H196"/><path class="tr-wave" data-dyn="wave-out" d=""/></svg><span class="tr-scope-label"><span class="tr-num tr-scope-mark" data-stepmark="4" data-side="out">5</span><span data-dyn="label-out">output</span></span></div></div><svg class="tr-birth" data-dyn="birth-layer" aria-hidden="true"><rect class="tr-birth-source" data-dyn="birth-source"/><path class="tr-birth-lines" data-dyn="birth-lines" d=""/></svg></div></div><figcaption class="iso-legend"><span class="tr-controls" role="group" aria-label="Transistor controls"><button type="button" data-apart aria-pressed="false">Take apart</button><button type="button" data-sound aria-pressed="false">Sound</button><button type="button" data-bias aria-pressed="true">Bias on</button><label class="tr-level">Input level<input type="range" data-level min="0" max="100" step="1" value="50" aria-label="Input signal level"></label></span><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="line" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Thin orange: the small input current</span><span class="iso-key"><svg class="iso-swatch" data-mark="line" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Thick blue: the larger output current</span></span><ol class="tr-parts"><li><span class="tr-num">1</span>Spring: a bent wire that presses the wedge down</li><li><span class="tr-num">2</span>Plastic wedge, a triangle with its point down</li><li><span class="tr-num">3</span>Gold foil, slit at the point into two contacts: emitter and collector</li><li><span class="tr-num">4</span>Germanium slab</li><li><span class="tr-num">5</span>Metal base: the third contact, under the germanium</li><li><span class="tr-num">6</span>Leads to the emitter, the collector and the base</li><li><span class="tr-num">7</span>Stand with the demonstration circuit: signal, two batteries, load</li></ol><span class="iso-caption">The first transistor, made by John Bardeen and Walter Brattain at Bell Laboratories in December 1947: the key experiment was on 16 December, and on 23 December it was shown to the laboratory's managers, working as a speech amplifier with a power gain of 18. A strip of gold foil lies over the point of a plastic triangle and is sliced through at the tip with a razor blade, which leaves two gold contacts very close together. A spring presses them lightly onto a block of germanium that sits on a metal base. A small current into one contact, the emitter, puts positive charges into the surface of the germanium (&quot;holes&quot;, places where an electron is missing). They are gathered by the other contact, the collector, and there a larger current flows between the collector and the base. So a small change at the emitter makes a bigger change at the collector, and the extra power comes from the battery. What moves here is a simplified model, not a measurement: the collector current is the emitter current times 2.2 and flows through a larger resistance, with values chosen to land near that power gain of 18; push the input too far and the output clips. With the batteries switched off nothing is amplified. The parts are not to scale, and the slit is drawn far wider than the real one, which Brattain's notebook puts at about 0.04 mm. Bardeen, Brattain and William Shockley shared the 1956 Nobel Prize in Physics.</span></figcaption></figure><span class="tr-sr" data-announce aria-live="polite"></span></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }

    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);
    });
    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));

    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))

    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {

    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])

            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
    }
    let bevel;
    if (options.bevel && options.bevel > 0) {
        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {
            const [ax, ay] = normals[(index + count - 1) % count];
            const [bx, by2] = normals[index];
            const mx = ax + bx;
            const my = ay + by2;
            const length = Math.hypot(mx, my) || 1;
            return [x - (mx / length) * by, y - (my / length) * by];

        bevel = runsOf(facing, true)
            .map((run) => pathOf([top[run[0]], ...run.slice(1, -1).map((index) => insetTop[index]), top[run[run.length - 1]]]))
            .join("");
    }
    return {
        fill,

{
// Pure model of the point-contact transistor as an amplifier. No DOM in here: the build, the page, the
// film and the tests all read this one file.
//
// It is a simplified, piecewise-linear small-signal model, not a device simulation:
//   - the emitter contact conducts only above a threshold voltage, then like a fixed resistance;
//   - the collector current is a leakage current plus ALPHA times the emitter current, and it can never
//     exceed what the collector battery can push through the load;
//   - with the batteries disconnected (bias off) the input signal alone stays below the emitter's
//     threshold and the collector has no supply, so nothing is amplified.
// The component values are illustrative choices, not measurements of the 1947 device. See reference/notes.md.

const TWO_PI = Math.PI * 2;

// How fast the demonstration signal swings on the page: slow enough to watch.
const SIGNAL_HERTZ = 0.5;
// The input signal's amplitude when the level control is at 1.
const INPUT_FULL_VOLTS = 0.2;
const EMITTER_THRESHOLD_VOLTS = 0.25;
const EMITTER_OHMS = 270;
const EMITTER_BIAS_AMPS = 0.0006;
const EMITTER_BIAS_VOLTS = EMITTER_THRESHOLD_VOLTS + EMITTER_BIAS_AMPS * EMITTER_OHMS;
const LOAD_OHMS = 1000;
const COLLECTOR_SUPPLY_VOLTS = 9;
const COLLECTOR_LEAK_AMPS = 0.0003;
// Current gain of a point-contact transistor in this connection: "usually around 2 to 3" (Wikipedia,
// Point-contact transistor, Characteristics).
const ALPHA_DEFAULT = 2.2;
const ALPHA_RANGE = [1, 3];
// How long a charge takes to cross from one contact to the other in the drawing (not a measured time).
const CROSSING_SECONDS = 1.1;

const DEFAULTS = { inputLevel: 0.5, biasOn: true, alpha: ALPHA_DEFAULT };

const STEPS = [
  { label: "A small signal reaches the emitter", side: "in" },
  { label: "Charges enter the germanium", side: "in" },
  { label: "They are swept to the collector", side: "in" },
  { label: "A much larger current flows out", side: "out" },
  { label: "The output is a bigger copy of the input", side: "out" },
];
// When each step of the walk-through lights, as a share of the walk.
const STEP_STARTS = [0.04, 0.22, 0.4, 0.58, 0.78];
const STEP_RAMP = 0.07;

function clamp(value, low, high) {
  return Math.min(high, Math.max(low, value));
}

function smooth(from, to, value) {
  const share = clamp((value - from) / (to - from), 0, 1);
  return share * share * (3 - 2 * share);
}

function createParameters(overrides = {}) {
  const merged = { ...DEFAULTS, ...overrides };
  return {
    inputLevel: clamp(Number(merged.inputLevel), 0, 1),
    biasOn: Boolean(merged.biasOn),
    alpha: clamp(Number(merged.alpha), ALPHA_RANGE[0], ALPHA_RANGE[1]),
  };
}

function inputVoltsAt(parameters, seconds) {
  return parameters.inputLevel * INPUT_FULL_VOLTS * Math.sin(TWO_PI * SIGNAL_HERTZ * seconds);
}

// The emitter contact: no current below its threshold, then a straight line.
function emitterAmpsFor(parameters, inputVolts) {
  const biasVolts = parameters.biasOn ? EMITTER_BIAS_VOLTS : 0;
  return Math.max(0, (biasVolts + inputVolts - EMITTER_THRESHOLD_VOLTS) / EMITTER_OHMS);
}

// The collector contact: with its battery connected it passes a leakage current plus alpha times
// whatever the emitter injects, up to what the battery can push through the load.
function collectorAmpsFor(parameters, emitterAmps) {
  if (!parameters.biasOn) return 0;
  const ceiling = COLLECTOR_SUPPLY_VOLTS / LOAD_OHMS;
  return Math.min(ceiling, COLLECTOR_LEAK_AMPS + parameters.alpha * emitterAmps);
}

function restingCollectorAmps(parameters) {
  return collectorAmpsFor(parameters, emitterAmpsFor(parameters, 0));
}

// Everything at one instant. `outputVolts` is the changing part of the voltage across the load.
function sampleAt(parameters, seconds) {
  const inputVolts = inputVoltsAt(parameters, seconds);
  const emitterAmps = emitterAmpsFor(parameters, inputVolts);
  const collectorAmps = collectorAmpsFor(parameters, emitterAmps);
  const outputVolts = (collectorAmps - restingCollectorAmps(parameters)) * LOAD_OHMS;
  return { seconds, inputVolts, emitterAmps, collectorAmps, outputVolts };
}

function swingOf(values) {
  return Math.max(...values) - Math.min(...values);
}

// Gain measured from one whole cycle of the waveforms, the way one would read it off two oscilloscope traces.
function measureGain(parameters, samplesPerCycle = 360) {
  const samples = [];
  for (let index = 0; index < samplesPerCycle; index++) samples.push(sampleAt(parameters, index / samplesPerCycle / SIGNAL_HERTZ));
  const inputSwing = swingOf(samples.map((sample) => sample.inputVolts));
  const outputSwing = swingOf(samples.map((sample) => sample.outputVolts));
  const emitterSwing = swingOf(samples.map((sample) => sample.emitterAmps));
  const collectorSwing = swingOf(samples.map((sample) => sample.collectorAmps));
  const voltage = inputSwing > 1e-12 ? outputSwing / inputSwing : 0;
  const inputAmpsSwing = inputSwing / EMITTER_OHMS;
  const current = inputAmpsSwing > 1e-15 ? collectorSwing / inputAmpsSwing : 0;
  const expected = smallSignalGain(parameters);
  // Clipped: the emitter cuts off or the collector reaches its ceiling for part of the cycle.
  const clipped = parameters.biasOn && inputSwing > 1e-12 && voltage < expected.voltage * 0.995;
  return { inputSwing, outputSwing, emitterSwing, collectorSwing, voltage, current, power: voltage * current, clipped };
}

// The same gains from the model's slopes, valid while nothing clips.
function smallSignalGain(parameters) {
  if (!parameters.biasOn) return { current: 0, voltage: 0, power: 0 };
  const voltage = (parameters.alpha * LOAD_OHMS) / EMITTER_OHMS;
  return { current: parameters.alpha, voltage, power: parameters.alpha * voltage };
}

// The largest input level that still gives an undistorted output with the bias on.
function linearLimit() {
  return (EMITTER_BIAS_AMPS * EMITTER_OHMS) / INPUT_FULL_VOLTS;
}

// The drawing's moving charges. Each of `slots` charges crosses in CROSSING_SECONDS, one after another.
// A slot shows only if the current at the moment that charge set off was large enough to need it, so a
// swelling current is seen as a denser bunch travelling across. Returns [{ along, lane, strength }].
function streamAt(seconds, slots, fullAmps, ampsAt) {
  const charges = [];
  for (let slot = 0; slot < slots; slot++) {
    const turn = seconds / CROSSING_SECONDS + slot / slots;
    const along = turn - Math.floor(turn);
    const setOff = seconds - along * CROSSING_SECONDS;
    // Slots are ranked so that the ones a small current uses are spread evenly along the path.
    const rank = ((slot * 7) % slots) / slots;
    const needed = (rank + 0.02) * fullAmps;
    const strength = smooth(needed, needed + fullAmps * 0.08, ampsAt(setOff));
    if (strength > 0.01) charges.push({ along, lane: ((slot * 5) % slots) / slots, strength });
  }
  return charges;
}

const EMITTER_FULL_AMPS = EMITTER_BIAS_AMPS * 2.3;
const COLLECTOR_FULL_AMPS = COLLECTOR_LEAK_AMPS + ALPHA_RANGE[1] * EMITTER_FULL_AMPS * 0.75;

function holesAt(parameters, seconds, slots = 9) {
  return streamAt(seconds, slots, EMITTER_FULL_AMPS, (time) => sampleAt(parameters, time).emitterAmps);
}

function outflowAt(parameters, seconds, slots = 26) {
  return streamAt(seconds, slots, COLLECTOR_FULL_AMPS, (time) => sampleAt(parameters, time).collectorAmps);
}

// How strongly each numbered step shows at `phase` (0 to 1) of the walk-through.
function stepsAt(phase) {
  return STEP_STARTS.map((start) => smooth(start, start + STEP_RAMP, phase));
}

function describe(parameters) {
  if (!parameters.biasOn) return "bias off · no gain";
  const gain = measureGain(parameters);
  if (gain.inputSwing < 1e-9) return "bias on · no input";
  const power = gain.power >= 10 ? gain.power.toFixed(0) : gain.power.toFixed(1);
  return `bias on · voltage ×${gain.voltage.toFixed(1)} · power ×${power}${gain.clipped ? " · clipping" : ""}`;
}

const TransistorApi = {
  SIGNAL_HERTZ,
  INPUT_FULL_VOLTS,
  EMITTER_OHMS,
  EMITTER_BIAS_AMPS,
  LOAD_OHMS,
  COLLECTOR_SUPPLY_VOLTS,
  COLLECTOR_LEAK_AMPS,
  ALPHA_DEFAULT,
  ALPHA_RANGE,
  CROSSING_SECONDS,
  EMITTER_FULL_AMPS,
  COLLECTOR_FULL_AMPS,
  DEFAULTS,
  STEPS,
  STEP_STARTS,
  clamp,
  smooth,
  createParameters,
  inputVoltsAt,
  emitterAmpsFor,
  collectorAmpsFor,
  sampleAt,
  measureGain,
  smallSignalGain,
  linearLimit,
  holesAt,
  outflowAt,
  stepsAt,
  describe,
};

Transistor = TransistorApi;
}
let Explode;
{
// Pure model of the exploded view: which assemblies the first transistor comes apart into, where each
// one goes, the staggered springs that carry them, the painter's order of the items in any frame of the
// flight and a coarse check that no solid block passes through another on the way.
// No DOM in here; the build, the page and the audit all read this one file.
// Adapted from the Enigma figure (../enigma-anatomy/explode.mjs).

const SPRING = { stagger: 0.34, stiffness: 46, damping: 11.2, substeps: 4 };

// `move` is in world units (x to the collector side, y towards the viewer, z up). The pose spreads
// sideways so that it fills a wide frame and no part hangs in front of another: the wedge and its foil
// go to the left, the leads to the right behind the board, the spring steps aside from under the arm,
// and the germanium and the base rise where they are.
// A piece with `ride` is carried by that piece's spring as well as its own: the foil rides on the wedge.
const PIECES = {
  spring: { number: 1, name: "Spring: a bent wire that presses the wedge down", move: [-14, 14, 0] },
  wedge: { number: 2, name: "Plastic wedge, a triangle with its point down", move: [-64, 38, 22] },
  foil: { number: 3, name: "Gold foil, slit at the point into two contacts: emitter and collector", move: [0, 22, 0], ride: "wedge" },
  germanium: { number: 4, name: "Germanium slab", move: [0, 0, 25] },
  base: { number: 5, name: "Metal base: the third contact, under the germanium", move: [0, 0, 7] },
  leads: { number: 6, name: "Leads to the emitter, the collector and the base", move: [74, -50, 23] },
  stand: { number: 7, name: "Stand with the demonstration circuit: signal, two batteries, load", move: [0, 0, 0] },
};

// Whoever is outside leaves first; closing runs the same list backwards.
const LEAVE_ORDER = ["leads", "spring", "wedge", "foil", "germanium", "base"];

const TOUCH = 0.6;
const SCREEN_GAP = 0.4;

function createExplode() {
  const shares = {};
  for (const name of LEAVE_ORDER) shares[name] = { x: 0, v: 0, target: 0, pending: null, landed: true, crossed: false };
  return { shares, apart: false, time: 0 };
}

// Reschedules only the assemblies whose target changes: one that has not left yet simply stays.
function setApart(state, apart, calm) {
  state.apart = apart;
  const target = apart ? 1 : 0;
  const order = apart ? LEAVE_ORDER : LEAVE_ORDER.slice().reverse();
  let index = 0;
  for (const name of order) {
    const share = state.shares[name];
    if (calm) {
      Object.assign(share, { x: target, v: 0, target, pending: null, landed: true, crossed: false });
      continue;
    }
    if (share.pending && share.pending.value !== target) share.pending = null;
    const heading = share.pending ? share.pending.value : share.target;
    if (heading === target) continue;
    share.pending = { value: target, at: state.time + index * SPRING.stagger };
    index += 1;
  }
}

function stepShare(state, name, dt, events) {
  const share = state.shares[name];
  if (share.pending && state.time >= share.pending.at - 1e-9) {
    share.target = share.pending.value;
    share.pending = null;
    share.landed = false;
    share.crossed = false;
    events.push({ name: share.target === 1 ? "leave" : "return", piece: name, at: state.time });
  }
  if (share.landed) return;
  const before = share.x - share.target;
  share.v += (SPRING.stiffness * (share.target - share.x) - SPRING.damping * share.v) * dt;
  share.x += share.v * dt;
  const after = share.x - share.target;
  if (!share.crossed && before * after <= 0) {
    share.crossed = true;
    events.push({ name: share.target === 1 ? "arrive" : "land", piece: name, at: state.time });
  }
  if (Math.abs(after) < 0.0005 && Math.abs(share.v) < 0.004) {
    share.x = share.target;
    share.v = 0;
    share.landed = true;
  }
}

// Advances every spring by `seconds` and returns what happened: leave, arrive, return, land.
function stepExplode(state, seconds) {
  const events = [];
  // Never a step longer than 1/120 s, so a long jump of the clock cannot shake the springs loose.
  const steps = Math.max(SPRING.substeps, Math.ceil(seconds * 120));
  const dt = seconds / steps;
  for (let step = 0; step < steps; step++) {
    state.time += dt;
    for (const name of LEAVE_ORDER) stepShare(state, name, dt, events);
  }
  return events;
}

function isResting(state) {
  return LEAVE_ORDER.every((name) => state.shares[name].landed && !state.shares[name].pending);
}

function maxShare(state) {
  return Math.max(...LEAVE_ORDER.map((name) => state.shares[name].x));
}

function shareOf(state, piece) {
  return piece === "stand" ? 0 : state.shares[piece].x;
}

function displacementOf(state, piece) {
  const part = PIECES[piece];
  const own = shareOf(state, piece);
  const shift = [part.move[0] * own, part.move[1] * own, part.move[2] * own];
  // A carrier may itself be carried: the pin half rides on the right rotor, which rides on the spindle.
  if (part.ride) {
    const carried = displacementOf(state, part.ride);
    for (let axis = 0; axis < 3; axis++) shift[axis] += carried[axis];
  }
  return shift;
}

function shiftsOf(state) {
  const shifts = {};
  for (const name of Object.keys(PIECES)) shifts[name] = displacementOf(state, name);
  return shifts;
}

function fullShifts() {
  const state = createExplode();
  setApart(state, true, true);
  return shiftsOf(state);
}

function movedBox(bounds, shift) {
  return [bounds[0] + shift[0], bounds[1] + shift[0], bounds[2] + shift[1], bounds[3] + shift[1], bounds[4] + shift[2], bounds[5] + shift[2]];
}

// The silhouette of an axis-aligned box in this camera is a hexagon whose edges run along the three
// projected axes, so two silhouettes overlap exactly when their extents overlap across each axis.
// `axes` holds the screen direction of world x, y and z.
function silhouetteOf(box, axes) {
  const bands = [];
  for (let across = 0; across < 3; across++) {
    const normal = [-axes[across][1], axes[across][0]];
    let low = 0;
    let high = 0;
    for (let axis = 0; axis < 3; axis++) {
      if (axis === across) continue;
      const weight = axes[axis][0] * normal[0] + axes[axis][1] * normal[1];
      const a = box[axis * 2] * weight;
      const b = box[axis * 2 + 1] * weight;
      low += Math.min(a, b);
      high += Math.max(a, b);
    }
    bands.push(low, high);
  }
  return bands;
}

function silhouettesOverlap(a, b) {
  for (let band = 0; band < 6; band += 2) {
    if (a[band] >= b[band + 1] - SCREEN_GAP || b[band] >= a[band + 1] - SCREEN_GAP) return false;
  }
  return true;
}

// Every axis points towards the viewer in this camera, so a box that ends before another begins,
// along any axis, is behind it wherever the two overlap on screen.
function endsBefore(a, b) {
  return a[1] <= b[0] + TOUCH || a[3] <= b[2] + TOUCH || a[5] <= b[4] + TOUCH;
}

// A wire that an assembly's path has to cross is declared on its item (`crosses`): no order is
// measured between the two, and the audit lists the pair instead of hiding it.
function crossingDeclared(a, b) {
  return a.crosses === b.piece || b.crosses === a.piece;
}

function sameShift(a, b) {
  return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]) < 1e-6;
}

// The painter's order of the items for one set of shifts. Items keep their hand-set rank unless two
// that have moved relative to each other overlap on screen with one measurably behind the other.
function paintOrder(items, shifts, axes) {
  const count = items.length;
  const boxes = items.map((item) => (item.bounds ? movedBox(item.bounds, shifts[item.piece]) : null));
  const outlines = boxes.map((box) => (box ? silhouetteOf(box, axes) : null));
  const followers = items.map(() => []);
  const blockers = items.map(() => []);
  const waiting = new Array(count).fill(0);
  for (let first = 0; first < count; first++) {
    if (!boxes[first]) continue;
    for (let second = first + 1; second < count; second++) {
      if (!boxes[second] || crossingDeclared(items[first], items[second])) continue;
      if (!silhouettesOverlap(outlines[first], outlines[second])) continue;
      let back = first;
      let front = second;
      const moved = !sameShift(shifts[items[first].piece], shifts[items[second].piece]);
      if (moved) {

}

function boxBetween(from, to, share) {
  const mix = (name) => from[name] + (to[name] - from[name]) * share;
  return { x: mix("x"), y: mix("y"), width: mix("width"), height: mix("height") };
}

// Four straight lines, corner to corner, from one box to another.
function cornerLines(from, to, origin) {
  let d = "";
  for (const [across, down] of [[0, 0], [1, 0], [1, 1], [0, 1]]) {
    const startX = from.x + from.width * across - origin.left;
    const startY = from.y + from.height * down - origin.top;
    const endX = to.x + to.width * across - origin.left;
    const endY = to.y + to.height * down - origin.top;
    d += `M${startX.toFixed(1)} ${startY.toFixed(1)}L${endX.toFixed(1)} ${endY.toFixed(1)}`;
  }
  return d;
}

function setZoomTransform(value) {
  if (birth.transform === value) return;
  birth.transform = value;
  zoomFrame.style.transform = value;
}

function drawBirthGuides(source, current) {
  const origin = birthParts.layer.getBoundingClientRect();
  write(birthParts.source, "x", (source.x - origin.left).toFixed(1));
  write(birthParts.source, "y", (source.y - origin.top).toFixed(1));
  write(birthParts.source, "width", source.width.toFixed(1));
  write(birthParts.source, "height", source.height.toFixed(1));
  write(birthParts.lines, "d", cornerLines(source, current, origin));
}

function drawBirth() {
  const now = birthAt(birth.seconds);
  write(zoomFrame, "opacity", now.frame.toFixed(2));
  write(birthParts.source, "opacity", now.guides.toFixed(2));
  write(birthParts.lines, "opacity", now.guides.toFixed(2));
  if (now.guides < 0.005) {
    setZoomTransform("");
    return;
  }
  const final = detail.getBoundingClientRect();
  const source = sourceOnScreen();
  const current = boxBetween(source, final, now.grown);
  const shift = `translate(${(current.x - final.x).toFixed(2)}px,${(current.y - final.y).toFixed(2)}px)`;
  setZoomTransform(now.grown < 1 ? `${shift} scale(${(current.width / final.width).toFixed(4)})` : "");
  drawBirthGuides(source, current);
}

// ---- controls ------------------------------------------------------------------------------------------

function setBias(on) {
  if (on === parameters.biasOn) return;
  parameters = Transistor.createParameters({ ...parameters, biasOn: on });
  emit("bias-switch", { on });
  if (on) emit("amplify", { duration: 1.2 });
  say(on ? `Batteries connected. ${measured().text}.` : "Batteries disconnected. Nothing is amplified.");
  draw();
  run();
}

function setLevel(level) {
  parameters = Transistor.createParameters({ ...parameters, inputLevel: level });
  const shown = String(Math.round(parameters.inputLevel * 100));
  if (levelInput.value !== shown) levelInput.value = shown;
  if (still.matches) fillHistory();
  draw();
  run();
}

function onKey(event) {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const hit = event.target.closest("[data-hit]");
  const letter = event.key.toUpperCase();
  if (letter === "B" || (hit && (event.key === "Enter" || event.key === " "))) {
    event.preventDefault();
    setBias(!parameters.biasOn);
    return;
  }
  if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
  event.preventDefault();
  setLevel(parameters.inputLevel + (event.key === "ArrowRight" ? LEVEL_STEP : -LEVEL_STEP));
  say(`Input level ${Math.round(parameters.inputLevel * 100)} percent. ${measured().text}.`);
}

// ---- loop ----------------------------------------------------------------------------------------------

function tick(now) {
  const seconds = clock.last ? Math.min((now - clock.last) / 1000, 1 / 30) : 1 / 60;
  clock.last = now;
  const flying = stepApart(seconds);
  const running = !still.matches && !apartBusy();
  advance(seconds, running);
  advanceBirth(seconds);
  draw();
  clock.frame = clock.visible && (running || flying || birthBusy()) ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (manual || clock.frame || !clock.visible) return;
  clock.last = 0;
  clock.frame = requestAnimationFrame(tick);
}

if (!manual) {
  stage.addEventListener("click", (event) => {
    if (event.target.closest("[data-hit]")) setBias(!parameters.biasOn);
  });
  stage.addEventListener("keydown", onKey);
  biasButton.addEventListener("click", () => setBias(!parameters.biasOn));
  levelInput.addEventListener("input", () => setLevel(Number(levelInput.value) / 100));
  new IntersectionObserver(
    (entries) => {
      clock.visible = entries[entries.length - 1].isIntersecting;
      if (clock.visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  still.addEventListener("change", () => {
    if (still.matches) birth.seconds = BIRTH_SECONDS;
    fillHistory();
    draw();
    run();
  });
}

// The exploded view, the sounds and the film hooks of the first-transistor figure. The build inlines
// this file right after live.js, inside the same block: it uses that file's clock, parts and helpers,
// and it ends with the start-up that brings the page to its first frame.
// Adapted from the Enigma figure (../enigma-anatomy/apart.js).

const EX = CONFIG.explode;
const explode = Explode.createExplode();
const world = one("world");
const lens = one("lens");
const itemNodes = Array.from(world.children);
const badges = Array.from(document.querySelectorAll("[data-badge]"));
const apartButton = document.querySelector("[data-apart]");
const soundButton = document.querySelector("[data-sound]");
const worldZero = iso([0, 0, 0], P);
const AXES = [[1, 0, 0], [0, 1, 0], [0, 0, 1]].map((axis) => {
  const tip = iso(axis, P);
  return [tip[0] - worldZero[0], tip[1] - worldZero[1]];
});
const apartState = { painted: itemNodes.map((_, index) => index) };
const filmView = { camera: null };
const eventLog = [];
const FLIGHT_SECONDS = Explode.SPRING.stagger * Explode.LEAVE_ORDER.length + 0.5;

// ---- state ---------------------------------------------------------------------------------------------

function apartBusy() {
  return explode.apart || !Explode.isResting(explode);
}

function apartReadout() {
  if (explode.apart) return Explode.isResting(explode) ? "apart · paused" : "coming apart";
  if (!Explode.isResting(explode)) return "going back together";
  return null;
}

function openApart(calm) {
  Explode.setApart(explode, true, calm);
  emit("apart-open", { duration: FLIGHT_SECONDS });
  if (calm) emit("apart-hold", {});
  say("The device is apart in seven numbered assemblies. The currents are paused.");
}

function closeApart(calm) {
  Explode.setApart(explode, false, calm);
  emit("apart-close", { duration: FLIGHT_SECONDS });
  if (calm) emit("apart-seated", {});
  say("The device is going back together.");
}

function toggleApart() {
  explode.time = clock.elapsed;
  if (explode.apart) closeApart(still.matches);
  else openApart(still.matches);
  draw();
  run();
}

function everyShare(test) {
  return Explode.LEAVE_ORDER.every((name) => test(explode.shares[name]));
}

// Advances the springs and reports whether anything is still in flight.
function stepApart(seconds) {
  if (Explode.isResting(explode)) return false;
  for (const event of Explode.stepExplode(explode, seconds)) {
    emit(`piece-${event.name}`, { piece: event.piece, number: Explode.PIECES[event.piece].number }, event.at);
    const arrived = (share) => !share.pending && (share.landed || share.crossed);
    if (event.name === "arrive" && everyShare((share) => share.target === 1 && arrived(share))) emit("apart-hold", {}, event.at);
    if (event.name === "land" && everyShare((share) => share.target === 0 && arrived(share))) {
      emit("apart-seated", {}, event.at);
      emit("amplify", { duration: 1.4 }, event.at + 0.35);
    }
  }
  return true;
}

// ---- drawing -------------------------------------------------------------------------------------------

function sameList(a, b) {
  for (let index = 0; index < a.length; index++) {
    if (a[index] !== b[index]) return false;
  }
  return true;
}

// Re-appends the items only when the painter's order really changed.
function paintItems(shifts) {
  const assembled = Explode.isResting(explode) && !explode.apart;
  const order = assembled ? itemNodes.map((_, index) => index) : Explode.paintOrder(EX.items, shifts, AXES).order;
  if (sameList(order, apartState.painted)) return;
  const fragment = document.createDocumentFragment();
  for (const index of order) fragment.appendChild(itemNodes[index]);
  world.appendChild(fragment);
  apartState.painted = order;
}

// The page pulls back just far enough to keep the apart pose inside the card; the film sets its own camera.
function worldView(open) {
  if (filmView.camera) return filmView.camera;
  const centre = [EX.width / 2, EX.height / 2];
  if (EX.film) return { x: centre[0], y: centre[1], zoom: 1 };
  const fit = Math.min(1, (EX.width - 44) / EX.apart.width, (EX.height - 44) / EX.apart.height);
  const share = Transistor.smooth(0, 1, open);
  return { x: centre[0] + (EX.apart.x - centre[0]) * share, y: centre[1] + (EX.apart.y - centre[1]) * share, zoom: 1 + (fit - 1) * share };
}

function placeOnStage(node, point, view, opacity) {
  const spot = iso(point, P);
  const place = `${(((EX.width / 2 + (spot[0] - view.x) * view.zoom) / EX.width) * 100).toFixed(2)}%`;
  const drop = `${(((EX.height / 2 + (spot[1] - view.y) * view.zoom) / EX.height) * 100).toFixed(2)}%`;
  if (node.style.left !== place) node.style.left = place;
  if (node.style.top !== drop) node.style.top = drop;
  if (node.style.opacity !== opacity) node.style.opacity = opacity;
}

function placeBadges(shifts, view) {
  for (const badge of badges) {
    const name = badge.getAttribute("data-badge");
    const anchor = EX.anchors[name];
    const shift = shifts[name];
    const share = name === "stand" ? Explode.maxShare(explode) : Explode.shareOf(explode, name);
    placeOnStage(badge, [anchor[0] + shift[0], anchor[1] + shift[1], anchor[2] + shift[2]], view, Transistor.smooth(0.5, 0.95, share).toFixed(2));
  }
}

function setBodyNumber(name, value) {
  if (document.body.style.getPropertyValue(name) !== value) document.body.style.setProperty(name, value);
}

function drawApart() {
  const shifts = Explode.shiftsOf(explode);
  const open = Math.min(1, Math.max(0, Explode.maxShare(explode)));
  itemNodes.forEach((node, index) => {
    const shift = shifts[EX.items[index].piece];
    const moved = Math.abs(shift[0]) + Math.abs(shift[1]) + Math.abs(shift[2]) > 1e-6;
    write(node, "transform", moved ? translateAlong(P, shift) : null);
  });
  paintItems(shifts);
  const view = worldView(open);
  const centredAtRest = view.zoom === 1 && view.x === EX.width / 2 && view.y === EX.height / 2;
  const centred = `translate(${EX.width / 2} ${EX.height / 2}) scale(${view.zoom.toFixed(4)}) translate(${(-view.x).toFixed(2)} ${(-view.y).toFixed(2)})`;
  write(lens, "transform", centredAtRest ? null : centred);
  placeBadges(shifts, view);
  const least = Math.min(...Explode.LEAVE_ORDER.map((name) => Explode.shareOf(explode, name)));
  setBodyNumber("--tr-apart", Transistor.smooth(0.55, 0.95, least).toFixed(2));
  setBodyNumber("--tr-open", Transistor.smooth(0, 0.3, open).toFixed(2));
  write(stage, "data-open", open > 0.005 ? "" : null);
  write(apartButton, "aria-pressed", String(explode.apart));
  write(apartButton, "text", explode.apart ? "Put together" : "Take apart");
}

// ---- sound ---------------------------------------------------------------------------------------------
// The figure reports what happens as named events with a time on its own clock. The page plays them
// through Web Audio when the reader turns sound on; the recorder takes the log and renders the film's
// track offline (sound.mjs). The device itself is silent, so there is little to hear: a soft tap for the
// switch and for each part that leaves or lands, and a very soft low swell when the amplified current
// starts. No tones, nothing continuous, and a low master gain.

const sound = { on: false, context: null, master: null, bus: null, noise: null };
const MASTER_GAIN = 0.16;
const HIGH_PASS = 110;
const LOW_PASS = 3500;
const MODE_GAIN = 3;
const TAP_SECONDS = 0.07;
const SWELL_GAIN = 0.08;
const SWELL_LOW_PASS = 420;
const LIGHT_PIECES = ["foil", "spring", "leads"];
const decibels = (value) => 10 ** (value / 20);
const BODIES = {
  label: { modes: [[620, 0.004, 1], [1150, 0.003, 0.45]], attack: 0.004, blow: 0.004 },
  toggle: { modes: [[240, 0.006, 1], [480, 0.004, 0.45]], attack: 0.005, blow: 0.006 },
  part: { modes: [[380, 0.005, 1], [760, 0.0035, 0.4]], attack: 0.004, blow: 0.005 },
  light: { modes: [[900, 0.003, 1], [1600, 0.0022, 0.4]], attack: 0.003, blow: 0.003 },
  reseat: { modes: [[190, 0.008, 1], [380, 0.006, 0.5]], attack: 0.006, blow: 0.008 },
};
const LEVELS = { toggle: decibels(0), label: decibels(-3), part: decibels(-7), partLeaving: decibels(-10), light: decibels(-9), reseat: decibels(-3) };

function emit(name, detail, at = null) {
  if (manual) eventLog.push({ name, at: Math.round((at ?? clock.elapsed) * 10000) / 10000, ...detail });
  if (sound.on && sound.context) VOICES[name]?.(detail);
}

// Everything goes through a gentle high-pass and a gentle low-pass, then one low master gain.
function audioReady() {
  if (sound.context) return sound.context;
  const context = new AudioContext();
  const buffer = context.createBuffer(1, context.sampleRate * 2, context.sampleRate);
  const samples = buffer.getChannelData(0);
  for (let index = 0; index < samples.length; index++) samples[index] = Math.random() * 2 - 1;
  sound.context = context;
  sound.noise = buffer;
  sound.master = context.createGain();
  sound.master.gain.value = MASTER_GAIN;
  sound.master.connect(context.destination);
  const dull = context.createBiquadFilter();
  dull.type = "lowpass";
  dull.frequency.value = LOW_PASS;
  dull.Q.value = 0.5;
  dull.connect(sound.master);
  sound.bus = context.createBiquadFilter();
  sound.bus.type = "highpass";
  sound.bus.frequency.value = HIGH_PASS;
  sound.bus.Q.value = 0.5;
  sound.bus.connect(dull);
  return context;
}

// No two taps are the same: a few per cent of pitch, a couple of decibels, a few milliseconds.
function variationOf() {
  const spread = () => Math.random() * 2 - 1;
  return { pitch: 1 + spread() * 0.07, level: decibels(spread() * 2), late: Math.random() * 0.004 };
}

// One tap: the noise of the blow fades in over a few milliseconds, never at once, and dies away; two
// low-Q resonances give it its body and are silent again within about 35 ms.
function tap(body, level) {
  const context = sound.context;
  const variation = variationOf();
  const start = context.currentTime + variation.late;
  const source = context.createBufferSource();
  const blow = context.createGain();
  source.buffer = sound.noise;
  source.loop = true;
  blow.gain.setValueAtTime(0, start);
  blow.gain.linearRampToValueAtTime(1, start + body.attack);
  blow.gain.setTargetAtTime(0, start + body.attack, body.blow);
  source.connect(blow);
  for (const [frequency, ringTime, share] of body.modes) {
    const mode = context.createBiquadFilter();
    const out = context.createGain();
    mode.type = "bandpass";
    mode.frequency.value = frequency * variation.pitch;
    mode.Q.value = Math.max(1, Math.PI * frequency * ringTime);
    out.gain.value = share * level * variation.level * MODE_GAIN;
    blow.connect(mode).connect(out).connect(sound.bus);
  }
  source.start(start, Math.random() * 0.5);
  source.stop(start + TAP_SECONDS);
}

// The amplified current starting: low noise that rises and falls once, far quieter than any tap.
function swell(seconds) {
  const context = sound.context;
  const start = context.currentTime;
  const source = context.createBufferSource();
  const soft = context.createBiquadFilter();
  const level = context.createGain();
  source.buffer = sound.noise;
  source.loop = true;
  soft.type = "lowpass";
  soft.frequency.value = SWELL_LOW_PASS;
  soft.Q.value = 0.5;
  level.gain.setValueAtTime(0, start);
  level.gain.linearRampToValueAtTime(SWELL_GAIN, start + seconds / 2);
  level.gain.linearRampToValueAtTime(0, start + seconds);
  source.connect(soft).connect(level).connect(sound.bus);
  source.start(start, Math.random());
  source.stop(start + seconds + 0.05);
}

function partTap(detail, level) {
  const light = LIGHT_PIECES.includes(detail.piece);
  tap(light ? BODIES.light : BODIES.part, light ? level * decibels(-2) : level);
}

const VOICES = {
  "step-label": () => tap(BODIES.label, LEVELS.label),
  "bias-switch": () => tap(BODIES.toggle, LEVELS.toggle),
  amplify: (detail) => swell(detail.duration ?? 1.4),
  "piece-leave": (detail) => partTap(detail, LEVELS.partLeaving),
  "piece-land": (detail) => partTap(detail, LEVELS.part),
  "apart-seated": () => tap(BODIES.reseat, LEVELS.reseat),
};

function toggleSound() {
  sound.on = !sound.on;
  if (sound.on) audioReady().resume();
  soundButton.setAttribute("aria-pressed", String(sound.on));
  soundButton.textContent = sound.on ? "Sound on" : "Sound";
}

// ---- start ---------------------------------------------------------------------------------------------

if (!manual) {
  stage.addEventListener("keydown", (event) => {
    if (!event.shiftKey || event.ctrlKey || event.metaKey || event.altKey || event.key.toUpperCase() !== "E") return;
    event.preventDefault();
    toggleApart();
  });
  apartButton.addEventListener("click", toggleApart);
  soundButton.addEventListener("click", toggleSound);
}

fillHistory();
if (query.get("apart") === "1") Explode.setApart(explode, true, true);
draw();

// A deterministic clock for frame-by-frame capture: open the page with ?clock=manual and drive it from
// here. Every call advances the figure's own clock, so the event log carries exact film times.
window.__transistor = {
  advance(seconds) {
    explode.time = clock.elapsed;
    stepApart(seconds);
    advance(seconds, !apartBusy());
    draw();
  },
  setApart(apart) {
    explode.time = clock.elapsed;
    if (apart) openApart(false);
    else closeApart(false);
  },
  holdWalk() {
    holdWalk();
  },
  walk(seconds) {
    startWalk(seconds);
  },
  birth(seconds) {
    birth.seconds = seconds;
  },
  setBias(on) {
    setBias(on);
  },
  setLevel(level) {
    setLevel(level);
  },
  camera(x, y, zoom, weight) {
    filmView.camera = { x, y, zoom };
    document.body.style.setProperty("--anatomy-weight", `${weight}px`);
    draw();
  },
  steps(opacity) {
    steps.shown = opacity;
    document.body.style.setProperty("--tr-steps", String(opacity));
  },
  detail(opacity) {
    document.body.style.setProperty("--tr-detail", String(opacity));
  },
  view() {
    return { width: EX.width, height: EX.height, apart: EX.apart, rest: EX.rest, detailLeft: detail.getBoundingClientRect().left };
  },
  takeEvents() {
    return eventLog.splice(0);
  },
  state() {
    const sample = Transistor.sampleAt(parameters, clock.signal);
    const gain = measured().gain;
    return {
      biasOn: parameters.biasOn,
      inputLevel: parameters.inputLevel,
      voltageGain: Math.round(gain.voltage * 1000) / 1000,
      powerGain: Math.round(gain.power * 100) / 100,
      clipped: gain.clipped,
      inputVolts: Math.round(sample.inputVolts * 10000) / 10000,
      outputVolts: Math.round(sample.outputVolts * 10000) / 10000,
      charges: parts.inflow.childElementCount,
      outflow: parts.outflow.childElementCount,
      walk: Math.round(walk.phase * 10000) / 10000,
      apart: explode.apart,
      open: Math.round(Explode.maxShare(explode) * 10000) / 10000,
      resting: Explode.isResting(explode),
      time: Math.round(clock.elapsed * 10000) / 10000,
      readout: readout.textContent,
    };
  },
};

}
</script></body></html>
