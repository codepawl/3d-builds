<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jacquard Loom Anatomy</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

.iso[data-theme="light"]{--anatomy-weight:.9px;--anatomy-lo:#85858c;--anatomy-mid:#55555c;--anatomy-hi:#1a1a1e;--anatomy-faint:#bcbcc1;--anatomy-muted:#6c6c72;--anatomy-text:#3f3f45;--anatomy-shade-0:#cdcdc8;--anatomy-shade-1:#dadad5;--anatomy-shade-2:#e5e5e0;--anatomy-shade-3:#efefea;--anatomy-top:#f9f9f6;--jq-ink:#63636a;--jq-hole:#8d8d94;--jq-wire:#66666d}

.iso[data-theme="dark"]{--anatomy-weight:.9px;--anatomy-page:#09090a;--anatomy-card:#111113;--anatomy-lo:#7a7a82;--anatomy-mid:#a6a6ae;--anatomy-hi:#e4e4e8;--anatomy-faint:#4c4c53;--anatomy-muted:#8b8b93;--anatomy-text:#bcbcc3;--anatomy-shade-0:#1e1e22;--anatomy-shade-1:#26262b;--anatomy-shade-2:#2f2f35;--anatomy-shade-3:#38383f;--anatomy-top:#44444c;--jq-ink:#a0a0a9;--jq-hole:#060607;--jq-wire:#b4b4bc}
.iso[data-theme="dark"] .jq-item[data-piece="frame"]{--anatomy-shade-0:#17171a;--anatomy-shade-1:#1c1c20;--anatomy-shade-2:#222227;--anatomy-shade-3:#28282e;--anatomy-top:#303037}
.iso-line.jq-wire[data-dyn]{--glow:0;stroke:color-mix(in srgb,var(--anatomy-lit) calc(var(--glow)*100%),var(--jq-wire));stroke-width:calc(var(--anatomy-weight)*1.1 + var(--glow)*var(--anatomy-weight)*1.5)}
.jq-hole{fill:var(--jq-hole);stroke:var(--anatomy-hi);stroke-width:var(--anatomy-weight);stroke-linejoin:round}
.jq-blank{fill:var(--anatomy-lo);stroke:none}
.jq-lace{fill:var(--anatomy-mid);stroke:none}
.jq-card-lit{--glow:0;fill:var(--anatomy-lit);stroke:var(--anatomy-lit);stroke-width:calc(var(--anatomy-weight)*2);stroke-linejoin:round;opacity:var(--glow)}
.jq-ink{fill:var(--jq-ink);stroke:none}
.jq-new{--glow:0;fill:color-mix(in srgb,var(--anatomy-lit) calc(var(--glow)*100%),var(--jq-ink));stroke:none}
.jq-hit{fill:#fff;fill-opacity:0;stroke:none;cursor:pointer;outline:none}
.iso[data-theme="light"] .jq-hit{fill:#000}
.jq-hit:hover,.jq-hit:focus-visible{fill-opacity:.22}
.iso-stage[data-open] .jq-hit{display:none}
.iso-stage{position:relative;touch-action:pan-y;outline:none;user-select:none;-webkit-user-select:none}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.jq-badges{position:absolute;inset:0;pointer-events:none}
.jq-badge,.jq-num{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;flex:none;font-family:var(--anatomy-mono);font-size:10.5px;font-weight:600;line-height:1;color:var(--anatomy-card);background:var(--anatomy-strong);font-variant-numeric:tabular-nums}
.jq-badge{position:absolute;left:0;top:0;margin:-9px 0 0 -9px;opacity:0;box-shadow:0 0 0 2px var(--anatomy-card)}
.jq-parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:5px 18px;margin:0;padding:0;list-style:none}
.jq-parts li{display:flex;align-items:center;gap:8px}
.jq-controls{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-left:-10px;user-select:none;-webkit-user-select:none}
.jq-controls button{font:inherit;font-size:13px;color:var(--anatomy-muted);background:none;border:0;border-radius:6px;padding:5px 10px;cursor:pointer}
.jq-controls button:hover{color:var(--anatomy-strong)}
.jq-controls button[aria-pressed="true"]{color:var(--anatomy-strong);background:color-mix(in srgb,var(--anatomy-strong) 10%,transparent)}
.jq-controls button:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:1px}
.jq-controls [data-step]{margin-left:auto}
.jq-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.jq-film-legend{display:none}
html,body{overflow-x:hidden}

// Pure model of a small Jacquard loom: the card chain, what each card does to the hooks,
// the cloth that results, the timeline of one pick and the shape of the card chain.
// No DOM and no drawing in here; the build, the page and the test all import this file.

const POSITIONS = 8;
const CARDS = 8;

const MOTIFS = {
  diamond: ["00011000", "00111100", "01100110", "11000011", "11000011", "01100110", "00111100", "00011000"],
  flower: ["00011000", "01011010", "00111100", "11100111", "11100111", "00111100", "01011010", "00011000"],
  twill: ["11001100", "01100110", "00110011", "10011001", "11001100", "01100110", "00110011", "10011001"],
};
const MOTIF_NAMES = Object.keys(MOTIFS);

// One pick, as fractions of its duration. A stage is [start, end].
const TIMELINE = {
  turn: [0.02, 0.15],
  swingIn: [0.16, 0.27],
  latch: 0.27,
  rise: [0.3, 0.46],
  shuttle: [0.48, 0.64],
  beatIn: [0.66, 0.74],
  weave: 0.74,
  beatOut: [0.74, 0.82],
  fall: [0.8, 0.92],
  takeUp: [0.84, 1],
  swingOut: [0.92, 1],
};

const STAGES = [
  [0.16, "cylinder turns"],
  [0.28, "card presses the needles"],
  [0.47, "griffe lifts the hooks"],
  [0.65, "shuttle crosses the shed"],
  [0.82, "reed beats the weft"],
  [0.92, "griffe falls"],
  [1.01, "cylinder swings out"],
];

function clamp(value, low, high) {
  return Math.min(high, Math.max(low, value));
}

function smooth(from, to, value) {
  const share = clamp((value - from) / (to - from), 0, 1);
  return share * share * (3 - 2 * share);
}

function mix(a, b, share) {
  return [a[0] + (b[0] - a[0]) * share, a[1] + (b[1] - a[1]) * share];
}

function chainOf(motif) {
  return MOTIFS[motif].map((row) => Array.from(row, (mark) => mark === "1"));
}

function rowBits(row) {
  return row.map((mark) => (mark ? "1" : "0")).join("");
}

// A blank card pushes the needle back by however far the card face has come past the needle's head.
function needleShift(hole, faceX, headX) {
  if (hole) return 0;
  return Math.max(0, faceX - headX);
}

// The needle's loop holds the hook, so the hook leans by the needle's shift, more at its top than at the loop.
function hookLean(shift, hook) {
  return (shift * (hook.top - hook.foot)) / (hook.loop - hook.foot);
}

// A hook stays over the knife only while its lean is less than the beak's overhang past the knife.
function staysOnKnife(lean, hook) {
  return lean < hook.overhang;
}

// The griffe travels a little before its knife meets the beak; from there the hook rises with it.
function hookLift(onKnife, griffeRise, freeTravel) {
  if (!onKnife) return 0;
  return Math.max(0, griffeRise - freeTravel);
}

// Which hooks a card lifts, worked through the mechanism rather than copied from the holes.
function readHooks(card, mechanism) {
  return card.map((hole) => {
    const shift = needleShift(hole, mechanism.pressedFaceX, mechanism.headX);
    const lean = hookLean(shift, mechanism.hook);
    const onKnife = staysOnKnife(lean, mechanism.hook);
    return hookLift(onKnife, mechanism.griffeRise, mechanism.freeTravel) > 0;
  });
}

function liftedCount(row) {
  return row.filter(Boolean).length;
}

function createLoom(motif) {
  return { motif, chain: chainOf(motif), cardIndex: CARDS - 1, picks: 0, cloth: [] };
}

function presentNext(loom) {
  loom.cardIndex = (loom.cardIndex + 1) % CARDS;
  return loom.cardIndex;
}

function weaveRow(loom, row) {
  loom.cloth.push(row.slice());
  loom.picks += 1;
}

function runPick(loom, mechanism) {
  presentNext(loom);
  const row = readHooks(loom.chain[loom.cardIndex], mechanism);
  weaveRow(loom, row);
  return row;
}

function togglePunch(loom, card, position) {
  loom.chain[card][position] = !loom.chain[card][position];
  return loom.chain[card][position];
}

function setMotif(loom, motif) {
  loom.motif = motif;
  loom.chain = chainOf(motif);
}

function poseAt(phase) {
  const T = TIMELINE;
  const pressing = phase < 0.5 ? 1 - smooth(T.swingIn[0], T.swingIn[1], phase) : smooth(T.swingOut[0], T.swingOut[1], phase);
  return {
    turn: smooth(T.turn[0], T.turn[1], phase),
    swing: pressing,
    griffe: smooth(T.rise[0], T.rise[1], phase) - smooth(T.fall[0], T.fall[1], phase),
    shuttle: smooth(T.shuttle[0], T.shuttle[1], phase),
    beat: smooth(T.beatIn[0], T.beatIn[1], phase) - smooth(T.beatOut[0], T.beatOut[1], phase),
    takeUp: smooth(T.takeUp[0], T.takeUp[1], phase),
  };
}

function stageAt(phase) {
  const found = STAGES.find(([until]) => phase < until);
  return found ? found[1] : STAGES[STAGES.length - 1][1];
}

// How far the lit accent has travelled along the row's path at this phase, part by part (0..1 each).
function glowAt(phase) {
  const T = TIMELINE;
  const fade = 1 - smooth(T.fall[0], T.fall[1], phase);
  return {
    card: smooth(0.18, T.latch, phase) * (1 - smooth(T.swingOut[0], T.swingOut[1], phase)),
    needle: smooth(0.2, T.latch, phase) * fade,
    hook: smooth(T.latch, 0.34, phase) * fade,
    harness: smooth(0.33, 0.41, phase) * fade,
    thread: smooth(0.38, T.rise[1], phase) * fade,
    weft: smooth(T.shuttle[0], T.shuttle[0] + 0.03, phase),
    cloth: 1 - smooth(0.9, 1, phase),
  };
}

function leftCrossing(a, b, radius) {
  const dx = b[0] - a[0];
  const dz = b[1] - a[1];
  const span = Math.hypot(dx, dz);
  const reach = Math.sqrt(Math.max(0, radius * radius - (span * span) / 4));
  const middle = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const first = [middle[0] - (dz / span) * reach, middle[1] + (dx / span) * reach];
  const second = [middle[0] + (dz / span) * reach, middle[1] - (dx / span) * reach];
  return first[0] < second[0] ? first : second;
}

// Where the hanging part of the chain rests, in the x-z plane, for a cylinder pressed at `centre`.
function chainShape(centre, half, pitch) {
  const foot = [centre[0] - half, centre[1] - half];
  const lean = 1.4;
  const tilt = 1.64;
  const slot4 = [foot[0] - lean, foot[1] - Math.sqrt(pitch * pitch - lean * lean)];
  const slot5 = [slot4[0] - Math.sqrt(pitch * pitch - tilt * tilt), slot4[1] + tilt];
  const slot7 = [centre[0] - half - pitch, centre[1] + half];
  const slot6 = leftCrossing(slot5, slot7, pitch);
  return { half, pitch, slot4, slot5, slot6, floor: Math.min(slot4[1], slot5[1]) - 0.4 };
}

// Restores one card's length by moving its two hinges, each by its share of freedom (0 = held in place).
function pullLink(hinges, from, to, length, freedom) {
  const a = hinges[from];
  const b = hinges[to];
  const total = freedom[from] + freedom[to];
  if (total <= 0) return;
  const dx = b[0] - a[0];
  const dz = b[1] - a[1];
  const span = Math.hypot(dx, dz) || 1;
  const excess = (span - length) / span;
  const shareA = freedom[from] / total;
  const shareB = freedom[to] / total;
  hinges[from] = [a[0] + dx * excess * shareA, a[1] + dz * excess * shareA];
  hinges[to] = [b[0] - dx * excess * shareB, b[1] - dz * excess * shareB];
}

// The eight hinge points of the laced chain while the cylinder is `turn` (0..1) of the way through a
// quarter turn and its centre is at `centre`. Hinges 0..2 ride the cylinder's corners, hinge 7 slides
// along the guide roller, and 3..6 hang: they are relaxed to keep every card its own length. Hinge 3 is
// still seated on the cylinder's corner as the turn begins and hinge 6 is seated on the roller as it ends,
// so the chain at the end of one pick is exactly the chain at the start of the next.
function chainHinges(turn, centre, shape) {
  const radius = shape.half * Math.SQRT2;
  const corner = (degrees) => {
    const angle = (degrees * Math.PI) / 180;
    return [centre[0] + radius * Math.cos(angle), centre[1] + radius * Math.sin(angle)];
  };
  const arrive = [centre[0] - shape.half - shape.pitch, centre[1] + shape.half];
  const foot = corner(-135);
  const rest = [foot, shape.slot4, shape.slot5, shape.slot6, arrive];
  const hinges = new Array(CARDS);
  hinges[0] = corner(135 - 90 * turn);
  hinges[1] = corner(45 - 90 * turn);
  hinges[2] = corner(-45 - 90 * turn);
  hinges[7] = [arrive[0] + shape.pitch * turn, arrive[1]];
  for (let slot = 3; slot <= 6; slot++) hinges[slot] = mix(rest[slot - 3], rest[slot - 2], turn);
  const freedom = [0, 0, 0, smooth(0, 0.3, turn), 1, 1, 1 - smooth(0.7, 1, turn), 0];
  for (let pass = 0; pass < 60; pass++) {
    for (let link = 2; link <= 6; link++) pullLink(hinges, link, link + 1, shape.pitch, freedom);
    for (let slot = 3; slot <= 6; slot++) {
      if (freedom[slot] > 0 && hinges[slot][1] < shape.floor) hinges[slot] = [hinges[slot][0], shape.floor];
    }
  }
  return hinges;
}

const LoomApi = {
  POSITIONS,
  CARDS,
  MOTIFS,
  MOTIF_NAMES,
  TIMELINE,
  smooth,
  chainOf,
  rowBits,
  needleShift,
  hookLean,
  staysOnKnife,
  hookLift,
  readHooks,
  liftedCount,
  createLoom,
  presentNext,
  weaveRow,
  runPick,
  togglePunch,
  setMotif,
  poseAt,
  stageAt,
  glowAt,
  chainShape,
  chainHinges,
};

Loom = LoomApi;
}
let Explode;
{
// Pure model of the exploded view: which assemblies the loom comes apart into, where each one goes,
// the staggered springs that carry them, the painter's order of the items in any frame of the flight
// and a coarse check that no solid block passes through another on the way.
// No DOM in here; the build, the page and the audit all read this one file.

const SPRING = { stagger: 0.34, stiffness: 46, damping: 11.2, substeps: 4 };

// `move` is in world units (x along the warp towards the cloth, y across, z up). A piece with `ride`
// is carried by that piece's spring as well as its own: hooks and grate leave the frame with the
// needle board they are threaded on, then lift out of it and drop away from it.
const PIECES = {
  chain: { number: 1, name: "Card chain and cradle", move: [0, 0, 44] },
  cylinder: { number: 2, name: "Cylinder and swing arms", move: [12, 0, 4] },
  needles: { number: 3, name: "Needle board, needles and spring box", move: [120, 0, 8] },
  hooks: { number: 4, name: "Hooks and griffe with its knife", move: [8, 0, 60], ride: "needles" },
  grate: { number: 5, name: "Grate, neck cords and bottom board", move: [-6, 0, -12], ride: "needles" },
  harness: { number: 6, name: "Comber board, harness cords, mails and lingoes", move: [0, 0, 55] },
  warp: { number: 7, name: "Warp beam and warp threads", move: [-110, 0, 0] },
  batten: { number: 8, name: "Batten, reed and shuttle", move: [40, 0, 6] },
  cloth: { number: 9, name: "Cloth and cloth roller", move: [105, 0, 0] },
  frame: { number: 10, name: "Wooden frame, treadle and lever", move: [0, 0, 0] },
};

// Whoever is outside leaves first; closing runs the same list backwards.
const LEAVE_ORDER = ["cloth", "batten", "needles", "hooks", "grate", "warp", "harness", "chain", "cylinder"];

const TOUCH = 0.6;
const SCREEN_GAP = 0.4;

function createExplode() {
  const shares = {};
  for (const name of LEAVE_ORDER) shares[name] = { x: 0, v: 0, target: 0, pending: null, landed: true, crossed: false };
  return { shares, apart: false, time: 0 };
}

// Reschedules only the assemblies whose target changes: one that has not left yet simply stays.
function setApart(state, apart, calm) {
  state.apart = apart;
  const target = apart ? 1 : 0;
  const order = apart ? LEAVE_ORDER : LEAVE_ORDER.slice().reverse();
  let index = 0;
  for (const name of order) {
    const share = state.shares[name];
    if (calm) {
      Object.assign(share, { x: target, v: 0, target, pending: null, landed: true, crossed: false });
      continue;
    }
    if (share.pending && share.pending.value !== target) share.pending = null;
    const heading = share.pending ? share.pending.value : share.target;
    if (heading === target) continue;
    share.pending = { value: target, at: state.time + index * SPRING.stagger };
    index += 1;
  }
}

function stepShare(state, name, dt, events) {
  const share = state.shares[name];
  if (share.pending && state.time >= share.pending.at - 1e-9) {
    share.target = share.pending.value;
    share.pending = null;
    share.landed = false;
    share.crossed = false;
    events.push({ name: share.target === 1 ? "leave" : "return", piece: name, at: state.time });
  }
  if (share.landed) return;
  const before = share.x - share.target;
  share.v += (SPRING.stiffness * (share.target - share.x) - SPRING.damping * share.v) * dt;
  share.x += share.v * dt;
  const after = share.x - share.target;
  if (!share.crossed && before * after <= 0) {
    share.crossed = true;
    events.push({ name: share.target === 1 ? "arrive" : "land", piece: name, at: state.time });
  }
  if (Math.abs(after) < 0.0005 && Math.abs(share.v) < 0.004) {
    share.x = share.target;
    share.v = 0;
    share.landed = true;
  }
}

// Advances every spring by `seconds` and returns what happened: leave, arrive, return, land.
function stepExplode(state, seconds) {
  const events = [];
  // Never a step longer than 1/120 s, so a long jump of the clock cannot shake the springs loose.
  const steps = Math.max(SPRING.substeps, Math.ceil(seconds * 120));
  const dt = seconds / steps;
  for (let step = 0; step < steps; step++) {
    state.time += dt;
    for (const name of LEAVE_ORDER) stepShare(state, name, dt, events);
  }
  return events;
}

function isResting(state) {
  return LEAVE_ORDER.every((name) => state.shares[name].landed && !state.shares[name].pending);
}

function maxShare(state) {
  return Math.max(...LEAVE_ORDER.map((name) => state.shares[name].x));
}

function shareOf(state, piece) {
  return piece === "frame" ? 0 : state.shares[piece].x;
}

function displacementOf(state, piece) {
  const part = PIECES[piece];
  const own = shareOf(state, piece);
  const shift = [part.move[0] * own, part.move[1] * own, part.move[2] * own];
  if (part.ride) {
    const carrier = PIECES[part.ride];
    const carried = shareOf(state, part.ride);
    for (let axis = 0; axis < 3; axis++) shift[axis] += carrier.move[axis] * carried;
  }
  return shift;
}

function shiftsOf(state) {
  const shifts = {};
  for (const name of Object.keys(PIECES)) shifts[name] = displacementOf(state, name);
  return shifts;
}

function fullShifts() {
  const state = createExplode();
  setApart(state, true, true);
  return shiftsOf(state);
}

function movedBox(bounds, shift) {
  return [bounds[0] + shift[0], bounds[1] + shift[0], bounds[2] + shift[1], bounds[3] + shift[1], bounds[4] + shift[2], bounds[5] + shift[2]];
}

// The silhouette of an axis-aligned box in this camera is a hexagon whose edges run along the three
// projected axes, so two silhouettes overlap exactly when their extents overlap across each axis.
// `axes` holds the screen direction of world x, y and z.
function silhouetteOf(box, axes) {
  const bands = [];
  for (let across = 0; across < 3; across++) {
    const normal = [-axes[across][1], axes[across][0]];
    let low = 0;
    let high = 0;
    for (let axis = 0; axis < 3; axis++) {
      if (axis === across) continue;
      const weight = axes[axis][0] * normal[0] + axes[axis][1] * normal[1];
      const a = box[axis * 2] * weight;
      const b = box[axis * 2 + 1] * weight;
      low += Math.min(a, b);
      high += Math.max(a, b);
    }
    bands.push(low, high);
  }
  return bands;
}

function silhouettesOverlap(a, b) {
  for (let band = 0; band < 6; band += 2) {
    if (a[band] >= b[band + 1] - SCREEN_GAP || b[band] >= a[band + 1] - SCREEN_GAP) return false;
  }
  return true;
}

// Every axis points towards the viewer in this camera, so a box that ends before another begins,
// along any axis, is behind it wherever the two overlap on screen.
function endsBefore(a, b) {
  return a[1] <= b[0] + TOUCH || a[3] <= b[2] + TOUCH || a[5] <= b[4] + TOUCH;
}

// A wire that an assembly's path has to cross is declared on its item (`crosses`): no order is
// measured between the two, and the audit lists the pair instead of hiding it.
function crossingDeclared(a, b) {
  return a.crosses === b.piece || b.crosses === a.piece;
}

function sameShift(a, b) {
  return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]) < 1e-6;
}

// The painter's order of the items for one set of shifts. Items keep their hand-set rank unless two
// that have moved relative to each other overlap on screen with one measurably behind the other.
function paintOrder(items, shifts, axes) {
  const count = items.length;
  const boxes = items.map((item) => (item.bounds ? movedBox(item.bounds, shifts[item.piece]) : null));
  const outlines = boxes.map((box) => (box ? silhouetteOf(box, axes) : null));
  const followers = items.map(() => []);
  const blockers = items.map(() => []);
  const waiting = new Array(count).fill(0);
  for (let first = 0; first < count; first++) {
    if (!boxes[first]) continue;
    for (let second = first + 1; second < count; second++) {
      if (!boxes[second] || crossingDeclared(items[first], items[second])) continue;
      if (!silhouettesOverlap(outlines[first], outlines[second])) continue;
      let back = first;
      let front = second;
      const moved = !sameShift(shifts[items[first].piece], shifts[items[second].piece]);
      if (moved) {
        const firstBehind = endsBefore(boxes[first], boxes[second]);
        const secondBehind = endsBefore(boxes[second], boxes[first]);
        // Apart along two axes the other way round, the two only overlap as boxes, not as shapes.
        if (firstBehind && secondBehind) continue;
        if (secondBehind) {
          back = second;
          front = first;
        }
      }
      followers[back].push(front);
      blockers[front].push(back);
      waiting[front] += 1;
    }
  }
  const order = [];
  const placed = new Array(count).fill(false);
  let cycles = 0;
  let loop = null;
  for (let step = 0; step < count; step++) {
    let pick = -1;
    for (let index = 0; index < count && pick < 0; index++) {
      if (!placed[index] && waiting[index] === 0) pick = index;
    }

  clothRows: one("cloth-rows"),
  clothEdge: one("cloth-edge"),
  griffeBack: one("griffe-back"),
  griffeFront: one("griffe-front"),
  griffeRod: one("griffe-rod"),
  lever: one("lever"),
  leverCord: one("lever-cord"),
  treadle: one("treadle"),
};

const written = new WeakMap();

function write(element, name, value) {
  let seen = written.get(element);
  if (!seen) {
    seen = {};
    written.set(element, seen);
  }
  if (seen[name] === value) return;
  seen[name] = value;
  if (value === null) element.removeAttribute(name);
  else if (name === "glow") element.style.setProperty("--glow", value);
  else if (name === "html") element.innerHTML = value;
  else element.setAttribute(name, value);
}

function setGlow(element, value) {
  write(element, "glow", String(Math.round(value * 100) / 100));
}

const camera = cameraOf(P);
const VIEW = [camera.cosA * camera.cosE, camera.sinE];
const flat = (x, y, z) => iso([x, y, z], P);
const trace = (points, closed = false) => pathOf(points.map((point) => iso(point, P)), closed);
const depthKey = (x, z) => x * VIEW[0] + z * VIEW[1];

function faceClass(normalX, normalZ) {
  if (normalZ > 0.75) return 'class="iso-top"';
  const lit = (1 - normalX * camera.sinA) / 2 + Math.max(0, normalZ) * 0.3;
  const shade = Math.min(3, Math.max(0, Math.floor(lit * 4)));
  return `class="iso-shade" data-shade="${shade}"`;
}

// ---- state ---------------------------------------------------------------------------------------------

const loom = Loom.createLoom(Loom.MOTIF_NAMES.includes(query.get("motif")) ? query.get("motif") : "diamond");
const clock = {
  phase: 1,
  rate: 0,
  latched: null,
  woven: true,
  direction: 1,
  stepping: false,
  touring: false,
  held: false,
  visible: manual,
  frame: 0,
  last: 0,
  pickSeconds: PICK_SECONDS,
  resumeTimer: 0,
  elapsed: 0,
};

function startPick() {
  Loom.presentNext(loom);
  clock.phase = 0;
  clock.latched = null;
  clock.woven = false;
  clock.direction = loom.picks % 2 === 0 ? 1 : -1;
}

function settleEvents() {
  if (!clock.latched && clock.phase >= T.latch) clock.latched = Loom.readHooks(loom.chain[loom.cardIndex], MECHANISM);
  if (!clock.woven && clock.phase >= T.weave) {
    Loom.weaveRow(loom, clock.latched);
    clock.woven = true;
    announce();
  }
}

// Plays `seconds` of the loom's clock. No pick starts while the loom is apart or about to come apart,
// and every stretch of a pick reports its sound cues with the clock time at which they fall.
function advance(seconds) {
  let left = seconds / clock.pickSeconds;
  let at = clock.elapsed;
  while (left > 1e-9) {
    if (clock.phase >= 1) {
      if (apartBusy() || (!clock.stepping && !wantsTour())) break;
      startPick();
    }
    const from = clock.phase;
    const step = Math.min(left, 1 - clock.phase);
    clock.phase += step;
    left -= step;
    if (clock.phase > 1 - 1e-9) clock.phase = 1;
    soundEvents(from, clock.phase, at);
    at += step * clock.pickSeconds;
    settleEvents();
    if (clock.phase >= 1 && clock.stepping) {
      clock.stepping = false;
      if (!wantsTour()) break;
    }
  }
  clock.elapsed += seconds;
}

// Reduced motion: no travel, one still pose per pick, with the shed open and the new row just beaten in.
function jumpOnePick() {
  if (clock.phase < 1) {
    clock.phase = 1;
    settleEvents();
  }
  startPick();
  clock.phase = STILL_PHASE;
  settleEvents();
}

function wantsTour() {
  return clock.touring && !clock.held && !still.matches && !apartBusy();
}

// ---- drawing -------------------------------------------------------------------------------------------

function cylinderCentre(swing) {
  const reach = L.swing.out * swing;
  return [CONFIG.pressedCentre[0] - reach, L.swing.pivotZ + Math.sqrt(L.swing.arm ** 2 - reach ** 2)];
}

function holeQuad(middle, along, y, sizeAlong, sizeAcross) {
  const ax = along[0] * sizeAlong;
  const az = along[1] * sizeAlong;
  return trace(
    [
      [middle[0] - ax, y - sizeAcross, middle[1] - az],
      [middle[0] + ax, y - sizeAcross, middle[1] + az],
      [middle[0] + ax, y + sizeAcross, middle[1] + az],
      [middle[0] - ax, y + sizeAcross, middle[1] - az],
    ],
    true,
  );
}

function cardFrame(a, b) {
  const dx = b[0] - a[0];
  const dz = b[1] - a[1];
  const span = Math.hypot(dx, dz) || 1;
  const along = [dx / span, dz / span];
  const inset = L.card.gap / 2;
  const start = [a[0] + along[0] * inset, a[1] + along[1] * inset];
  const end = [b[0] - along[0] * inset, b[1] - along[1] * inset];
  const middle = [(start[0] + end[0]) / 2, (start[1] + end[1]) / 2];
  let normal = [-along[1], along[0]];
  if (normal[0] * VIEW[0] + normal[1] * VIEW[1] < 0) normal = [-normal[0], -normal[1]];
  return { along, start, end, middle, normal };
}

function cardMarkup(frame, row) {
  const half = L.card.length / 2;
  const outline = trace(
    [
      [frame.start[0], -half, frame.start[1]],
      [frame.end[0], -half, frame.end[1]],
      [frame.end[0], half, frame.end[1]],
      [frame.start[0], half, frame.start[1]],
    ],
    true,
  );
  let holes = "";
  let blanks = "";
  for (const lane of laneIndexes) {
    if (row[lane]) holes += holeQuad(frame.middle, frame.along, hookY(lane), L.card.hole, L.card.hole);
    else blanks += holeQuad(frame.middle, frame.along, hookY(lane), 0.4, 0.4);
  }
  let laces = "";
  const edge = L.card.half - L.card.gap / 2 - 1.5;
  for (const y of [-half + 2.4, 0, half - 2.4]) {
    for (const side of [-1, 1]) {
      const at = [frame.middle[0] + frame.along[0] * edge * side, frame.middle[1] + frame.along[1] * edge * side];
      laces += holeQuad(at, frame.along, y, 0.45, 0.45);
    }
  }
  return `<path ${faceClass(frame.normal[0], frame.normal[1])} d="${outline}"/><path class="jq-blank" d="${blanks}"/><path class="jq-lace" d="${laces}"/><path class="iso-line iso-edge" data-tone="hi" d="${outline}"/><path class="jq-hole" d="${holes}"/>`;
}

// The lacing that ties one card to the next: three cords across the gap, from edge to edge.
function lacingMarkup(frame, next) {
  const half = L.card.length / 2;
  let cords = "";
  for (const y of [-half + 2.4, 0, half - 2.4]) cords += trace([[frame.end[0], y, frame.end[1]], [next.start[0], y, next.start[1]]]);
  return `<path class="iso-line" data-tone="mid" d="${cords}"/>`;
}

function cylinderMarkup(centre, turn) {
  const radius = L.card.half * Math.SQRT2;
  const y0 = -L.card.length / 2 - 0.8;
  const y1 = L.card.length / 2 + 0.8;
  const corners = [0, 1, 2, 3].map((index) => {
    const angle = ((45 + 90 * index - 90 * turn) * Math.PI) / 180;
    return [centre[0] + radius * Math.cos(angle), centre[1] + radius * Math.sin(angle)];
  });
  let faces = "";
  let edges = "";
  for (let index = 0; index < 4; index++) {
    const a = corners[index];
    const b = corners[(index + 1) % 4];
    const outward = [(a[0] + b[0]) / 2 - centre[0], (a[1] + b[1]) / 2 - centre[1]];
    const length = Math.hypot(outward[0], outward[1]);
    const normal = [outward[0] / length, outward[1] / length];
    if (normal[0] * VIEW[0] + normal[1] * VIEW[1] <= 0) continue;
    const d = trace([[a[0], y0, a[1]], [b[0], y0, b[1]], [b[0], y1, b[1]], [a[0], y1, a[1]]], true);
    faces += `<path ${faceClass(normal[0], normal[1])} d="${d}"/>`;
    edges += d;
  }
  const cap = trace(corners.map((corner) => [corner[0], y1, corner[1]]), true);
  const axle = flat(centre[0], y1, centre[1]);
  return `${faces}<path class="iso-shade" data-shade="3" d="${cap}"/><path class="iso-line iso-edge" data-tone="mid" d="${edges}${cap}"/><g class="iso-dots" data-tone="hi"><circle cx="${axle[0].toFixed(1)}" cy="${axle[1].toFixed(1)}" r="1.3"/></g>`;
}

// A straight bar in the x-z plane between two points, `thick` deep, from y0 to y1: swing arms, lever, treadle.
function barMarkup(a, b, y0, y1, thick, tone) {
  const dx = b[0] - a[0];
  const dz = b[1] - a[1];
  const span = Math.hypot(dx, dz) || 1;
  let normal = [-dz / span, dx / span];
  if (normal[0] * VIEW[0] + normal[1] * VIEW[1] < 0) normal = [-normal[0], -normal[1]];
  const offset = [normal[0] * (thick / 2), normal[1] * (thick / 2)];
  const aFront = [a[0] + offset[0], a[1] + offset[1]];
  const bFront = [b[0] + offset[0], b[1] + offset[1]];
  const aBack = [a[0] - offset[0], a[1] - offset[1]];
  const bBack = [b[0] - offset[0], b[1] - offset[1]];
  const side = trace([[aFront[0], y1, aFront[1]], [bFront[0], y1, bFront[1]], [bBack[0], y1, bBack[1]], [aBack[0], y1, aBack[1]]], true);
  const face = trace([[aFront[0], y0, aFront[1]], [bFront[0], y0, bFront[1]], [bFront[0], y1, bFront[1]], [aFront[0], y1, aFront[1]]], true);
  const nearEnd = a[0] > b[0] ? [aFront, aBack] : [bFront, bBack];
  const end = trace([[nearEnd[0][0], y0, nearEnd[0][1]], [nearEnd[0][0], y1, nearEnd[0][1]], [nearEnd[1][0], y1, nearEnd[1][1]], [nearEnd[1][0], y0, nearEnd[1][1]]], true);
  return `<path class="iso-shade" data-shade="0" d="${end}"/><path ${faceClass(normal[0], normal[1])} d="${face}"/><path class="iso-shade" data-shade="3" d="${side}"/><path class="iso-line iso-edge" data-tone="${tone}" d="${end}${face}${side}"/>`;
}

function drawChain(pose, centre, reading, glow) {
  const hinges = Loom.chainHinges(pose.turn, centre, CONFIG.chainShape);
  const frames = hinges.map((hinge, index) => cardFrame(hinge, hinges[(index + 1) % Loom.CARDS]));
  const items = frames.map((frame, index) => {
    const row = loom.chain[(loom.cardIndex - index + Loom.CARDS * 2) % Loom.CARDS];
    const next = frames[(index + 1) % Loom.CARDS];
    return { key: depthKey(frame.middle[0], frame.middle[1]), html: cardMarkup(frame, row) + lacingMarkup(frame, next) };
  });
  const cylinderKey = depthKey(centre[0], centre[1]) - 0.5;
  items.sort((a, b) => a.key - b.key);
  const behind = items.filter((item) => item.key < cylinderKey);
  const over = items.filter((item) => item.key >= cylinderKey);
  parts.slotsBack.forEach((slot, index) => write(slot, "html", index < behind.length ? behind[index].html : ""));
  parts.slotsFront.forEach((slot, index) => write(slot, "html", index < over.length ? over[index].html : ""));
  write(parts.cylinder, "html", cylinderMarkup(centre, pose.turn));

  const targets = [
    { frame: frames[0], card: loom.cardIndex },
    { frame: frames[Loom.CARDS - 1], card: (loom.cardIndex + 1) % Loom.CARDS },
  ];
  targets.forEach((target, which) => {
    for (const lane of laneIndexes) {
      const hit = parts.hits[which * LANES + lane];
      write(hit, "d", holeQuad(target.frame.middle, target.frame.along, hookY(lane), L.card.half - 1.2, L.hookPitch / 2));
      write(hit, "data-card", String(target.card));
      const punched = loom.chain[target.card][lane];
      write(hit, "aria-label", `Card ${target.card + 1}, position ${lane + 1}: ${punched ? "hole, press to patch" : "blank, press to punch"}`);
    }
  });

  let rings = "";
  for (const lane of laneIndexes) {
    if (reading[lane]) rings += holeQuad(frames[0].middle, frames[0].along, hookY(lane), L.card.hole, L.card.hole);
  }
  write(parts.cardLit, "d", rings);
  setGlow(parts.cardLit, glow.card);

  const pivot = [CONFIG.pressedCentre[0], L.swing.pivotZ];
  write(parts.armFar, "html", barMarkup(pivot, centre, -L.swing.armY - 1.2, -L.swing.armY + 1.2, 2.6, "mid"));
  write(parts.armNear, "html", barMarkup(pivot, centre, L.swing.armY - 1.2, L.swing.armY + 1.2, 2.6, "mid"));
}

function drawNeedle(lane, shift, faceX) {
  const y = hookY(lane);
  const N = L.needle;
  const z = N.z;
  const head = Math.max(N.headX + shift, faceX);
  write(parts.needleHead[lane], "d", head < N.boardBack ? trace([[head, y, z], [N.boardBack, y, z]]) : "");
  const loopX = L.hook.x + shift;
  const loop = [];
  for (let step = 0; step < 12; step++) {
    const angle = (step / 12) * Math.PI * 2;
    loop.push([loopX + Math.cos(angle) * N.loopR, y, z + Math.sin(angle) * N.loopR]);
  }
  const body = trace([[N.boardFront, y, z], [loopX - N.loopR, y, z]]) + trace(loop, true) + trace([[loopX + N.loopR, y, z], [N.plateFront, y, z]]);
  write(parts.needleBody[lane], "d", body);
  const spring = coil(N.collarX + shift, N.plateBack + 1, [y, z], 1.3, 4, "x", P);
  write(parts.needleSpring[lane], "d", trace([[N.plateFrontEnd, y, z], [N.plateBack + 1, y, z]]) + spring.back + spring.front);
  const collar = flat(N.collarX + shift, y, z);
  write(parts.collar[lane], "cx", collar[0].toFixed(1));
  write(parts.collar[lane], "cy", collar[1].toFixed(1));
  write(parts.needleTail[lane], "d", trace([[N.plateBackEnd, y, z], [N.tailX + shift, y, z]]));
}

function drawHook(lane, lean, lift) {
  const y = hookY(lane);
  const H = L.hook;
  const leanAt = (worldZ) => (lean * (worldZ - lift - H.foot)) / (H.top - H.foot);
  const main = (worldZ) => [H.x + leanAt(worldZ), y, worldZ];
  const doubled = (worldZ) => [H.x + H.doubled + leanAt(worldZ), y, worldZ];
  const foot = H.foot + lift;
  const neck = trace([[L.neckX, y, L.bottomBoard.z1], [L.neckX, y, foot]]);
  write(parts.hookLow[lane], "d", neck + trace([main(L.grate.z1), main(foot), doubled(foot), doubled(L.grate.z1 - 0.4)]));
  write(parts.hookMid[lane], "d", trace([main(L.grate.z1), main(H.loop)]));
  const tip = H.doubledTop + lift;
  write(parts.hookDouble[lane], "d", trace([doubled(L.grate.z1 - 0.4), doubled(Math.max(tip, L.grate.z1 - 0.2))]));
  const top = H.top + lift;
  const crown = main(top);
  write(parts.hookTop[lane], "d", trace([main(H.loop), crown, [crown[0] - H.beak, y, top], [crown[0] - H.beak, y, top - H.beakDrop]]));
}

function drawHarness(lane, lift) {
  const yHook = hookY(lane);
  const yWarp = warpY(lane);
  const x = L.hook.x;
  const eye = L.warpZ + lift;
  const ring = [];
  for (let step = 0; step < 10; step++) {
    const angle = (step / 10) * Math.PI * 2;
    ring.push([x, yWarp + Math.cos(angle) * L.mail.halfWidth, eye + Math.sin(angle) * L.mail.halfHeight]);
  }
  const lower = trace([[x, yWarp, L.lingoe.top - 1 + lift], [x, yWarp, eye - L.mail.halfHeight]]);
  const upper = trace([[x, yWarp, eye + L.mail.halfHeight], [x, yWarp, L.comber.z0 + 1.5]]);
  write(parts.harnessLow[lane], "d", lower + trace(ring, true) + upper);
  write(parts.lingoe[lane], "transform", translateAlong(P, [0, 0, lift]));
  const knotZ = L.knotZ + lift;
  write(parts.harnessHigh[lane], "d", trace([[x, yWarp, L.comber.z1], [L.neckX, yHook, knotZ]]));
  write(parts.neck[lane], "d", trace([[L.neckX, yHook, knotZ], [L.neckX, yHook, L.bottomBoard.z0 + 1.5]]));
  const knot = flat(L.neckX, yHook, knotZ);
  for (const dot of [parts.knot[lane], parts.cordEnd[lane]]) {
    write(dot, "cx", knot[0].toFixed(1));
    write(dot, "cy", knot[1].toFixed(1));
  }
}

function drawThread(lane, lift, reedX, fellX) {
  const y = warpY(lane);
  const eyeZ = L.warpZ + lift;
  const reedZ = L.warpZ + (lift * (fellX - reedX)) / (fellX - L.hook.x);
  const rear = CONFIG.beamArcs[lane].concat([[L.hook.x, y, eyeZ], [reedX, y, reedZ]]);
  write(parts.threadRear[lane], "d", trace(rear));
  const front = reedX < fellX - 0.05 ? trace([[reedX, y, reedZ], [fellX, y, L.warpZ]]) : "";
  const raised = lift > 1.5;
  write(parts.threadFrontLow[lane], "d", raised ? "" : front);
  write(parts.threadFrontHigh[lane], "d", raised ? front : "");
  const fellEnd = flat(fellX, y, L.warpZ);
  write(parts.fellEnd[lane], "cx", fellEnd[0].toFixed(1));
  write(parts.fellEnd[lane], "cy", fellEnd[1].toFixed(1));
}

function clothPoint(u, y) {
  const C = L.cloth;
  const corner = C.cornerX - L.fell;
  if (u <= corner) return [L.fell + u, y, C.z];
  return [C.cornerX, y, C.z - (u - corner)];
}

function clothCell(u0, u1, y0, y1) {
  const corner = L.cloth.cornerX - L.fell;
  const points = [clothPoint(u0, y0)];
  if (u0 < corner && u1 > corner) points.push(clothPoint(corner, y0));
  points.push(clothPoint(u1, y0), clothPoint(u1, y1));
  if (u0 < corner && u1 > corner) points.push(clothPoint(corner, y1));
  points.push(clothPoint(u0, y1));
  return trace(points, true);
}

function drawCloth(pose, fellX, glow) {
  const C = L.cloth;
  const corner = C.cornerX - L.fell;
  const last = corner + (C.z - C.dropTo);
  const start = fellX - L.fell;
  const w = C.halfWidth;
  write(parts.clothTop, "d", clothCell(start, corner, -w, w));
  write(parts.clothDrop, "d", clothCell(corner, last, -w, w));
  write(parts.clothEdge, "d", clothCell(start, last, -w, w) + trace([clothPoint(corner, -w), clothPoint(corner, w)]));
  const shift = clock.woven ? pose.takeUp : 1;
  let ink = "";
  let fresh = "";
  let rows = "";
  const count = loom.cloth.length;
  for (let age = 0; age < count; age++) {
    const u0 = (age - 1 + shift) * L.row;
    if (u0 >= last) break;
    const u1 = Math.min(last, u0 + L.row);
    const row = loom.cloth[count - 1 - age];
    let cells = "";
    for (const lane of laneIndexes) {
      if (row[lane]) cells += clothCell(u0, u1, warpY(lane) - L.warpPitch / 2, warpY(lane) + L.warpPitch / 2);
    }
    if (age === 0 && clock.woven && glow.cloth > 0) fresh += cells;
    else ink += cells;
    if (u1 < last - 0.05 && Math.abs(u1 - corner) > 0.3) rows += trace([clothPoint(u1, -w), clothPoint(u1, w)]);
  }
  write(parts.clothInk, "d", ink);
  write(parts.clothNew, "d", fresh);
  setGlow(parts.clothNew, glow.cloth);
  write(parts.clothRows, "d", rows);
}

function drawLever(rise) {
  const V = L.lever;
  const drop = (rise * (V.pivotX - V.rearX)) / (V.rodX - V.pivotX);
  const front = [V.rodX + 2.5, V.z + rise * ((V.rodX + 2.5 - V.pivotX) / (V.rodX - V.pivotX))];
  const rear = [V.rearX, V.z - drop];
  write(parts.lever, "html", barMarkup(rear, front, V.y0, V.y1, V.thick, "mid"));
  const D = L.treadle;
  const treadleRear = [D.rearX, D.rearZ - drop];
  write(parts.treadle, "html", barMarkup(treadleRear, [D.pivotX, D.pivotZ], D.y0, D.y1, D.thick, "lo"));
  const cordY = (V.y0 + V.y1) / 2;
  write(parts.leverCord, "d", trace([[V.rearX + 1.5, cordY, V.z - drop], [D.rearX + 1.5, cordY, D.rearZ - drop + D.thick / 2]]));
}

function readoutText() {
  const card = loom.chain[loom.cardIndex];
  const picks = loom.picks;
  return `card ${loom.cardIndex + 1} of ${Loom.CARDS} · ${Loom.rowBits(card)} · ${picks} ${picks === 1 ? "pick" : "picks"}`;
}

function announce() {
  if (!announcer) return;
  const row = loom.cloth[loom.cloth.length - 1];
  announcer.textContent = `Pick ${loom.picks} woven from card ${loom.cardIndex + 1}: ${Loom.rowBits(row)}, ${Loom.liftedCount(row)} hooks lifted.`;
}

function draw() {
  const pose = Loom.poseAt(clock.phase);
  const glow = Loom.glowAt(clock.phase);
  const card = loom.chain[loom.cardIndex];
  const reading = clock.latched ?? card;
  const centre = cylinderCentre(pose.swing);
  const seated = pose.turn >= 1;
  const faceX = centre[0] + L.card.half + L.card.thick;
  const rise = pose.griffe * L.griffe.rise;
  const reedX = L.reed.rest + (L.reed.beat - L.reed.rest) * pose.beat;
  const fellX = clock.woven ? L.fell - L.row * (1 - pose.takeUp) : L.fell;

  drawChain(pose, centre, reading, glow);

  for (const lane of laneIndexes) {
    const shift = seated ? Loom.needleShift(reading[lane], faceX, L.needle.headX) : 0;
    const lean = Loom.hookLean(shift, MECHANISM.hook);
    const lift = Loom.hookLift(clock.latched ? clock.latched[lane] : false, rise, L.griffe.free);
    drawNeedle(lane, shift, seated ? faceX : -1e6);
    drawHook(lane, lean, lift);
    drawHarness(lane, lift);
    drawThread(lane, lift, reedX, fellX);
    const on = reading[lane] ? 1 : 0;
    for (const element of [parts.needleHead[lane], parts.needleBody[lane], parts.needleSpring[lane], parts.needleTail[lane]]) setGlow(element, glow.needle * on);
    for (const element of [parts.hookLow[lane], parts.hookMid[lane], parts.hookDouble[lane], parts.hookTop[lane]]) setGlow(element, glow.hook * on);
    for (const element of [parts.harnessLow[lane], parts.harnessHigh[lane], parts.neck[lane]]) setGlow(element, glow.harness * on);
    for (const element of [parts.threadRear[lane], parts.threadFrontLow[lane], parts.threadFrontHigh[lane]]) setGlow(element, glow.thread * on);
  }

  write(parts.griffeBack, "transform", translateAlong(P, [0, 0, rise]));
  write(parts.griffeFront, "transform", translateAlong(P, [0, 0, rise]));
  write(parts.griffeRod, "transform", translateAlong(P, [0, 0, rise]));
  drawLever(rise);

  const slide = translateAlong(P, [reedX - L.reed.rest, 0, 0]);
  write(parts.battenBack, "transform", slide);
  write(parts.battenFront, "transform", slide);
  const flight = (pose.shuttle * 2 - 1) * L.shuttle.reach * clock.direction;
  write(parts.shuttle, "transform", translateAlong(P, [reedX - L.reed.rest, flight, 0]));
  const laying = pose.shuttle > 0 && !clock.woven;
  if (laying) {
    const from = -L.cloth.halfWidth * clock.direction;
    const reach = Math.max(-L.cloth.halfWidth, Math.min(L.cloth.halfWidth, flight));
    const fromX = L.fell - (L.shuttle.offsetX + 0.5) * pose.beat;
    const toX = reedX + L.shuttle.offsetX * (1 - pose.beat) + 0.5 * pose.beat;
    write(parts.weft, "d", trace([[fromX, from, L.shuttle.z], [toX, reach, L.shuttle.z]]));
  } else {
    write(parts.weft, "d", "");
  }
  setGlow(parts.weft, glow.weft);

  drawCloth(pose, fellX, glow);

  const text = apartReadout() ?? readoutText();
  if (readout.textContent !== text) readout.textContent = text;
  write(stage, "data-stage", clock.phase >= 1 ? "resting" : Loom.stageAt(clock.phase));
  drawApart();
}

// ---- loop, pointer, keyboard ---------------------------------------------------------------------------

function tick(now) {
  const dt = clock.last ? Math.min((now - clock.last) / 1000, 1 / 30) : 1 / 60;
  clock.last = now;
  const flying = stepApart(dt);
  const target = clock.stepping || wantsTour() || finishingPick() ? 1 : 0;
  clock.rate += (target - clock.rate) * (1 - Math.exp(-dt / 0.22));
  if (Math.abs(target - clock.rate) < 0.004) clock.rate = target;
  advance(dt * clock.rate);
  draw();
  const moving = clock.rate > 0 || target > 0 || flying;
  clock.frame = clock.visible && moving ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (manual || clock.frame || !clock.visible) return;
  clock.last = 0;
  clock.frame = requestAnimationFrame(tick);
}

function quietTour() {
  clock.touring = false;
  clearTimeout(clock.resumeTimer);
  clock.resumeTimer = setTimeout(() => {
    clock.touring = !still.matches;
    run();
  }, RESUME_AFTER);
}

function stepOnePick() {
  if (apartBusy()) return;
  if (still.matches) {
    jumpOnePick();
    draw();
    return;
  }
  clock.stepping = true;
  quietTour();
  run();
}

function punch(hit) {
  const card = Number(hit.getAttribute("data-card"));
  const position = Number(hit.getAttribute("data-position"));
  const punched = Loom.togglePunch(loom, card, position);
  if (announcer) announcer.textContent = `Card ${card + 1}, position ${position + 1}: ${punched ? "punched" : "patched"}. Row is now ${Loom.rowBits(loom.chain[card])}.`;
  quietTour();
  draw();
  run();
}

function chooseMotif(name) {
  Loom.setMotif(loom, name);
  motifButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.getAttribute("data-motif") === name)));
  if (announcer) announcer.textContent = `Cards re-punched with the ${name} motif.`;
  draw();
  run();
}

function hold(value) {
  clock.held = value;
  if (!value) quietTour();
  run();
}

if (!manual) {
  stage.addEventListener("pointerenter", () => hold(true));
  stage.addEventListener("pointerleave", () => hold(false));
  stage.addEventListener("focusin", () => hold(true));
  stage.addEventListener("focusout", () => hold(false));
  stage.addEventListener("click", (event) => {
    const hit = event.target.closest('[data-dyn="hit"]');
    if (hit) punch(hit);
    else stepOnePick();
  });
  stage.addEventListener("keydown", (event) => {
    const hit = event.target.closest('[data-dyn="hit"]');
    if (event.key === " " || event.key === "Enter") {
      event.preventDefault();
      if (hit) punch(hit);
      else stepOnePick();
      return;
    }
    const choice = Number(event.key);
    if (choice >= 1 && choice <= Loom.MOTIF_NAMES.length) chooseMotif(Loom.MOTIF_NAMES[choice - 1]);
  });
  motifButtons.forEach((button) => button.addEventListener("click", () => chooseMotif(button.getAttribute("data-motif"))));
  if (stepButton) stepButton.addEventListener("click", stepOnePick);
  new IntersectionObserver(
    (entries) => {
      clock.visible = entries[entries.length - 1].isIntersecting;
      if (clock.visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  still.addEventListener("change", () => {
    clock.touring = !still.matches;
    run();
  });
}

// The exploded view, the sounds and the film hooks of the Jacquard loom figure. The build inlines this
// file right after live.js, inside the same block: it uses that file's clock, parts and helpers, and it
// ends with the start-up that brings the page to its first frame.

const EX = CONFIG.explode;
const explode = Explode.createExplode();
const world = one("world");
const lens = one("lens");
const itemNodes = Array.from(world.children);
const badges = Array.from(document.querySelectorAll("[data-badge]"));
const apartButton = document.querySelector("[data-apart]");
const soundButton = document.querySelector("[data-sound]");
const worldZero = iso([0, 0, 0], P);
const AXES = [[1, 0, 0], [0, 1, 0], [0, 0, 1]].map((axis) => {
  const tip = iso(axis, P);
  return [tip[0] - worldZero[0], tip[1] - worldZero[1]];
});
const apartState = { armed: false, painted: itemNodes.map((_, index) => index) };
const filmView = { camera: null, weaving: true };
const eventLog = [];

// ---- state ---------------------------------------------------------------------------------------------

function apartBusy() {
  return apartState.armed || explode.apart || !Explode.isResting(explode);
}

function finishingPick() {
  return apartState.armed && clock.phase < 1;
}

function apartReadout() {
  if (apartState.armed) return "finishing the pick · then apart";
  if (explode.apart) return Explode.isResting(explode) ? "apart · weaving paused" : "coming apart";
  if (!Explode.isResting(explode)) return "going back together";
  return null;
}

function say(text) {
  if (announcer) announcer.textContent = text;
}

function openApart(calm) {
  apartState.armed = false;
  Explode.setApart(explode, true, calm);
  emit("apart-open", { duration: Explode.SPRING.stagger * Explode.LEAVE_ORDER.length + 0.5 });
  if (calm) emit("apart-hold", {});
  say("The loom is apart in ten numbered assemblies. Weaving is paused.");
}

function closeApart(calm) {
  apartState.armed = false;
  Explode.setApart(explode, false, calm);
  emit("apart-close", { duration: Explode.SPRING.stagger * Explode.LEAVE_ORDER.length + 0.5 });
  if (calm) emit("apart-seated", {});
  say("The loom is going back together.");
}

// Arming: the loom only comes apart from rest, so a pick that is under way is finished first.
function setApartWanted(wanted) {
  const current = explode.apart || apartState.armed;
  if (wanted === current) return;
  if (!wanted && apartState.armed) apartState.armed = false;
  else if (!wanted) closeApart(still.matches);
  else if (still.matches) {
    clock.phase = 1;
    settleEvents();
    openApart(true);
  } else apartState.armed = true;
  draw();
  run();
}

function toggleApart() {
  setApartWanted(!(explode.apart || apartState.armed));
}

function everyShare(test) {
  return Explode.LEAVE_ORDER.every((name) => test(explode.shares[name]));
}

function stepApart(seconds) {
  if (apartState.armed && clock.phase >= 1) openApart(false);
  if (Explode.isResting(explode)) return apartState.armed;
  for (const event of Explode.stepExplode(explode, seconds)) {
    emit(`piece-${event.name}`, { piece: event.piece, number: Explode.PIECES[event.piece].number }, event.at);
    const arrived = (share) => !share.pending && (share.landed || share.crossed);
    if (event.name === "arrive" && everyShare((share) => share.target === 1 && arrived(share))) emit("apart-hold", {}, event.at);
    if (event.name === "land" && everyShare((share) => share.target === 0 && arrived(share))) emit("apart-seated", {}, event.at);
  }
  if (Explode.isResting(explode) && !explode.apart && !manual) quietTour();
  return true;
}

// ---- drawing -------------------------------------------------------------------------------------------

function sameList(a, b) {
  for (let index = 0; index < a.length; index++) {
    if (a[index] !== b[index]) return false;
  }
  return true;
}

// Re-appends the items only when the painter's order really changed.
function paintItems(shifts) {
  const assembled = Explode.isResting(explode) && !explode.apart;
  const order = assembled ? itemNodes.map((_, index) => index) : Explode.paintOrder(EX.items, shifts, AXES).order;
  if (sameList(order, apartState.painted)) return;
  const fragment = document.createDocumentFragment();
  for (const index of order) fragment.appendChild(itemNodes[index]);
  world.appendChild(fragment);
  apartState.painted = order;
}

// The page pulls back just far enough to keep the apart pose inside the card; the film sets its own camera.
function worldView(open) {
  if (filmView.camera) return filmView.camera;
  const centre = [EX.width / 2, EX.height / 2];
  if (EX.film) return { x: centre[0], y: centre[1], zoom: 1 };
  const fit = Math.min(1, (EX.width - 44) / EX.apart.width, (EX.height - 44) / EX.apart.height);
  const share = Loom.smooth(0, 1, open);
  return { x: centre[0] + (EX.apart.x - centre[0]) * share, y: centre[1] + (EX.apart.y - centre[1]) * share, zoom: 1 + (fit - 1) * share };
}

function placeBadges(shifts, view) {
  for (const badge of badges) {
    const name = badge.getAttribute("data-badge");
    const anchor = EX.anchors[name];
    const shift = shifts[name];
    const point = iso([anchor[0] + shift[0], anchor[1] + shift[1], anchor[2] + shift[2]], P);
    const x = EX.width / 2 + (point[0] - view.x) * view.zoom;
    const y = EX.height / 2 + (point[1] - view.y) * view.zoom;
    const place = `${((x / EX.width) * 100).toFixed(2)}%`;
    const drop = `${((y / EX.height) * 100).toFixed(2)}%`;
    if (badge.style.left !== place) badge.style.left = place;
    if (badge.style.top !== drop) badge.style.top = drop;
    const share = name === "frame" ? Explode.maxShare(explode) : Explode.shareOf(explode, name);
    const shown = Loom.smooth(0.5, 0.95, share).toFixed(2);
    if (badge.style.opacity !== shown) badge.style.opacity = shown;
  }
}

function drawApart() {
  const shifts = Explode.shiftsOf(explode);
  const open = Math.min(1, Math.max(0, Explode.maxShare(explode)));
  itemNodes.forEach((node, index) => {
    const shift = shifts[EX.items[index].piece];
    const moved = Math.abs(shift[0]) + Math.abs(shift[1]) + Math.abs(shift[2]) > 1e-6;
    write(node, "transform", moved ? translateAlong(P, shift) : null);
  });
  paintItems(shifts);
  const view = worldView(open);
  const centredAtRest = view.zoom === 1 && view.x === EX.width / 2 && view.y === EX.height / 2;
  const centred = `translate(${EX.width / 2} ${EX.height / 2}) scale(${view.zoom.toFixed(4)}) translate(${(-view.x).toFixed(2)} ${(-view.y).toFixed(2)})`;
  write(lens, "transform", centredAtRest ? null : centred);
  placeBadges(shifts, view);
  const loose = (0.9 * Math.min(1, open * 3)).toFixed(2);
  for (const dot of parts.cordEnd.concat(parts.fellEnd)) write(dot, "r", loose);
  const least = Math.min(...Explode.LEAVE_ORDER.map((name) => Explode.shareOf(explode, name)));
  const shown = Loom.smooth(0.55, 0.95, least).toFixed(2);
  if (document.body.style.getPropertyValue("--jq-apart") !== shown) document.body.style.setProperty("--jq-apart", shown);
  write(stage, "data-open", open > 0.005 ? "" : null);
  const wanted = explode.apart || apartState.armed;
  write(apartButton, "aria-pressed", String(wanted));
  const label = wanted ? "Put together" : "Take apart";
  if (apartButton.textContent !== label) apartButton.textContent = label;
}

// ---- sound ---------------------------------------------------------------------------------------------
// The loom reports what happens as named events with a time on its own clock. The page plays them through
// Web Audio when the reader turns sound on; the recorder takes the log and renders the film's track offline.

const sound = { on: false, context: null, master: null, noise: null, hold: null };

function pressPhase() {
  let low = T.swingIn[0];
  let high = T.swingIn[1];
  for (let step = 0; step < 24; step++) {
    const middle = (low + high) / 2;
    const faceX = cylinderCentre(Loom.poseAt(middle).swing)[0] + L.card.half + L.card.thick;
    if (faceX < L.needle.headX) low = middle;
    else high = middle;
  }
  return high;
}

const CUES = [
  [T.turn[1], "card-seat"],
  [pressPhase(), "needle-ticks"],
  [T.rise[0], "treadle"],
  [T.rise[0] + 0.012, "griffe-lift"],
  [T.shuttle[0], "shuttle"],
  [T.shuttle[1] - 0.008, "shuttle-knock"],
  [T.weave, "reed-beat"],
  [T.fall[1] - 0.012, "griffe-drop"],
];

function cueDetail(name) {
  const card = loom.chain[loom.cardIndex];
  if (name === "needle-ticks") return { lanes: laneIndexes.filter((lane) => !card[lane]) };
  if (name === "griffe-lift" || name === "treadle") return { duration: (T.rise[1] - T.rise[0]) * clock.pickSeconds };
  if (name === "shuttle") return { duration: (T.shuttle[1] - T.shuttle[0]) * clock.pickSeconds, direction: clock.direction };
  return {};
}

// Called by advance() for every stretch of a pick it plays: `at` is the clock time at phase `from`.
function soundEvents(from, to, at) {
  for (const [phase, name] of CUES) {
    if (from < phase && to >= phase) emit(name, cueDetail(name), at + (phase - from) * clock.pickSeconds);
  }
}

function emit(name, detail, at = null) {
  if (manual) eventLog.push({ name, at: Math.round((at ?? clock.elapsed) * 10000) / 10000, ...detail });
  if (sound.on && sound.context) VOICES[name]?.(detail);
}

function audioReady() {
  if (sound.context) return sound.context;
  const context = new AudioContext();
  const buffer = context.createBuffer(1, context.sampleRate, context.sampleRate);
  const samples = buffer.getChannelData(0);
  for (let index = 0; index < samples.length; index++) samples[index] = Math.random() * 2 - 1;
  sound.context = context;
  sound.noise = buffer;
  sound.master = context.createGain();
  sound.master.gain.value = 0.55;
  sound.master.connect(context.destination);
  return context;
}

// A struck tone: a sine or triangle that rings and dies away, for wood and metal.
function strike(frequency, decay, level, delay = 0, type = "sine") {
  const context = sound.context;
  const start = context.currentTime + delay;
  const oscillator = context.createOscillator();
  const gain = context.createGain();
  oscillator.type = type;
  oscillator.frequency.value = frequency;
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(level, start + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + decay);
  oscillator.connect(gain).connect(sound.master);
  oscillator.start(start);
  oscillator.stop(start + decay + 0.05);
}

// Filtered noise that swells and fades while its band slides from one pitch to another: air and creaks.
function breath(from, to, sharpness, duration, level, delay = 0) {
  const context = sound.context;
  const start = context.currentTime + delay;
  const source = context.createBufferSource();
  const filter = context.createBiquadFilter();
  const gain = context.createGain();
  source.buffer = sound.noise;
  source.loop = true;
  filter.type = "bandpass";
  filter.Q.value = sharpness;
  filter.frequency.setValueAtTime(from, start);
  filter.frequency.exponentialRampToValueAtTime(to, start + duration);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(level, start + duration * 0.35);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  source.connect(filter).connect(gain).connect(sound.master);
  source.start(start);
  source.stop(start + duration + 0.05);
}

function holdTone(on) {
  const context = sound.context;
  if (sound.hold) {
    sound.hold.gain.gain.setTargetAtTime(0.0001, context.currentTime, 0.12);
    sound.hold.voices.forEach((voice) => voice.stop(context.currentTime + 0.6));
    sound.hold = null;
  }
  if (!on) return;
  const gain = context.createGain();
  gain.gain.setValueAtTime(0.0001, context.currentTime);
  gain.gain.setTargetAtTime(0.03, context.currentTime, 0.4);
  gain.connect(sound.master);
  const voices = [196, 294].map((frequency) => {
    const oscillator = context.createOscillator();
    oscillator.frequency.value = frequency;
    oscillator.connect(gain);
    oscillator.start();
    return oscillator;
  });
  sound.hold = { gain, voices };
}

function clickOf(number, level) {
  const metal = number % 2 === 0;
  strike(metal ? 2300 + number * 130 : 520 + number * 45, metal ? 0.05 : 0.07, level, 0, metal ? "triangle" : "sine");
  breath(1800, 1800, 3, 0.03, level * 0.6);
}

const VOICES = {
  "card-seat": () => {
    breath(1900, 1900, 2, 0.05, 0.5);
    strike(430, 0.07, 0.35);
    strike(760, 0.05, 0.2);
  },
  "needle-ticks": (detail) => detail.lanes.forEach((lane, index) => strike(3100 + lane * 240, 0.035, 0.07, index * 0.014, "triangle")),
  treadle: (detail) => breath(380, 560, 8, detail.duration, 0.1),
  "griffe-lift": (detail) => {
    strike(96, 0.16, 0.6);
    strike(162, 0.1, 0.3);
    breath(850, 1500, 7, detail.duration * 0.8, 0.12, 0.04);
  },
  "griffe-drop": () => {
    strike(88, 0.13, 0.34);
    strike(150, 0.08, 0.15);
  },
  shuttle: (detail) => breath(650, 2300, 1.2, detail.duration, 0.16),
  "shuttle-knock": () => {
    strike(310, 0.06, 0.4);
    strike(540, 0.04, 0.22);
  },
  "reed-beat": () => {
    strike(72, 0.18, 0.7);
    strike(124, 0.11, 0.35);
    breath(500, 500, 1, 0.05, 0.25);
  },
  "apart-open": (detail) => breath(320, 2800, 1.5, detail.duration, 0.12),
  "apart-close": (detail) => {
    holdTone(false);
    breath(2600, 340, 1.5, detail.duration, 0.1);
  },
  "piece-leave": (detail) => clickOf(detail.number, 0.16),
  "piece-land": (detail) => clickOf(detail.number, 0.2),
  "apart-hold": () => holdTone(true),
  "apart-seated": () => {
    holdTone(false);
    strike(84, 0.2, 0.7);
    strike(140, 0.12, 0.35);
    breath(1700, 1700, 2, 0.05, 0.35);
  },
};

function toggleSound() {
  sound.on = !sound.on;
  if (sound.on) audioReady().resume();
  else if (sound.context) holdTone(false);
  soundButton.setAttribute("aria-pressed", String(sound.on));
  soundButton.textContent = sound.on ? "Sound on" : "Sound";
}

// ---- start ---------------------------------------------------------------------------------------------

if (!manual) {
  stage.addEventListener("keydown", (event) => {
    if (event.key !== "e" && event.key !== "E") return;
    event.preventDefault();
    toggleApart();
  });
  apartButton.addEventListener("click", toggleApart);
  soundButton.addEventListener("click", toggleSound);
}

const requested = query.get("picks");
const startPicks = requested === null ? Loom.CARDS : Math.max(0, Math.min(64, Number(requested) || 0));
motifButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.getAttribute("data-motif") === loom.motif)));
if (still.matches && !manual) {
  for (let pick = 1; pick < startPicks; pick++) Loom.runPick(loom, MECHANISM);
  jumpOnePick();
} else {
  for (let pick = 0; pick < startPicks; pick++) Loom.runPick(loom, MECHANISM);
  clock.direction = loom.picks % 2 === 0 ? -1 : 1;
  clock.touring = !manual;
}
if (query.get("apart") === "1") Explode.setApart(explode, true, true);
draw();

// A deterministic clock for frame-by-frame capture: open the page with ?clock=manual and drive it from
// here. Every call advances the figure's own clock, so the event log carries exact film times.
window.__loom = {
  advance(seconds) {
    clock.touring = filmView.weaving;
    explode.time = clock.elapsed;
    stepApart(seconds);
    advance(seconds);
    draw();
  },
  setWeaving(on) {
    filmView.weaving = on;
  },
  setPickSeconds(seconds) {
    clock.pickSeconds = seconds;
  },
  setApart(apart) {
    explode.time = clock.elapsed;
    if (apart) openApart(false);
    else closeApart(false);
  },
  camera(x, y, zoom, weight) {
    filmView.camera = { x, y, zoom };
    document.body.style.setProperty("--anatomy-weight", `${weight}px`);
    draw();
  },
  detail(opacity) {
    document.body.style.setProperty("--jq-detail", String(opacity));
  },
  project(point) {
    return iso(point, P);
  },
  view() {
    return { width: EX.width, height: EX.height, apart: EX.apart };
  },
  takeEvents() {
    return eventLog.splice(0);
  },
  state() {
    return {
      picks: loom.picks,
      card: loom.cardIndex + 1,
      phase: Math.round(clock.phase * 10000) / 10000,
      row: Loom.rowBits(loom.chain[loom.cardIndex]),
      apart: explode.apart,
      open: Math.round(Explode.maxShare(explode) * 10000) / 10000,
      resting: Explode.isResting(explode),
      time: Math.round(clock.elapsed * 10000) / 10000,
    };
  },
};

}
