.iso{

.iso[data-theme="light"]{

.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}

.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>
.iso[data-theme="light"]{--anatomy-weight:.85px;--anatomy-lit:#d9480f;--anatomy-lo:#85858c;--anatomy-mid:#55555c;--anatomy-hi:#1a1a1e;--anatomy-faint:#bcbcc1;--anatomy-muted:#6c6c72;--anatomy-text:#3f3f45;--anatomy-shade-0:#cdcdc8;--anatomy-shade-1:#dadad5;--anatomy-shade-2:#e5e5e0;--anatomy-shade-3:#efefea;--anatomy-top:#f9f9f6;--we-steam:#d9480f;--we-exhaust:#1864ab}

.we-ball-light{fill:var(--anatomy-shade-2);stroke:none}

.we-film-legend{display:none}

 class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Cylinder, valve chests, condenser, air pump, beam, sun and planet gear, flywheel, governor</span></span><ol class="we-parts"><li><span class="we-num">1</span>Beam with Watt's parallel motion</li><li><span class="we-num">2</span>Piston and piston rod</li><li><span class="we-num">3</span>Cylinder, cut open, on its pedestal</li><li><span class="we-num">4</span>Valve chests, steam pipe, eduction pipe and plug rod</li><li><span class="we-num">5</span>Steam pipe from the boiler, with the throttle valve</li><li><span class="we-num">6</span>Separate condenser and air pump in the cold-water cistern</li><li><span class="we-num">7</span>Connecting rod with the planet gear</li><li><span class="we-num">8</span>Sun gear, shaft and flywheel</li><li><span class="we-num">9</span>Centrifugal governor with its belt and throttle rod</li><li><span class="we-num">10</span>Bed, column and frame</li></ol><span class="iso-caption">A double-acting rotative beam engine of the kind Boulton &amp; Watt built in the 1780s, drawn with the cylinder, the condenser and the air pump cut open. Steam from the boiler (in outline) passes the throttle valve and reaches the two valve chests. On the down stroke it is let in above the piston while the space below is open to the condenser; at the end of the stroke the valves change over, so the piston is pushed both ways. The used steam runs to the separate condenser, the idea Watt had in 1765 and patented in 1769: a vessel kept cold in a cistern, where a jet of water condenses the steam while the cylinder itself stays hot. The air pump then lifts the water out. Because the piston now pushes as well as pulls, a chain to the beam will not do, so Watt's parallel motion of 1784 guides the top of the piston rod in a nearly straight line while the beam end swings through an arc. At the other end the connecting rod carries a planet gear that cannot turn on it; it rolls round the sun gear on the flywheel shaft, and with equal gears the shaft turns twice for each double stroke. The gear, invented by William Murdoch and patented by Watt in 1781, did the work of a crank, which another patent covered. The flywheel evens out the strokes. The centrifugal governor, which Watt adapted in 1788, is spun by the shaft: when the engine runs faster the balls swing out and lift a sleeve, and a rod closes the throttle valve; when it slows they drop and the valve opens. Change the load and watch the speed settle. In this drawing a rod hung from the beam trips the valves and the air pump hangs from the parallel motion; the sizes, the speeds and the valve timing are the figure's own, not measurements of one engine. Taken apart, the numbers mark ten assemblies.</span></figcaption></figure><span class="we-sr" data-announce aria-live="polite"></span></main><script type="module">const AZIMUTH = 45;

  const back = rightmost(circleMeet(inner, geometry.motionLink, geometry.radiusAnchor, geometry.radiusRod));

    beamAngle,
    rodAngle,

      const from = ring[index];
      const to = ring[(index + 1) % ring.length];
      const normalX = to[1] - from[1];
      const normalZ = -(to[0] - from[0]);
      if (normalX * VIEW_X + normalZ * VIEW_Z <= 1e-6) continue;
      const quad = [[from[0], y1, from[1]], [to[0], y1, to[1]], [to[0], y0, to[1]], [from[0], y0, from[1]]];
      sides += `<path class="iso-shade" data-shade="${shadeOf(normalX, normalZ)}" d="${tools.pathOf(quad.map((point) => tools.iso(point, P)), true)}"/>`;
      edges += through([quad[1], quad[2], quad[3], quad[0]]);
    }
    return `<g class="iso-solid"><path class="iso-fill" d="${front}"/>${sides}<path class="iso-top" d="${front}"/><path class="iso-line iso-edge" data-tone="${tone}" d="${front}${edges}"/></g>`;
  }

  // A flat shape drawn on the plane y: a gear's face, a spoke, the piston in the cut cylinder.
  function face(polygon, y, tone = "mid", className = "we-face") {
    const d = onPlane(polygon, y);
    return `<path class="${className}" d="${d}"/><path class="iso-line" data-tone="${tone}" d="${d}"/>`;
  }

  function circlePoints(centre, radius, steps = 28) {
    const points = [];
    for (let step = 0; step < steps; step++) {
      const angle = (step / steps) * Math.PI * 2;
      points.push([centre[0] + radius * Math.cos(angle), centre[1] + radius * Math.sin(angle)]);
    }
    return points;
  }

  function rectangle(x0, x1, z0, z1) {
    return [[x0, z0], [x1, z0], [x1, z1], [x0, z1]];
  }

  // A pin seen end-on: a small filled dot on the plane y.
  function pin(point, y, radius = 1.1) {
    return `<path class="we-pin" d="${onPlane(circlePoints(point, radius, 10), y)}"/>`;
  }

  // A ball of the governor, shaded as a sphere in three tones: a dark disc as wide as the ball, a lighter
  // disc towards the light and a small highlight.
  function ball(centre, radius) {
    const [x, y] = tools.iso(centre, P);
    const size = radius * camera.k;
    const disc = (className, shiftX, shiftY, share) => `<circle class="${className}" cx="${(x + size * shiftX).toFixed(1)}" cy="${(y + size * shiftY).toFixed(1)}" r="${(size * share).toFixed(2)}"/>`;
    return disc("we-ball", 0, 0, 1) + disc("we-ball-light", -0.13, -0.16, 0.72) + disc("we-shine", -0.32, -0.37, 0.24);
  }

  return { onPlane, through, plate, face, circlePoints, rectangle, pin, ball };
}

Layout = createLayout(Engine);
Draw = createDraw({ iso, pathOf, cameraOf }, CONFIG.projection);
// The live half of the Watt engine figure. The build inlines this file after the kit, the pure model
// (Engine), the size table and drawing helpers (Layout, Draw) and CONFIG. It fills the empty slots the
// build left: beam, parallel motion, piston, air pump, plug rod, valve handles, gears, connecting rod,
// flywheel spokes, governor, throttle and the steam and exhaust that run through the pipes. Every
// position it draws comes from Engine.poseAt(crank angle).

const P = CONFIG.projection;
const SIZES = Layout.sizes;
const GEOMETRY = Engine.GEOMETRY;
const SHAFT = GEOMETRY.shaft;
const PLANET_REST = Engine.planetCentre(0, GEOMETRY);
const RUN_RATE = 7;
const FLOW_PER_RADIAN = 15;
const LOAD_STEP = 5;
const LONGEST_FRAME = 1 / 30;

const stage = document.querySelector(".iso-stage");
const readout = document.querySelector("[data-readout]");
const announcer = document.querySelector("[data-announce]");
const pauseButton = document.querySelector("[data-pause]");
const stepButton = document.querySelector("[data-step]");
const loadSlider = document.querySelector("[data-load]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const query = new URLSearchParams(location.search);
const manual = query.get("clock") === "manual";
// ?run=off keeps the engine paused until the reader starts it: for tests and for embedding.
const startsPaused = query.get("run") === "off";

function one(name) {
  return document.querySelector(`[data-dyn="${name}"]`);
}

function keyed(name, attribute) {
  const found = {};
  for (const element of document.querySelectorAll(`[data-dyn="${name}"]`)) found[element.getAttribute(attribute)] = element;
  return found;
}

const parts = {
  beam: one("beam"),
  radius: one("radius"),
  links: one("links"),
  piston: one("piston"),
  pistonRod: one("piston-rod"),
  bellCrank: one("bell-crank"),
  pump: one("pump"),
  pumpFill: one("pump-fill"),
  plug: one("plug"),
  handles: one("handles"),
  fills: keyed("fill", "data-fill"),
  sunFace: one("sun-face"),
  planet: one("planet"),
  planetFace: one("planet-face"),
  rod: one("rod"),
  link: one("link"),
  spokes: one("spokes"),
  governor: one("governor"),
  throttleRod: one("throttle-rod"),
  throttle: one("throttle"),
  belt: one("belt"),
  condenserFill: one("condenser-fill"),
  flows: keyed("flow", "data-flow"),
  chips: Array.from(document.querySelectorAll("[data-trace]")),
  stepItems: Array.from(document.querySelectorAll("[data-step-item]")),
  stepMarks: Array.from(document.querySelectorAll("[data-stepmark]")),
};

const written = new WeakMap();

function write(element, name, value) {
  let seen = written.get(element);
  if (!seen) {
    seen = {};
    written.set(element, seen);
  }
  if (seen[name] === value) return;
  seen[name] = value;
  if (name === "glow") element.style.setProperty("--glow", value);
  else if (name === "html") element.innerHTML = value;
  else if (name === "text") element.textContent = value;
  else if (value === null) element.removeAttribute(name);
  else element.setAttribute(name, value);
}

function setGlow(element, value) {
  write(element, "glow", String(Math.round(value * 100) / 100));
}

const camera = cameraOf(P);

function depthOfPoint(point) {
  return point[0] * camera.cosA + point[1] * camera.sinA;
}

// ---- state ---------------------------------------------------------------------------------------------

const engine = Engine.settleEngine(Engine.createEngine(0.5));
// `scale` slows the whole engine for the film's first stroke; `run` eases to 0 while the engine is apart.
const clock = { paused: startsPaused, stepping: false, visible: manual, frame: 0, last: 0, elapsed: 0, scale: 1, run: startsPaused ? 0 : 1, spin: 0 };
// The film shows six numbered steps during its slow stroke; the page leaves them to the trace.
const steps = { shown: 0 };

function say(text) {
  if (announcer) announcer.textContent = text;
}

function wantsToRun() {
  return !clock.paused && !apartBusy();
}

function follow(value, target, seconds, rate) {
  const next = value + (target - value) * (1 - Math.exp(-rate * seconds));
  return Math.abs(next - target) < 0.002 ? target : next;
}

function strokeSeconds() {
  const pace = engine.speed * Engine.ENGINE.nominal * clock.scale * Math.max(clock.run, 0.05);
  return Math.min(9, Math.PI / Math.max(pace, 0.05));
}

// What the engine reports while it runs, on the figure's own clock: one event per valve changeover and
// a few per turn of the gears.
function report(event, at) {
  if (event.name === "gear") {
    emit("gear", { speed: Math.round(event.speed * 1000) / 1000 }, at);
    return;
  }
  emit("valve", { direction: event.direction }, at);
  emit("chuff", { direction: event.direction, duration: Math.round(strokeSeconds() * 1000) / 1000 }, at);
  if (clock.stepping) {
    clock.stepping = false;
    setPaused(true);
  }
}

function advance(seconds) {
  clock.run = clock.paused ? 0 : follow(clock.run, wantsToRun() ? 1 : 0, seconds, RUN_RATE);
  const step = seconds * clock.scale * clock.run;
  if (step > 0) {
    const before = engine.time;
    const events = Engine.stepEngine(engine, step);
    clock.spin += Engine.flywheelTurnsPerMinute(engine) * (Engine.TAU / 60) * Engine.GOVERNOR.ratio * step;
    for (const event of events) report(event, clock.elapsed + ((event.at - before) / step) * seconds);
  }
  ageInset(seconds, step > 0);
  clock.elapsed += seconds;
}

// ---- drawing -------------------------------------------------------------------------------------------

function drawBeam(pose) {
  const B = SIZES.beam;
  const pins = [GEOMETRY.beamPivot, pose.beamEnd, pose.end, pose.inner].map((point) => Draw.pin(point, B.y1, 1.2)).join("");
  write(parts.beam, "html", Draw.plate(Layout.beamPolygon(pose.beamAngle), B.y0, B.y1, "hi") + pins);
}

function drawMotion(pose) {
  const M = SIZES.motion;
  const radiusRod = Draw.plate(Layout.barPolygon(GEOMETRY.radiusAnchor, pose.back, M.half), M.radiusY[0], M.radiusY[1]);
  write(parts.radius, "html", radiusRod + Draw.pin(GEOMETRY.radiusAnchor, M.radiusY[1]) + Draw.pin(pose.back, M.radiusY[1]));
  const backLink = Draw.plate(Layout.barPolygon(pose.inner, pose.back, M.half), M.linkY[0], M.linkY[1]);
  const mainLink = Draw.plate(Layout.barPolygon(pose.end, pose.rodTop, M.half), M.linkY[0], M.linkY[1]);
  const bar = Draw.plate(Layout.barPolygon(pose.back, pose.rodTop, M.half), M.barY[0], M.barY[1]);
  const pins = [pose.inner, pose.end].map((point) => Draw.pin(point, M.linkY[1])).join("") + [pose.back, pose.rodTop].map((point) => Draw.pin(point, M.barY[1])).join("");
  write(parts.links, "html", backLink + mainLink + bar + pins + Draw.pin(pose.pumpTop, M.linkY[1], 0.9));
}

function drawPiston(pose) {
  const Y = SIZES.cylinder;
  const rod = Draw.face(Draw.rectangle(Y.x - Y.rodHalf, Y.x + Y.rodHalf, pose.pistonZ, pose.rodTop[1]), 0.5, "hi");
  const piston = Draw.face(Draw.rectangle(Y.x - Y.bore, Y.x + Y.bore, pose.pistonZ - Y.pistonHalf, pose.pistonZ + Y.pistonHalf), 0.6, "hi");
  const packing = `<path class="iso-line" data-tone="mid" d="${Draw.onPlane([[Y.x - Y.bore, pose.pistonZ], [Y.x + Y.bore, pose.pistonZ]], 0.6, false)}"/>`;
  write(parts.piston, "html", piston + packing);
  write(parts.pistonRod, "html", rod + Draw.pin(pose.rodTop, 0.6, 1.3));
  const above = Draw.onPlane(Draw.rectangle(Y.x - Y.bore, Y.x + Y.bore, pose.pistonZ + Y.pistonHalf, Y.top), 0);
  const below = Draw.onPlane(Draw.rectangle(Y.x - Y.bore, Y.x + Y.bore, Y.bottom, pose.pistonZ - Y.pistonHalf), 0);
  write(parts.fills["top-steam"], "d", above);
  write(parts.fills["top-exhaust"], "d", above);
  write(parts.fills["bottom-steam"], "d", below);
  write(parts.fills["bottom-exhaust"], "d", below);
  setGlow(parts.fills["top-steam"], pose.valves.topSteam);
  setGlow(parts.fills["top-exhaust"], pose.valves.topExhaust);
  setGlow(parts.fills["bottom-steam"], pose.valves.bottomSteam);
  setGlow(parts.fills["bottom-exhaust"], pose.valves.bottomExhaust);
}

function drawPump(pose) {
  const U = SIZES.pump;
  const rod = Draw.face(Layout.barPolygon(pose.pumpTop, [U.x, pose.pumpZ], U.rodHalf), 0.5, "hi");
  const bucket = Draw.face(Draw.rectangle(U.x - U.r + 1.5, U.x + U.r - 1.5, pose.pumpZ - U.bucketHalf, pose.pumpZ + U.bucketHalf), 0.6, "hi");
  write(parts.pump, "html", rod + bucket);
  write(parts.pumpFill, "d", Draw.onPlane(Draw.rectangle(U.x - U.r + 1.5, U.x + U.r - 1.5, U.z0 + 2, pose.pumpZ - U.bucketHalf), 0));
  setGlow(parts.pumpFill, 0.9);
  setGlow(parts.condenserFill, 0.55);
}

function handleMarkup(lift, y, height, kind) {
  const B = SIZES.boxes;
  const angle = (-30 + 60 * lift) * Engine.DEGREE;
  const pivot = [B.x1, y, height];
  const tip = [B.x1 + B.handle * Math.cos(angle), y, height + B.handle * Math.sin(angle)];
  const [x, z] = iso(tip, P);
  const knob = `<circle class="we-knob" data-kind="${kind}" style="--glow:${lift.toFixed(2)}" cx="${x.toFixed(1)}" cy="${z.toFixed(1)}" r="${(1.5 * camera.k).toFixed(2)}"/>`;
  return `<path class="we-handle" d="${Draw.through([pivot, tip])}"/>${knob}`;
}

function drawValves(pose) {
  const B = SIZES.boxes;
  const upper = (B.upper[0] + B.upper[1]) / 2;
  const lower = (B.lower[0] + B.lower[1]) / 2;
  const valves = pose.valves;
  const markup = handleMarkup(valves.topSteam, B.steamY, upper, "steam") + handleMarkup(valves.topExhaust, B.exhaustY, upper, "exhaust") + handleMarkup(valves.bottomSteam, B.steamY, lower, "steam") + handleMarkup(valves.bottomExhaust, B.exhaustY, lower, "exhaust");
  write(parts.handles, "html", markup);
  write(parts.plug, "transform", translateAlong(P, [0, 0, -pose.plugDrop]));
}

function drawGears(pose) {
  const R = SIZES.gears;
  const teeth = GEOMETRY.teeth;
  const mark = [SHAFT[0] + 8 * Math.cos(pose.sunAngle), SHAFT[1] + 8 * Math.sin(pose.sunAngle)];
  const sun = Draw.face(Layout.gearPolygon(SHAFT, GEOMETRY.sunRadius, teeth, pose.sunAngle), R.y1, "hi");
  write(parts.sunFace, "html", sun + Draw.pin(SHAFT, R.y1, 2.4) + Draw.pin(mark, R.y1, 1));
  write(parts.planet, "transform", translateAlong(P, [pose.planet[0] - PLANET_REST[0], 0, pose.planet[1] - PLANET_REST[1]]));
  write(parts.planetFace, "html", Draw.face(Layout.gearPolygon(PLANET_REST, GEOMETRY.planetRadius, teeth, pose.rodAngle - Math.PI / 2), R.y1, "hi"));
  const rod = Draw.plate(Layout.barPolygon(pose.beamEnd, pose.planet, 2.3, 3.6), R.rodY[0], R.rodY[1], "hi");
  const along = [Math.cos(pose.rodAngle), Math.sin(pose.rodAngle)];
  const bolts = [5, -5].map((reach) => Draw.pin([pose.planet[0] + along[1] * reach, pose.planet[1] - along[0] * reach], R.rodY[1], 0.8)).join("");
  write(parts.rod, "html", rod + Draw.pin(pose.beamEnd, R.rodY[1], 1.3) + bolts);
  const link = Draw.plate(Layout.barPolygon(SHAFT, pose.planet, 2.1), R.linkY[0], R.linkY[1]);
  write(parts.link, "html", link + Draw.pin(SHAFT, R.linkY[1], 1.2) + Draw.pin(pose.planet, R.linkY[1], 1.2));
  const F = SIZES.flywheel;
  write(parts.spokes, "html", Layout.spokePolygons(pose.sunAngle).map((polygon) => Draw.face(polygon, F.y1 + 0.1, "mid")).join(""));
}

function armMarkup(arm, points) {
  // The arm is a flat bar: a dark stroke with a light one inside it.
  const armPath = Draw.through([points.top, arm.ball]);
  const armLine = `<path class="we-arm" d="${armPath}"/><path class="we-arm-core" d="${armPath}"/>`;
  const linkLine = `<path class="we-rod" d="${Draw.through([arm.joint, points.sleeve])}"/>`;
  return linkLine + armLine + Draw.ball(arm.ball, SIZES.governor.ball);
}

function drawGovernor(assembled) {
  const V = SIZES.governor;
  const points = Layout.governorPoints(engine.ballAngle, clock.spin);
  const arms = points.arms.slice().sort((a, b) => depthOfPoint(a.ball) - depthOfPoint(b.ball));
  const sleeve = `<path class="we-handle" d="${Draw.through([[V.x, V.y, points.sleeve[2] - 1.6], [V.x, V.y, points.sleeve[2] + 1.6]])}"/>`;
  const cap = `<path class="we-handle" d="${Draw.through([[V.x, V.y, V.top - 0.8], [V.x, V.y, V.top + 1.6]])}"/>`;
  write(parts.governor, "html", armMarkup(arms[0], points) + sleeve + cap + armMarkup(arms[1], points));
  const linkage = Layout.throttleLinkage(engine.ballAngle);
  const lift = (point) => [point[0], V.y, point[1]];
  const crank = `<path class="we-rod" d="${Draw.through([lift(linkage.sleeve), lift(linkage.pivot), lift(linkage.tip)])}"/>`;
  const rod = `<path class="we-rod" data-thin d="${Draw.through([lift(linkage.tip), lift(linkage.armTip)])}"/>`;
  const arm = `<path class="we-rod" d="${Draw.through([lift(linkage.armTip), lift(linkage.throttlePivot)])}"/>`;
  const pin = (point) => Draw.pin(point, V.y, 0.9);
  write(parts.bellCrank, "html", crank + pin(linkage.pivot) + pin(linkage.tip));
  write(parts.bellCrank, "opacity", assembled.toFixed(2));
  write(parts.throttleRod, "html", rod + arm + pin(linkage.armTip) + pin(linkage.throttlePivot));
  write(parts.throttleRod, "opacity", assembled.toFixed(2));
  write(parts.belt, "opacity", assembled.toFixed(2));
  const T = SIZES.pipes;
  const opening = Engine.throttleFor(engine.ballAngle);
  const angle = (1 - opening) * (Math.PI / 2) * 0.92;
  const reach = [3.6 * Math.cos(angle), 3.6 * Math.sin(angle)];
  const dial = T.steamY + T.throttleR + 1;
  write(parts.throttle, "d", Draw.through([[T.throttleX - reach[0], dial, T.mainZ - reach[1]], [T.throttleX + reach[0], dial, T.mainZ + reach[1]]]));
}

function drawFlows(pose, assembled) {
  const valves = pose.valves;
  const levels = {
    steamMain: 0.45 + 0.55 * Engine.throttleFor(engine.ballAngle),
    steamTop: valves.topSteam,
    steamBottom: valves.bottomSteam,
    exhaustTop: valves.topExhaust,
    exhaustBottom: valves.bottomExhaust,
    condensate: 0.85,
  };
  const offset = (-engine.crank * FLOW_PER_RADIAN * camera.k * 0.5).toFixed(1);
  for (const [name, level] of Object.entries(levels)) {
    setGlow(parts.flows[name], level * assembled);
    write(parts.flows[name], "stroke-dashoffset", offset);
  }
}

function drawTrace(pose) {
  const glows = Engine.traceAt(pose.stroke.share);
  parts.chips.forEach((chip, index) => setGlow(chip, glows[index]));
  write(parts.chips[0], "text", `${Engine.TRACE[0]} ${pose.stroke.direction}`);
  if (!parts.stepItems.length) return;
  const levels = Engine.stepsAt(pose.stroke.share);
  parts.stepItems.forEach((item, index) => setGlow(item, levels[index]));
}

// ---- the zoom frame ------------------------------------------------------------------------------------

// The one enlarged view is born from the engine: a thin source rectangle appears round the cylinder, the
// frame grows out of it to its place, four dashed lines join their corners, and then the rectangle and
// the lines fade so only the frame is left. `age` is the seconds since the birth began, null before it.
const INSET = CONFIG.inset;
const FILMED = CONFIG.explode.film;
const STAGE_SIZE = { width: CONFIG.explode.width, height: CONFIG.explode.height };
const BIRTH = { wait: 1.5, appear: 0.3, grow: 0.7, hold: 1, fade: 1.2, room: 1 };
const BIRTH_SECONDS = BIRTH.appear + BIRTH.grow + BIRTH.hold + BIRTH.fade;
const inset = { age: null, waited: 0, fade: 1 };

function insetPart(name) {
  return document.querySelector(`[data-inset="${name}"]`);
}

const insetParts = {
  group: insetPart("group"),
  clip: insetPart("clip"),
  paper: insetPart("paper"),
  edge: insetPart("edge"),
  view: insetPart("view"),
  guides: insetPart("guides"),
  source: insetPart("source"),
  lines: insetPart("lines"),
};

function easeOut(share) {
  const left = 1 - Engine.clamp(share, 0, 1);
  return 1 - left * left * left;
}

function insetLevels() {
  const age = inset.age;
  if (age === null) return { grow: 0, guides: 0, shown: 0, room: 0 };
  const grown = BIRTH.appear + BIRTH.grow + BIRTH.hold;
  return {
    grow: easeOut((age - BIRTH.appear) / BIRTH.grow),
    guides: Engine.smooth(0, BIRTH.appear, age) * (1 - Engine.smooth(grown, grown + BIRTH.fade, age)),
    shown: age >= BIRTH.appear ? 1 : 0,
    room: Engine.smooth(0, BIRTH.room, age),
  };
}

function insetGrowing() {
  return inset.age !== null && inset.age < BIRTH_SECONDS;
}

// The page starts the birth once the engine has run for a moment; the film sets the age itself.
function ageInset(seconds, running) {
  if (FILMED) return;
  if (inset.age !== null) {
    inset.age += seconds;
    return;
  }
  if (!running) return;
  inset.waited += seconds;
  if (inset.waited >= BIRTH.wait) inset.age = 0;
}

// The view the assembled engine is shown in: centred, or moved aside once the zoom frame needs the room.
function restView() {
  const centre = { x: STAGE_SIZE.width / 2, y: STAGE_SIZE.height / 2, zoom: 1 };
  const room = INSET.room;
  if (!room) return centre;
  const share = insetLevels().room;
  return { x: centre.x + (room.x - centre.x) * share, y: centre.y + (room.y - centre.y) * share, zoom: 1 + (room.zoom - 1) * share };
}

function sourceOnStage(view) {
  const source = INSET.source;
  return {
    x: STAGE_SIZE.width / 2 + (source.x - view.x) * view.zoom,
    y: STAGE_SIZE.height / 2 + (source.y - view.y) * view.zoom,
    width: source.width * view.zoom,
    height: source.height * view.zoom,
  };
}

function rectBetween(from, to, share) {
  const mix = (name) => from[name] + (to[name] - from[name]) * share;
  return { x: mix("x"), y: mix("y"), width: mix("width"), height: mix("height") };
}

function setRect(element, rect) {
  const radius = (INSET.frame.radius * rect.width) / INSET.frame.width;
  write(element, "x", rect.x.toFixed(2));
  write(element, "y", rect.y.toFixed(2));
  write(element, "width", rect.width.toFixed(2));
  write(element, "height", rect.height.toFixed(2));
  write(element, "rx", radius.toFixed(2));
}

function cornersOf(rect) {
  return [[rect.x, rect.y], [rect.x + rect.width, rect.y], [rect.x + rect.width, rect.y + rect.height], [rect.x, rect.y + rect.height]];
}

function cornerLines(source, frame) {
  const ends = cornersOf(frame);
  return cornersOf(source).map((corner, index) => `M${corner[0].toFixed(1)} ${corner[1].toFixed(1)}L${ends[index][0].toFixed(1)} ${ends[index][1].toFixed(1)}`).join("");
}

function drawInset(view, open) {
  const levels = insetLevels();
  const source = sourceOnStage(view);
  const frame = rectBetween(source, INSET.frame, levels.grow);
  const scale = frame.width / INSET.source.width;
  setRect(insetParts.clip, frame);
  setRect(insetParts.paper, frame);
  setRect(insetParts.edge, frame);
  setRect(insetParts.source, source);
  write(insetParts.view, "transform", `translate(${frame.x.toFixed(2)} ${frame.y.toFixed(2)}) scale(${scale.toFixed(4)}) translate(${(-INSET.source.x).toFixed(2)} ${(-INSET.source.y).toFixed(2)})`);
  write(insetParts.lines, "d", cornerLines(source, frame));
  const assembled = (1 - Engine.smooth(0, 0.3, open)) * inset.fade;
  write(insetParts.group, "opacity", (levels.shown * assembled).toFixed(2));
  write(insetParts.guides, "opacity", (levels.guides * assembled).toFixed(2));
}

function readoutText() {
  const governor = Engine.governorState(engine);
  const turns = Math.round(governor.flywheelTurns * clock.run * clock.scale);
  const paused = clock.paused ? "paused · " : "";
  // The film has no load slider, so its readout names the load the governor is answering.
  const state = FILMED ? `load ${Math.round(engine.load * 100)}% · ` : paused;
  return `${state}strokes ${engine.strokes} · ${turns} rpm · balls ${Math.round(governor.ballAngle / Engine.DEGREE)}° · throttle ${Math.round(governor.throttle * 100)}%`;
}

function draw() {
  const pose = Engine.poseAt(engine.crank);
  // Reduced motion: the zoom frame is not born, it is simply there.
  if (!FILMED && !manual && still.matches && inset.age === null) inset.age = BIRTH_SECONDS;
  const assembled = 1 - Engine.smooth(0, 0.3, Explode.maxShare(explode));
  drawBeam(pose);
  drawMotion(pose);
  drawPiston(pose);
  drawPump(pose);
  drawValves(pose);
  drawGears(pose);
  drawGovernor(assembled);
  drawFlows(pose, assembled);
  drawTrace(pose);
  const text = apartReadout() ?? readoutText();
  if (readout.textContent !== text) readout.textContent = text;
  write(stage, "data-stage", clock.paused ? "paused" : "running");
  drawApart(pose);
}

// ---- loop, pointer, keyboard ---------------------------------------------------------------------------

function tick(now) {
  const dt = clock.last ? Math.min((now - clock.last) / 1000, LONGEST_FRAME) : 1 / 60;
  clock.last = now;
  const flying = stepApart(dt);
  if (!still.matches) advance(dt);
  draw();
  const turning = !still.matches && (wantsToRun() || clock.run > 0);
  const growing = !still.matches && insetGrowing();
  clock.frame = clock.visible && (turning || flying || growing) ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (manual || clock.frame || !clock.visible) return;
  clock.last = 0;
  clock.frame = requestAnimationFrame(tick);
}

function setPaused(paused) {
  clock.paused = paused;
  if (paused) clock.run = 0;
  pauseButton.setAttribute("aria-pressed", String(paused));
  pauseButton.textContent = paused ? "Run" : "Pause";
}

function togglePause() {
  if (apartBusy()) return;
  clock.stepping = false;
  setPaused(!clock.paused);
  say(clock.paused ? "Engine paused." : "Engine running.");
  draw();
  run();
}

// Reduced motion: no travel, the engine jumps to the end of the stroke.
function jumpOneStroke() {
  const from = engine.strokes;
  for (let guard = 0; guard < 2400 && engine.strokes === from; guard++) Engine.stepEngine(engine, 1 / 240);
  draw();
}

function playOneStroke() {
  if (apartBusy()) return;
  if (still.matches) {
    jumpOneStroke();
  } else {
    setPaused(false);
    clock.run = 1;
    clock.stepping = true;
    run();
  }
  say(`One stroke ${Engine.strokeAt(engine.crank).direction}.`);
}

function setLoad(share) {
  engine.load = Engine.clamp(share, 0, 1);
  loadSlider.value = String(Math.round(engine.load * 100));
  say(`Load ${Math.round(engine.load * 100)} per cent.`);
  draw();
  run();
}

function onKey(event) {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (event.target === loadSlider) return;
  if (event.key === " " || event.key === "Enter") {
    event.preventDefault();
    togglePause();
  } else if (event.key === "ArrowRight") {
    event.preventDefault();
    playOneStroke();
  } else if (event.key === "ArrowUp" || event.key === "ArrowDown") {
    event.preventDefault();
    setLoad(engine.load + (event.key === "ArrowUp" ? LOAD_STEP : -LOAD_STEP) / 100);
  }
}

if (!manual) {
  stage.addEventListener("click", togglePause);
  stage.addEventListener("keydown", onKey);
  pauseButton.addEventListener("click", togglePause);
  stepButton.addEventListener("click", playOneStroke);
  loadSlider.addEventListener("input", () => setLoad(Number(loadSlider.value) / 100));
  new IntersectionObserver(
    (entries) => {
      clock.visible = entries[entries.length - 1].isIntersecting;
      if (clock.visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);
  still.addEventListener("change", () => {
    draw();
    run();
  });
}

// The exploded view, the sounds and the film hooks of the Watt engine figure. The build inlines this file
// right after live.js, inside the same block: it uses that file's clock, parts and helpers, and it ends
// with the start-up that brings the page to its first frame. Adapted from the Enigma figure.

const EX = CONFIG.explode;
const explode = Explode.createExplode();
const world = one("world");
const lens = one("lens");
const itemNodes = Array.from(world.children);
const badges = Array.from(document.querySelectorAll("[data-badge]"));
const apartButton = document.querySelector("[data-apart]");
const soundButton = document.querySelector("[data-sound]");
const worldZero = iso([0, 0, 0], P);
const AXES = [[1, 0, 0], [0, 1, 0], [0, 0, 1]].map((axis) => {
  const tip = iso(axis, P);
  return [tip[0] - worldZero[0], tip[1] - worldZero[1]];
});
const apartState = { painted: itemNodes.map((_, index) => index) };
const filmView = { camera: null };
const eventLog = [];
const FLIGHT_SECONDS = Explode.SPRING.stagger * Explode.LEAVE_ORDER.length + 0.5;

// ---- state ---------------------------------------------------------------------------------------------

function apartBusy() {
  return explode.apart || !Explode.isResting(explode);
}

function apartReadout() {
  if (explode.apart) return Explode.isResting(explode) ? "apart · engine stopped" : "coming apart";
  if (!Explode.isResting(explode)) return "going back together";
  return null;
}

function openApart(calm) {
  clock.stepping = false;
  Explode.setApart(explode, true, calm);
  emit("apart-open", { duration: FLIGHT_SECONDS });
  if (calm) emit("apart-hold", {});
  say("The engine is apart in ten numbered assemblies. It is stopped.");
}

function closeApart(calm) {
  Explode.setApart(explode, false, calm);
  emit("apart-close", { duration: FLIGHT_SECONDS });
  if (calm) emit("apart-seated", {});
  say("The engine is going back together.");
}

function toggleApart() {
  if (explode.apart) closeApart(still.matches);
  else openApart(still.matches);
  draw();
  run();
}

function everyShare(test) {
  return Explode.LEAVE_ORDER.every((name) => test(explode.shares[name]));
}

function stepApart(seconds) {
  if (Explode.isResting(explode)) return false;
  for (const event of Explode.stepExplode(explode, seconds)) {
    emit(`piece-${event.name}`, { piece: event.piece, number: Explode.PIECES[event.piece].number }, event.at);
    const arrived = (share) => !share.pending && (share.landed || share.crossed);
    if (event.name === "arrive" && everyShare((share) => share.target === 1 && arrived(share))) emit("apart-hold", {}, event.at);
    if (event.name === "land" && everyShare((share) => share.target === 0 && arrived(share))) emit("apart-seated", {}, event.at);
  }
  return true;
}

// ---- drawing -------------------------------------------------------------------------------------------

function sameList(a, b) {
  for (let index = 0; index < a.length; index++) {
    if (a[index] !== b[index]) return false;
  }
  return true;
}

// Re-appends the items only when the painter's order really changed.
function paintItems(shifts) {
  const assembled = Explode.isResting(explode) && !explode.apart;
  const order = assembled ? itemNodes.map((_, index) => index) : Explode.paintOrder(EX.items, shifts, AXES).order;
  if (sameList(order, apartState.painted)) return;
  const fragment = document.createDocumentFragment();
  for (const index of order) fragment.appendChild(itemNodes[index]);
  world.appendChild(fragment);
  apartState.painted = order;
}

// The page pulls back just far enough to keep the apart pose inside the card; the film sets its own camera.
function worldView(open) {
  if (filmView.camera) return filmView.camera;
  const rest = restView();
  if (EX.film) return rest;
  const fit = Math.min(1, (EX.width - 44) / EX.apart.width, (EX.height - 44) / EX.apart.height);
  const share = Engine.smooth(0, 1, open);
  return { x: rest.x + (EX.apart.x - rest.x) * share, y: rest.y + (EX.apart.y - rest.y) * share, zoom: rest.zoom + (fit - rest.zoom) * share };
}

function placeOnStage(node, point, view, opacity) {
  const spot = iso(point, P);
  const place = `${(((EX.width / 2 + (spot[0] - view.x) * view.zoom) / EX.width) * 100).toFixed(2)}%`;
  const drop = `${(((EX.height / 2 + (spot[1] - view.y) * view.zoom) / EX.height) * 100).toFixed(2)}%`;
  if (node.style.left !== place) node.style.left = place;
  if (node.style.top !== drop) node.style.top = drop;
  if (node.style.opacity !== opacity) node.style.opacity = opacity;
}

function placeBadges(shifts, view) {
  for (const badge of badges) {
    const name = badge.getAttribute("data-badge");
    const anchor = EX.anchors[name];
    const shift = shifts[name];
    const share = name === "base" ? Explode.maxShare(explode) : Explode.shareOf(explode, name);
    placeOnStage(badge, [anchor[0] + shift[0], anchor[1] + shift[1], anchor[2] + shift[2]], view, Engine.smooth(0.5, 0.95, share).toFixed(2));
  }
}

// The film's six step numbers, each beside the part its step is about.
function placeStepMarks(pose, view, open) {
  if (!parts.stepMarks.length) return;
  const levels = Engine.stepsAt(pose.stroke.share);
  parts.stepMarks.forEach((mark, index) => {
    placeOnStage(mark, CONFIG.stepPoints[index], view, (levels[index] * steps.shown * (1 - open)).toFixed(2));
  });
}

function drawApart(pose) {
  const shifts = Explode.shiftsOf(explode);
  const open = Math.min(1, Math.max(0, Explode.maxShare(explode)));
  itemNodes.forEach((node, index) => {
    const shift = shifts[EX.items[index].piece];
    const moved = Math.abs(shift[0]) + Math.abs(shift[1]) + Math.abs(shift[2]) > 1e-6;
    write(node, "transform", moved ? translateAlong(P, shift) : null);
  });
  paintItems(shifts);
  const view = worldView(open);
  const centredAtRest = view.zoom === 1 && view.x === EX.width / 2 && view.y === EX.height / 2;
  const centred = `translate(${EX.width / 2} ${EX.height / 2}) scale(${view.zoom.toFixed(4)}) translate(${(-view.x).toFixed(2)} ${(-view.y).toFixed(2)})`;
  write(lens, "transform", centredAtRest ? null : centred);
  placeBadges(shifts, view);
  placeStepMarks(pose, view, open);
  drawInset(view, open);
  const least = Math.min(...Explode.LEAVE_ORDER.map((name) => Explode.shareOf(explode, name)));
  const shown = Engine.smooth(0.55, 0.95, least).toFixed(2);
  if (document.body.style.getPropertyValue("--we-apart") !== shown) document.body.style.setProperty("--we-apart", shown);
  // The trace under the film's engine leaves as soon as the first part moves, before the legend comes in.
  const leaving = Engine.smooth(0, 0.3, open).toFixed(2);
  if (document.body.style.getPropertyValue("--we-open") !== leaving) document.body.style.setProperty("--we-open", leaving);
  write(stage, "data-open", open > 0.005 ? "" : null);
  write(apartButton, "aria-pressed", String(explode.apart));
  const label = explode.apart ? "Put together" : "Take apart";
  if (apartButton.textContent !== label) apartButton.textContent = label;
}

// ---- sound ---------------------------------------------------------------------------------------------
// The engine reports what happens as named events with a time on its own clock. The page plays them
// through Web Audio when the reader turns sound on; the recorder takes the log and renders the film's
// track offline (sound.mjs).

const sound = { on: false, context: null, master: null, bus: null, noise: null };

function emit(name, detail, at = null) {
  if (manual) eventLog.push({ name, at: Math.round((at ?? clock.elapsed) * 10000) / 10000, ...detail });
  if (sound.on && sound.context) VOICES[name]?.(detail);
}

// The same recipe as the film's track (sound.mjs): short, soft taps of noise that fade in over a few
// milliseconds, heard through two heavily damped resonances, and one quiet breath of low noise per stroke
// that rises and falls. Nothing drones, and the master gain is low.
const MASTER_GAIN = 0.16;
const HIGH_PASS = 110;
const LOW_PASS = 3500;
const MODE_GAIN = 3;
const TAP_SECONDS = 0.07;
const decibels = (value) => 10 ** (value / 20);
const BODIES = {
  valve: { modes: [[820, 0.0035, 1], [1450, 0.0025, 0.5]], attack: 0.003, blow: 0.003 },
  gear: { modes: [[1100, 0.003, 1], [1900, 0.002, 0.4]], attack: 0.003, blow: 0.0025 },
  part: { modes: [[260, 0.007, 1], [520, 0.005, 0.4]], attack: 0.005, blow: 0.006 },
  reseat: { modes: [[170, 0.009, 1], [340, 0.006, 0.5]], attack: 0.006, blow: 0.008 },
};
const LEVELS = { valve: decibels(-2), gear: decibels(-16), part: decibels(-6), partLeaving: decibels(-9), reseat: decibels(-3), chuff: decibels(-15) };
// A puff lasts half of its stroke at most, so at running speed each one ends in silence before the next.
const CHUFF = { frequency: 320, sharpness: 0.8, rise: 0.3, longest: 1.2, share: 0.5 };

// Everything goes through a gentle high-pass and a gentle low-pass, then one low master gain.
function audioReady() {
  if (sound.context) return sound.context;
  const context = new AudioContext();
  const buffer = context.createBuffer(1, context.sampleRate * 2, context.sampleRate);
  const samples = buffer.getChannelData(0);
  for (let index = 0; index < samples.length; index++) samples[index] = Math.random() * 2 - 1;
  sound.context = context;
  sound.noise = buffer;
  sound.master = context.createGain();
  sound.master.gain.value = MASTER_GAIN;
  sound.master.connect(context.destination);
  const dull = context.createBiquadFilter();
  dull.type = "lowpass";
  dull.frequency.value = LOW_PASS;
  dull.Q.value = 0.5;
  dull.connect(sound.master);
  sound.bus = context.createBiquadFilter();
  sound.bus.type = "highpass";
  sound.bus.frequency.value = HIGH_PASS;
  sound.bus.Q.value = 0.5;
  sound.bus.connect(dull);
  return context;
}

// No two taps are the same: a few per cent of pitch, a couple of decibels, a few milliseconds.
function variationOf() {
  const spread = () => Math.random() * 2 - 1;
  return { pitch: 1 + spread() * 0.07, level: decibels(spread() * 2), late: Math.random() * 0.004 };
}

function noiseSource() {
  const source = sound.context.createBufferSource();
  source.buffer = sound.noise;
  source.loop = true;
  return source;
}

// One tap: the noise of the blow fades in over a few milliseconds, never at once, and dies away; two
// low-Q resonances give it its body and are silent again within about 35 ms.
function tap(body, level) {
  const context = sound.context;
  const variation = variationOf();
  const start = context.currentTime + variation.late;
  const source = noiseSource();
  const blow = context.createGain();
  blow.gain.setValueAtTime(0, start);
  blow.gain.linearRampToValueAtTime(1, start + body.attack);
  blow.gain.setTargetAtTime(0, start + body.attack, body.blow);
  source.connect(blow);
  for (const [frequency, ringTime, share] of body.modes) {
    const mode = context.createBiquadFilter();
    const out = context.createGain();
    mode.type = "bandpass";
    mode.frequency.value = frequency * variation.pitch;
    mode.Q.value = Math.max(1, Math.PI * frequency * ringTime);
    out.gain.value = share * level * variation.level * MODE_GAIN;
    blow.connect(mode).connect(out).connect(sound.bus);
  }
  source.start(start, Math.random() * 0.5);
  source.stop(start + TAP_SECONDS);
}

// One breath of low noise for a stroke: it swells gently, then falls away to nothing before the next.
function chuff(detail) {
  const context = sound.context;
  const variation = variationOf();
  const length = Math.min(CHUFF.longest, detail.duration * CHUFF.share);
  const start = context.currentTime;
  const source = noiseSource();
  const band = context.createBiquadFilter();
  const swell = context.createGain();
  band.type = "bandpass";
  band.frequency.value = CHUFF.frequency * variation.pitch * (detail.direction === "down" ? 1 : 0.9);
  band.Q.value = CHUFF.sharpness;
  swell.gain.setValueAtTime(0, start);
  swell.gain.linearRampToValueAtTime(LEVELS.chuff * variation.level, start + length * CHUFF.rise);
  swell.gain.linearRampToValueAtTime(0, start + length);
  source.connect(band).connect(swell).connect(sound.bus);
  source.start(start, Math.random());
  source.stop(start + length + 0.02);
}

const VOICES = {
  valve: () => tap(BODIES.valve, LEVELS.valve),
  gear: () => tap(BODIES.gear, LEVELS.gear),
  chuff,
  "piece-leave": () => tap(BODIES.part, LEVELS.partLeaving),
  "piece-land": () => tap(BODIES.part, LEVELS.part),
  "apart-seated": () => tap(BODIES.reseat, LEVELS.reseat),
};

function toggleSound() {
  sound.on = !sound.on;
  if (sound.on) audioReady().resume();
  soundButton.setAttribute("aria-pressed", String(sound.on));
  soundButton.textContent = sound.on ? "Sound on" : "Sound";
}

// ---- start ---------------------------------------------------------------------------------------------

if (!manual) {
  stage.addEventListener("keydown", (event) => {
    if (!event.shiftKey || event.ctrlKey || event.metaKey || event.altKey || event.key.toUpperCase() !== "E") return;
    event.preventDefault();
    toggleApart();
  });
  apartButton.addEventListener("click", toggleApart);
  soundButton.addEventListener("click", toggleSound);
}

const startLoad = Number(query.get("load"));
if (query.has("load") && Number.isFinite(startLoad)) {
  engine.load = Engine.clamp(startLoad / 100, 0, 1);
  Engine.settleEngine(engine);
  loadSlider.value = String(Math.round(engine.load * 100));
}
setPaused(clock.paused);
if (query.get("apart") === "1") Explode.setApart(explode, true, true);
draw();

// A deterministic clock for frame-by-frame capture: open the page with ?clock=manual and drive it from
// here. Every call advances the figure's own clock, so the event log carries exact film times.
window.__watt = {
  advance(seconds) {
    explode.time = clock.elapsed;
    stepApart(seconds);
    advance(seconds);
    draw();
  },
  setScale(scale) {
    clock.scale = scale;
  },
  setLoad(share) {
    engine.load = Engine.clamp(share, 0, 1);
  },
  setPaused(paused) {
    setPaused(paused);
  },
  setApart(apart) {
    explode.time = clock.elapsed;
    if (apart) openApart(false);
    else closeApart(false);
  },
  camera(x, y, zoom, weight) {
    filmView.camera = { x, y, zoom };
    document.body.style.setProperty("--anatomy-weight", `${weight}px`);
    draw();
  },
  steps(opacity) {
    steps.shown = opacity;
    document.body.style.setProperty("--we-steps", String(opacity));
  },
  // The zoom frame: seconds since its birth began (null before it) and how much of it still shows.
  inset(age, fade) {
    inset.age = age;
    inset.fade = fade;
  },
  project(point) {
    return iso(point, P);
  },
  view() {
    return { width: EX.width, height: EX.height, apart: EX.apart };
  },
  takeEvents() {
    return eventLog.splice(0);
  },
  state() {
    const stroke = Engine.strokeAt(engine.crank);
    const pose = Engine.poseAt(engine.crank);
    return {
      strokes: engine.strokes,
      direction: stroke.direction,
      share: Math.round(stroke.share * 10000) / 10000,
      speed: Math.round(engine.speed * 10000) / 10000,
      load: engine.load,
      throttle: Math.round(Engine.throttleFor(engine.ballAngle) * 10000) / 10000,
      ballDegrees: Math.round((engine.ballAngle / Engine.DEGREE) * 100) / 100,
      pistonZ: Math.round(pose.pistonZ * 100) / 100,
      sunTurns: Math.round((pose.sunAngle / Engine.TAU) * 1000) / 1000,
      valves: pose.valves,
      paused: clock.paused,
      apart: explode.apart,
      open: Math.round(Explode.maxShare(explode) * 10000) / 10000,
      resting: Explode.isResting(explode),
      time: Math.round(clock.elapsed * 10000) / 10000,
      readout: readout.textContent,
    };
  },
};

}
</script></body></html>
