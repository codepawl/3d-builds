an class="ma-chip" data-trace="6">land on the centre engine</span></div><div class="ma-pathkey"></div></div></div><figcaption class="iso-legend"><span class="ma-controls" role="group" aria-label="Flight controls"><button type="button" data-apart aria-pressed="false">Take apart</button><button type="button" data-sound aria-pressed="false">Sound</button><button type="button" data-launch>Launch</button></span><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Fairing, payload, second stage, Merlin Vacuum, interstage, LOX and RP-1 tanks, legs, nine engines</span></span><ol class="ma-parts"><li><span class="ma-num">1</span>Fairing half, carbon composite</li><li><span class="ma-num">2</span>Fairing half, opened by pneumatic pushers</li><li><span class="ma-num">3</span>Payload on its adapter</li><li><span class="ma-num">4</span>Second stage: LOX and RP-1 tanks, nitrogen thrusters</li><li><span class="ma-num">5</span>Merlin Vacuum engine with its long 165:1 nozzle</li><li><span class="ma-num">6</span>Interstage with four grid fins and nitrogen thrusters</li><li><span class="ma-num">7</span>Liquid oxygen tank, down to the common dome</li><li><span class="ma-num">8</span>RP-1 kerosene tank</li><li><span class="ma-num">9</span>Four landing legs, folded up for the climb</li><li><span class="ma-num">10</span>Nine Merlin engines, eight round a centre one</li><li><span class="ma-num">11</span>Launch pad SLC-40 and droneship</li></ol><span class="iso-caption">SpaceX's Falcon 9 is a reusable two-stage rocket, 70 m tall and 3.7 m across. Nine Merlin engines, eight round a centre one, burn liquid oxygen and RP-1 kerosene from the first stage's tanks; a common dome separates the two tanks. The rocket is held down until its systems check out, climbs, eases its engines back round max Q, and cuts them off; pneumatic pushers then separate the stages and the second stage's single Merlin Vacuum engine lights a few seconds later. The booster flips round on nitrogen thrusters, can burn back toward the launch site, slows with an entry burn, steers with four grid fins and lands on its four legs with a last burn, here on a droneship, a barge that holds its own position at sea. After separation the second stage burns on toward orbit with the payload, and the fairing halves come down under parachutes and are scooped out of the sea to fly again. Landing the first stage lets SpaceX fly the most expensive part of the rocket again; the first droneship landing was on the CRS-8 flight in April 2016. Ascent times follow a sample timeline in SpaceX's user's guide; heights, speeds, throttle and the recovery burns come from a small model with chosen values, not from a real mission.</span><span class="ma-simplified"><span class="ma-simplified-label">Simplified:</span> The payload is a plain box standing in for any satellite. The legs are flat strips without their struts. Engine bells are plain turned shapes; the flames, shock diamonds and exhaust cloud are drawn effects driven by throttle and altitude, not measured shapes. The pad (mount, clamps, trench, erector, access tower, lightning towers and wires) is drawn plain after photographs, with the lightning towers closer in than they stand; the droneship is drawn small; the erector tilts back in about a second, and the flight's distances and times are squeezed to fit the frame. Tank and engine lengths are estimated between the sourced height and diameters.</span></figcaption></figure><span class="ma-sr" data-announce aria-live="polite"></span></main><script type="module">// From Anatomy by Ryan (github.com/wheresryan22/anatomy), MIT license; see THIRD_PARTY_NOTICES.md.

const Kit = {};
Kit.Motion = (() => {
// Motion that reads as physical without a physics engine: damped springs for keys, levers, returns and
// the exploded view; inertia for anything that spins up and coasts down; kinematic joints solved from the
// model (revolute, prismatic, gear mesh, crank-slider, four-bar). Pure functions, no DOM: the build, the
// page, the film and the tests all use this one file. World vectors are [x, y, z].

const LONGEST_SPRING_STEP = 1 / 240;

function clamp(value, low, high) {
  return Math.min(high, Math.max(low, value));
}

function smoothstep(from, to, value) {
  const share = clamp((value - from) / (to - from), 0, 1);
  return share * share * (3 - 2 * share);
}

function easeOutCubic(share) {
  const left = 1 - clamp(share, 0, 1);
  return 1 - left * left * left;
}

// ---- springs -------------------------------------------------------------------------------------------

// A spring with unit mass. `stiffness` and `damping` are per second squared and per second.
function createSpring({ stiffness, damping, value = 0, target = value }) {
  return { stiffness, damping, value, velocity: 0, target, settled: value === target };
}

// Stiffness and damping for a spring that settles in about `settleSeconds` with the given damping ratio.
// A ratio of 1 is critical: the fastest return that never passes the target.
function springFor(settleSeconds, dampingRatio = 1) {
  const naturalFrequency = 6.6 / (settleSeconds * Math.max(0.3, dampingRatio));
  return { stiffness: naturalFrequency * naturalFrequency, damping: 2 * dampingRatio * naturalFrequency };
}

function dampingRatioOf(spring) {
  return spring.damping / (2 * Math.sqrt(spring.stiffness));
}

// The largest share of a step the spring can pass its target by, from its damping ratio.
function overshootBound(spring) {
  const ratio = dampingRatioOf(spring);
  if (ratio >= 1) return 0;
  return Math.exp((-Math.PI * ratio) / Math.sqrt(1 - ratio * ratio));
}

function setSpringTarget(spring, target) {
  if (spring.target === target) return;
  spring.target = target;
  spring.settled = false;
}

// Semi-implicit Euler in short pieces, so a long jump of the clock cannot shake the spring loose.
// A spring held to the rate its actuator can give (a thruster, a fin, a motor): the value never moves
// faster than `maxRate` per second, so a turn has a cause that limits it. Returns the value.
function stepRateLimited(spring, seconds, maxRate) {
  const before = spring.value;
  stepSpring(spring, seconds);
  const limit = maxRate * seconds;
  const wanted = spring.value - before;
  const change = Math.max(-limit, Math.min(limit, wanted));
  if (change !== wanted && seconds > 0) {
    spring.value = before + change;
    spring.velocity = change / seconds;
    spring.settled = false;
  }
  return spring.value;
}

function stepSpring(spring, seconds) {
  if (spring.settled) return spring.value;
  const pieces = Math.max(1, Math.ceil(seconds / LONGEST_SPRING_STEP));
  const piece = seconds / pieces;
  for (let index = 0; index < pieces; index++) {
    const pull = spring.stiffness * (spring.target - spring.value) - spring.damping * spring.velocity;
    spring.velocity += pull * piece;
    spring.value += spring.velocity * piece;
  }
  if (Math.abs(spring.value - spring.target) < 0.0005 && Math.abs(spring.velocity) < 0.004) {
    spring.value = spring.target;
    spring.velocity = 0;
    spring.settled = true;
  }
  return spring.value;
}

// ---- inertia -------------------------------------------------------------------------------------------

// Something that spins: it spins up towards its driven speed and coasts down when the drive stops, each
// as a first-order lag with its own time constant. Speeds are in turns per second, the angle in turns.
function createInertia({ spinUpSeconds, coastSeconds = spinUpSeconds, speed = 0, angle = 0 }) {
  return { spinUpSeconds, coastSeconds, speed, angle };
}

// Exact for a constant drive over the step, so the result does not depend on the frame rate.
function stepInertia(inertia, drivenSpeed, seconds) {
  const speedingUp = Math.abs(drivenSpeed) > Math.abs(inertia.speed);
  const timeConstant = speedingUp ? inertia.spinUpSeconds : inertia.coastSeconds;
  const decay = Math.exp(-seconds / timeConstant);
  const startSpeed = inertia.speed;
  const endSpeed = drivenSpeed + (startSpeed - drivenSpeed) * decay;
  inertia.angle += drivenSpeed * seconds + (startSpeed - drivenSpeed) * timeConstant * (1 - decay);
  inertia.speed = endSpeed;
  return inertia.angle;
}

// ---- joints --------------------------------------------------------------------------------------------

function add(a, b) {
  return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
}

function subtract(a, b) {
  return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
}

function scale(vector, factor) {
  return [vector[0] * factor, vector[1] * factor, vector[2] * factor];
}

function dot(a, b) {
  return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
}

function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}

function unitVector(vector) {
  const length = Math.hypot(vector[0], vector[1], vector[2]) || 1;
  return scale(vector, 1 / length);
}

function distance(a, b) {
  return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
}

// A hinge: `point` turned by `angle` radians about the line through `pivot` along `axis` (Rodrigues).
function revolute(pivot, axis, angle, point) {
  const direction = unitVector(axis);
  const offset = subtract(point, pivot);
  const cosine = Math.cos(angle);
  const sine = Math.sin(angle);
  const along = scale(direction, dot(direction, offset) * (1 - cosine));
  const turned = add(add(scale(offset, cosine), scale(cross(direction, offset), sine)), along);
  return add(pivot, turned);
}

// A slide: the point `travel` units along `axis` from `origin`.
function prismatic(origin, axis, travel) {
  return add(origin, scale(unitVector(axis), travel));
}

// Two meshed spur gears. The driven gear turns the other way, slower by the tooth ratio. `phase` is the
// driven gear's angle at a driver angle of zero, chosen so a tooth sits in a gap (see meshPhase).
function gearMesh({ driverTeeth, drivenTeeth, driverAngle, phase = 0 }) {
  const ratio = driverTeeth / drivenTeeth;
  return { drivenAngle: -driverAngle * ratio + phase, ratio };
}

// The phase that puts a tooth of the driven gear in a gap of the driver on the line of centres. Angles
// are measured from that line, with tooth 0 of each gear centred on it at angle zero.
function meshPhase(drivenTeeth) {
  return Math.PI + Math.PI / drivenTeeth;
}

// A crank turning in the xz plane about `centre`, a rod of `rodLength` to a slider on the line through
// the centre along x. Returns the crank pin, the slider pin and the rod's angle.
function crankSlider({ centre = [0, 0, 0], crankRadius, rodLength, crankAngle }) {
  if (rodLength <= crankRadius) throw new Error("crankSlider: the rod must be longer than the crank");
  const pin = [centre[0] + crankRadius * Math.cos(crankAngle), centre[1], centre[2] + crankRadius * Math.sin(crankAngle)];
  const rise = pin[2] - centre[2];
  const reach = Math.sqrt(rodLength * rodLength - rise * rise);
  const slider = [pin[0] + reach, centre[1], centre[2]];
  return { pin, slider, rodAngle: Math.atan2(-rise, reach) };
}

// The two points where circles (centre, radius) in a plane meet; `branch` picks one (1 or -1).
function circleMeet(firstCentre, firstRadius, secondCentre, secondRadius, branch) {
  const gap = Math.hypot(secondCentre[0] - firstCentre[0], secondCentre[1] - firstCentre[1]);
  if (gap > firstRadius + secondRadius + 1e-9 || gap < Math.abs(firstRadius - secondRadius) - 1e-9 || gap === 0) return null;
  const along = (firstRadius * firstRadius - secondRadius * secondRadius + gap * gap) / (2 * gap);
  const across = Math.sqrt(Math.max(0, firstRadius * firstRadius - along * along));
  const unitX = (secondCentre[0] - firstCentre[0]) / gap;
  const unitY = (secondCentre[1] - firstCentre[1]) / gap;
  const footX = firstCentre[0] + along * unitX;
  const footY = firstCentre[1] + along * unitY;
  return [footX - branch * across * unitY, footY + branch * across * unitX];
}

// A planar four-bar in (x, z): ground pivots A at the origin and D at `ground` along x, the crank AB of
// length `crank` at `crankAngle`, the coupler BC and the rocker DC. Returns null where it cannot assemble.
function fourBar({ ground, crank, coupler, rocker, crankAngle, branch = 1 }) {
  const pivotA = [0, 0];
  const pivotD = [ground, 0];
  const pointB = [crank * Math.cos(crankAngle), crank * Math.sin(crankAngle)];
  const pointC = circleMeet(pointB, coupler, pivotD, rocker, branch);
  if (!pointC) return null;
  const rockerAngle = Math.atan2(pointC[1] - pivotD[1], pointC[0] - pivotD[0]);
  const toWorld = (point) => [point[0], 0, point[1]];
  return { a: toWorld(pivotA), b: toWorld(pointB), c: toWorld(pointC), d: toWorld(pivotD), rockerAngle };
}

const MotionApi = {
  clamp,
  smoothstep,
  easeOutCubic,
  createSpring,
  springFor,
  dampingRatioOf,
  overshootBound,
  setSpringTarget,
  stepSpring,
  stepRateLimited,
  createInertia,
  stepInertia,
  unitVector,
  distance,
  revolute,
  prismatic,
  gearMesh,
  meshPhase,
  crankSlider,
  fourBar,
};

return { clamp, smoothstep, easeOutCubic, createSpring, springFor, dampingRatioOf, overshootBound, setSpringTarget, stepRateLimited, stepSpring, createInertia, stepInertia, unitVector, distance, revolute, prismatic, gearMesh, meshPhase, crankSlider, fourBar, MotionApi };
})();
Kit.Explode = (() => {
// The exploded view, for any machine: which assemblies it comes apart into, where each one goes along its
// real removal axis, the staggered springs that carry them, the painter's order of the items in any frame
// of the flight and a coarse check that no solid block passes through another on the way. No DOM.
// Adapted from the Edison and Enigma figures; the order and pass-through audit is theirs unchanged.
const { createSpring, setSpringTarget, stepSpring, unitVector } = Kit.Motion;
const DEFAULT_SPRING = { stagger: 0.22, stiffness: 46, damping: 11.2 };
const TOUCH = 0.6;
const SCREEN_GAP = 0.4;

// `pieces`: { name: { number, name, axis: [x, y, z], distance, ride? } } or `move: [x, y, z]` instead of
// axis and distance. Pieces missing from `leaveOrder` stay where they are (the base everything leaves).
function createExplodeKit({ pieces, leaveOrder, spring = {} }) {
  const SPRING = { ...DEFAULT_SPRING, ...spring };
  const PIECES = {};
  for (const [name, piece] of Object.entries(pieces)) {
    const move = piece.move ?? unitVector(piece.axis).map((component) => component * piece.distance);
    PIECES[name] = { ...piece, move };
  }
  const LEAVE_ORDER = leaveOrder.slice();

  function createExplode() {
    const shares = {};
    for (const name of LEAVE_ORDER) shares[name] = { spring: createSpring(SPRING), pending: null, landed: true, crossed: false };
    return { shares, apart: false, time: 0 };
  }

  function valueOf(share) {
    return share.spring.value;
  }

  function settle(share, target) {
    Object.assign(share.spring, { value: target, velocity: 0, target, settled: true });
    Object.assign(share, { pending: null, landed: true, crossed: false });
  }

  // Reschedules only the assemblies whose target changes: one that has not left yet simply stays.
  function setApart(state, apart, calm) {
    state.apart = apart;
    const target = apart ? 1 : 0;
    const order = apart ? LEAVE_ORDER : LEAVE_ORDER.slice().reverse();
    let index = 0;
    for (const name of order) {
      const share = state.shares[name];
      if (calm) {
        settle(share, target);
        continue;
      }
      if (share.pending && share.pending.value !== target) share.pending = null;
      const heading = share.pending ? share.pending.value : share.spring.target;
      if (heading === target) continue;
      share.pending = { value: target, at: state.time + index * SPRING.stagger };
      index += 1;
    }
  }

  function startPending(state, name, share, events) {
    setSpringTarget(share.spring, share.pending.value);
    share.pending = null;
    share.landed = false;
    share.crossed = false;
    events.push({ name: share.spring.target === 1 ? "leave" : "return", piece: name, at: state.time });
  }

  function stepShare(state, name, dt, events) {
    const share = state.shares[name];
    if (share.pending && state.time >= share.pending.at - 1e-9) startPending(state, name, share, events);
    if (share.landed) return;
    const before = valueOf(share) - share.spring.target;
    stepSpring(share.spring, dt);
    const after = valueOf(share) - share.spring.target;
    if (!share.crossed && before * after <= 0) {
      share.crossed = true;
      events.push({ name: share.spring.target === 1 ? "arrive" : "land", piece: name, at: state.time });
    }
    if (share.spring.settled) share.landed = true;
  }

  // Advances every spring by `seconds` and returns what happened: leave, arrive, return, land.
  function stepExplode(state, seconds) {
    const events = [];
    const steps = Math.max(4, Math.ceil(seconds * 120));
    const dt = seconds / steps;
    for (let step = 0; step < steps; step++) {
      state.time += dt;
      for (const name of LEAVE_ORDER) stepShare(state, name, dt, events);
    }
    return events;
  }

  function isResting(state) {
    return LEAVE_ORDER.every((name) => state.shares[name].landed && !state.shares[name].pending);
  }

  function maxShare(state) {
    return Math.max(...LEAVE_ORDER.map((name) => valueOf(state.shares[name])));
  }

  function leastShare(state) {
    return Math.min(...LEAVE_ORDER.map((name) => valueOf(state.shares[name])));
  }

  function shareOf(state, piece) {
    const share = state.shares[piece];
    return share ? valueOf(share) : 0;
  }

  function isFixed(piece) {
    return !LEAVE_ORDER.includes(piece);
  }

  function displacementOf(state, piece) {
    const part = PIECES[piece];
    const own = shareOf(state, piece);
    const shift = part.move.map((component) => component * own);
    if (!part.ride) return shift;
    const carried = displacementOf(state, part.ride);
    return shift.map((component, axis) => component + carried[axis]);
  }

  function shiftsOf(state) {
    const shifts = {};
    for (const name of Object.keys(PIECES)) shifts[name] = displacementOf(state, name);
    return shifts;
  }

  function fullShifts() {
    const state = createExplode();
    setApart(state, true, true);
    return shiftsOf(state);
  }

  // Plays a list of commands [{ at, apart }] at 60 frames a second until every spring has landed.
  function replay(commands, visit) {
    const state = createExplode();
    const frame = 1 / 60;
    let next = 0;
    for (let step = 0; step < 60 * 40; step++) {
      const now = step * frame;
      while (next < commands.length && commands[next].at <= now + 1e-9) {
        setApart(state, commands[next].apart, false);
        next += 1;
      }
      stepExplode(state, frame);
      visit(state, now + frame);
      if (next >= commands.length && isResting(state)) return;
    }
  }

  function flights() {
    const settled = SPRING.stagger * LEAVE_ORDER.length + 3;
    const list = [{ label: "opening and closing", commands: [{ at: 0, apart: true }, { at: settled, apart: false }] }];
    for (let boundary = 1; boundary <= LEAVE_ORDER.length; boundary++) {
      for (const side of [-0.008, 0.008]) {
        const at = boundary * SPRING.stagger + side;
        list.push({ label: `reversal at ${at.toFixed(3)} s`, commands: [{ at: 0, apart: true }, { at, apart: false }] });
        list.push({ label: `re-opening at ${at.toFixed(3)} s`, commands: [{ at: 0, apart: true }, { at: settled, apart: false }, { at: settled + at, apart: true }] });
      }
    }
    return list;
  }

  function restOrder(items, axes) {
    const measured = items.map((item, index) => ({ ...item, piece: `measure-${index}` }));
    const shifts = {};
    measured.forEach((item, index) => {
      shifts[item.piece] = index === 0 ? [0, 0, 0] : [0, 0, 1e-3 * index];
    });
    return paintOrder(measured, shifts, axes);
  }

  // The audit the build runs with --audit: hand-set order against measured depth at rest, order cycles
  // and block pass-through in every frame of the springs, opening, closing and reversing at every stagger.
  function auditExplode(items, axes) {
    const contradictions = restContradictions(items, axes);
    const atRest = blockDepths(items, shiftsOf(createExplode()));
    const through = new Map();
    const loops = new Map();
    const tally = { frames: 0, cycles: 0, worstCycle: "" };
    for (const flight of flights()) {
      replay(flight.commands, (state, seconds) => auditFrame(items, axes, shiftsOf(state), `${flight.label} at ${seconds.toFixed(3)} s`, { atRest, through, loops, tally }));
    }
    const apart = blockDepths(items, fullShifts());
    const sunkApart = Array.from(apart).filter(([pair, depth]) => depth > (atRest.get(pair) ?? 0) + TOUCH);
    return { contradictions, through, sunkApart, cycles: tally.cycles, worstCycle: tally.worstCycle, loops, frames: tally.frames, flights: flights().length };
  }

  return { SPRING, PIECES, LEAVE_ORDER, createExplode, setApart, stepExplode, isResting, maxShare, leastShare, shareOf, isFixed, displacementOf, shiftsOf, fullShifts, movedBox, paintOrder, restOrder, auditExplode, replay };
}

function auditFrame(items, axes, shifts, where, record) {
  record.tally.frames += 1;
  const painted = paintOrder(items, shifts, axes);
  if (painted.cycles > 0) {
    record.tally.cycles += 1;
    record.tally.worstCycle = where;
    const ring = painted.loop.map((index) => items[index].label).sort().join(" | ");
    record.loops.set(ring, (record.loops.get(ring) ?? 0) + 1);
  }
  for (const [pair, depth] of blockDepths(items, shifts)) {
    const allowed = (record.atRest.get(pair) ?? 0) + TOUCH;
    if (depth <= allowed) continue;
    const known = record.through.get(pair);
    if (!known || depth > known.depth) record.through.set(pair, { depth, where });
  }
}

function movedBox(bounds, shift) {
  return [bounds[0] + shift[0], bounds[1] + shift[0], bounds[2] + shift[1], bounds[3] + shift[1], bounds[4] + shift[2], bounds[5] + shift[2]];
}

// The silhouette of an axis-aligned box in this camera is a hexagon whose edges run along the three
// projected axes, so two silhouettes overlap exactly when their extents overlap across each axis.
function silhouetteOf(box, axes) {
  const bands = [];
  for (let across = 0; across < 3; across++) {
    const normal = [-axes[across][1], axes[across][0]];
    let low = 0;
    let high = 0;
    for (let axis = 0; axis < 3; axis++) {
      if (axis === across) continue;
      const weight = axes[axis][0] * normal[0] + axes[axis][1] * normal[1];
      const first = box[axis * 2] * weight;
      const second = box[axis * 2 + 1] * weight;
      low += Math.min(first, second);
      high += Math.max(first, second);
    }
    bands.push(low, high);
  }
  return bands;
}

function silhouettesOverlap(first, second) {
  for (let band = 0; band < 6; band += 2) {
    if (first[band] >= second[band + 1] - SCREEN_GAP || second[band] >= first[band + 1] - SCREEN_GAP) return false;
  }
  return true;
}

// Every axis points towards the viewer in this camera, so a box that ends before another begins, along
// any axis, is behind it wherever the two overlap on screen.
function endsBefore(first, second) {
  return first[1] <= second[0] + TOUCH || first[3] <= second[2] + TOUCH || first[5] <= second[4] + TOUCH;
}

function crossingDeclared(first, second) {
  return first.crosses === second.piece || second.crosses === first.piece;
}

function sameShift(first, second) {
  return Math.abs(first[0] - second[0]) + Math.abs(first[1] - second[1]) + Math.abs(first[2] - second[2]) < 1e-6;
}

function orderedPair(items, boxes, shifts, first, second) {
  const moved = !sameShift(shifts[items[first].piece], shifts[items[second].piece]);
  if (!moved) return [first, second];
  const firstBehind = endsBefore(boxes[first], boxes[second]);
  const secondBehind = endsBefore(boxes[second], boxes[first]);
  // Apart along two axes the other way round, the two only overlap as boxes, not as shapes.
  if (firstBehind && secondBehind) return null;
  return secondBehind ? [second, first] : [first, second];
}

// The painter's order of the items for one set of shifts. Items keep their listed rank unless two that
// have moved relative to each other overlap on screen with one measurably behind the other.
function paintOrder(items, shifts, axes) {
  const count = items.length;
  const boxes = items.map((item) => (item.bounds ? movedBox(item.bounds, shifts[item.piece]) : null));
  const outlines = boxes.map((box) => (box ? silhouetteOf(box, axes) : null));
  const followers = items.map(() => []);
  const blockers = items.map(() => []);
  const waiting = new Array(count).fill(0);
  for (let first = 0; first < count; first++) {

// The kit's page runtime, the same for every machine. The build inlines it after the kit, the machine's
// modules and CONFIG, then the machine's live.js (which defines createMachineHooks) and a call to
// startFigure. It owns the clock, the one zoom frame and its birth, the exploded view, the badges, the
// trace and steps, the readout, the sounds, the theme and style switches and the film hooks; the machine's
// hooks own its state, its drawing and its controls. Adapted from the Edison figure's live.js and apart.js.

function startFigure(createHooks) {
  const P = CONFIG.projection;
  const EX = CONFIG.explode;
  const Motion = Kit.Motion;
  const Explode = Kit.Explode.createExplodeKit(CONFIG.explodeSpec);
  const RESUME_AFTER = 4200;
  const STILL_SECONDS = 4;
  // The zoom frame's birth, in seconds from the moment it starts (references/film.md).
  const BIRTH = { mark: 0.25, grow: 0.7, linger: 1, fade: 1.2 };
  const ZOOM_FADE_SECONDS = 0.35;
  const ZOOM_LINE_GAIN = 1.3;

  const stage = document.querySelector(".iso-stage");
  const readout = document.querySelector("[data-readout]");
  const announcer = document.querySelector("[data-announce]");
  const apartButton = document.querySelector("[data-apart]");
  const soundButton = document.querySelector("[data-sound]");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const query = new URLSearchParams(location.search);
  const manual = query.get("clock") === "manual";
  // ?tour=off keeps the machine still until the reader acts: for tests and for embedding.
  const tourAllowed = query.get("tour") !== "off";

  function setLook(theme, style) {
    if (theme) document.body.setAttribute("data-theme", theme);
    if (style) document.body.setAttribute("data-style", style);
  }
  setLook(query.get("theme"), query.get("style") ?? CONFIG.style);

  function one(name) {
    return document.querySelector(`[data-dyn="${name}"]`);
  }

  function keyed(name, attribute) {
    const found = {};
    for (const element of document.querySelectorAll(`[data-dyn="${name}"]`)) found[element.getAttribute(attribute)] = element;
    return found;
  }

  const written = new WeakMap();
  const STYLE_PROPERTIES = { glow: "--glow", hot: "--hot", weight: "--anatomy-weight" };

  function write(element, name, value) {
    if (!element) return;
    let seen = written.get(element);
    if (!seen) {
      seen = {};
      written.set(element, seen);
    }
    if (seen[name] === value) return;
    seen[name] = value;
    if (STYLE_PROPERTIES[name]) element.style.setProperty(STYLE_PROPERTIES[name], value);
    else if (name === "stroke") element.style.stroke = value;
    else if (name === "text") element.textContent = value;
    else if (value === null) element.removeAttribute(name);
    else element.setAttribute(name, value);
  }

  function setGlow(element, value) {
    write(element, "glow", String(Math.round(value * 100) / 100));
  }

  const trace = (points, closed = false) => pathOf(points.map((point) => iso(point, P)), closed);

  const parts = {
    zoom: one("zoom"),
    zoomSource: one("zoom-source"),
    zoomTies: one("zoom-ties"),
    zoomUse: one("zoom-use"),
    zoomRects: [one("zoom-clip"), one("zoom-paper"), one("zoom-edge")],
    chips: Array.from(document.querySelectorAll("[data-trace]")),
    stepItems: Array.from(document.querySelectorAll("[data-step-item]")),
    stepMarks: Array.from(document.querySelectorAll("[data-stepmark]")),
  };

  const clock = { speed: 1, touring: false, held: false, visible: manual, frame: 0, last: 0, resumeTimer: 0, elapsed: 0, tourTime: 0 };
  // `age` is seconds since the zoom frame was born (below zero: not yet); `shown` fades it for the
  // take-apart; `held` keeps it unborn, which only the film uses, for its opening seconds.
  const zoom = { age: -1, shown: 1, held: false };
  const steps = { shown: 0 };
  const explode = Explode.createExplode();
  const world = one("world");
  const lens = one("lens");
  const itemNodes = Array.from(world.children);
  const badges = Array.from(document.querySelectorAll("[data-badge]"));
  const worldZero = iso([0, 0, 0], P);
  const AXES = [[1, 0, 0], [0, 1, 0], [0, 0, 1]].map((axis) => {
    const tip = iso(axis, P);
    return [tip[0] - worldZero[0], tip[1] - worldZero[1]];
  });
  const apartState = { armed: false, painted: itemNodes.map((_, index) => index) };
  const eventLog = [];
  const FLIGHT_SECONDS = Explode.SPRING.stagger * Explode.LEAVE_ORDER.length + 0.5;
  const sound = { on: false, context: null, master: null, bus: null, noise: null };

  function say(text) {
    if (announcer) announcer.textContent = text;
  }

  const kit = { P, CONFIG, Motion, Effects: Kit.Effects, Explode, explode, clock, manual, still, one, keyed, write, setGlow, trace, emit, say, afterAction, apartBusy, run };
  const hooks = createHooks(kit);
  const disabledWhileApart = (hooks.disabledWhileApart ?? []).map((selector) => document.querySelector(selector)).filter(Boolean);

  // ---- clock and zoom --------------------------------------------------------------------------------------

  function wantsTour() {
    return clock.touring && !clock.held && !still.matches && !apartBusy() && Boolean(hooks.tour);
  }

  function stepTour(seconds) {
    if (!wantsTour() || (hooks.tourPaused && hooks.tourPaused())) return;
    const before = clock.tourTime;
    clock.tourTime += seconds;
    for (const [at, action, value] of hooks.tour.steps) {
      if (before < at && clock.tourTime >= at) hooks.actions[action](value);
    }
    if (clock.tourTime >= hooks.tour.seconds) clock.tourTime = 0;
  }

  function stepZoom(seconds) {
    if (zoom.age < 0 && !zoom.held && hooks.zoomReady()) zoom.age = still.matches ? 100 : 0;
    else if (zoom.age >= 0) zoom.age += seconds;
    const target = apartWanted() || Explode.maxShare(explode) > 0.001 ? 0 : 1;
    const reach = seconds / ZOOM_FADE_SECONDS;
    zoom.shown = Math.abs(target - zoom.shown) <= reach ? target : zoom.shown + Math.sign(target - zoom.shown) * reach;
  }

  // Plays `seconds` of the figure's clock. The machine's own clock runs at `clock.speed` times that.
  function advance(seconds) {
    clock.elapsed += seconds;
    stepTour(seconds);
    hooks.advance(seconds, clock.speed);
    stepZoom(seconds);
  }

  function busy() {
    const born = zoom.age >= 0 && zoom.age < BIRTH.mark + BIRTH.grow + BIRTH.linger + BIRTH.fade;
    return hooks.busy() || born || (zoom.shown > 0 && zoom.shown < 1);
  }

  // ---- drawing ---------------------------------------------------------------------------------------------

  function drawLevels() {
    const traceLevels = hooks.traceLevels();
    parts.chips.forEach((chip, index) => setGlow(chip, traceLevels[index] ?? 0));
    const stepLevels = hooks.stepLevels();
    parts.stepItems.forEach((item, index) => setGlow(item, stepLevels[index] ?? 0));
  }

  // The zoom frame is born from the model: a thin rectangle appears round the part, the frame grows out
  // of it to its place with four dashed lines joining the corners, and then rectangle and lines fade.
  function drawZoom(view) {
    const source = CONFIG.zoom.source;
    const frame = CONFIG.zoom.frame;
    const age = zoom.age;
    const born = age >= BIRTH.mark;
    const grown = born ? Motion.easeOutCubic((age - BIRTH.mark) / BIRTH.grow) : 0;
    const fading = 1 - Motion.smoothstep(0, BIRTH.fade, age - BIRTH.mark - BIRTH.grow - BIRTH.linger);
    const onScreen = (x, y) => [EX.width / 2 + (x - view.x) * view.zoom, EX.height / 2 + (y - view.y) * view.zoom];
    const startCentre = onScreen(source.x, source.y);
    const start = { x: startCentre[0] - (source.width * view.zoom) / 2, y: startCentre[1] - (source.height * view.zoom) / 2, width: source.width * view.zoom, height: source.height * view.zoom };
    const now = {};
    for (const name of ["x", "y", "width", "height"]) now[name] = start[name] + (frame[name] - start[name]) * grown;
    const scale = now.width / source.width;
    const corner = (frame.corner * scale) / source.scale;
    for (const rect of parts.zoomRects) {
      write(rect, "x", now.x.toFixed(1));
      write(rect, "y", now.y.toFixed(1));
      write(rect, "width", now.width.toFixed(1));
      write(rect, "height", now.height.toFixed(1));
      write(rect, "rx", corner.toFixed(1));
    }
    write(parts.zoomUse, "transform", `translate(${(now.x + now.width / 2).toFixed(2)} ${(now.y + now.height / 2).toFixed(2)}) scale(${scale.toFixed(4)}) translate(${(-source.x).toFixed(2)} ${(-source.y).toFixed(2)})`);
    const weight = parseFloat(getComputedStyle(document.body).getPropertyValue("--anatomy-weight")) || 1;
    write(parts.zoomUse, "weight", `${((weight * ZOOM_LINE_GAIN) / Math.max(1, scale)).toFixed(3)}px`);
    const ties = [[0, 0], [1, 0], [0, 1], [1, 1]].map(([right, down]) => `M${(start.x + start.width * right).toFixed(1)} ${(start.y + start.height * down).toFixed(1)}L${(now.x + now.width * right).toFixed(1)} ${(now.y + now.height * down).toFixed(1)}`);
    write(parts.zoomTies, "d", ties.join(""));
    setGlow(parts.zoomSource, age < 0 ? 0 : Motion.smoothstep(0, BIRTH.mark, age) * fading * zoom.shown);
    setGlow(parts.zoomTies, born ? Motion.smoothstep(0, 0.12, age - BIRTH.mark) * fading * zoom.shown : 0);
    setGlow(parts.zoom, born ? Motion.smoothstep(0, 0.1, age - BIRTH.mark) * zoom.shown : 0);
  }

  function draw() {
    const assembled = 1 - Math.min(1, Math.max(0, Explode.maxShare(explode)));
    hooks.draw(assembled);
    drawLevels();
    const text = apartReadout() ?? hooks.readout();
    if (readout.textContent !== text) readout.textContent = text;
    write(stage, "data-stage", hooks.stageName ? hooks.stageName() : null);
    drawApart();
  }

  // ---- the exploded view -----------------------------------------------------------------------------------

  function apartWanted() {
    return explode.apart || apartState.armed;
  }

  function apartBusy() {
    return apartState.armed || explode.apart || !Explode.isResting(explode);
  }

  function apartReadout() {
    if (apartState.armed) return hooks.armedText ?? "stopping · then apart";
    if (explode.apart) return Explode.isResting(explode) ? `apart · ${CONFIG.apartWords.many} assemblies` : "coming apart";
    if (!Explode.isResting(explode) && Explode.maxShare(explode) > 0.01) return "going back together";
    return null;
  }

  function openApart(calm) {
    apartState.armed = false;
    Explode.setApart(explode, true, calm);
    emit("apart-open", { duration: FLIGHT_SECONDS });
    if (calm) emit("apart-hold", {});
    say(`Apart in ${CONFIG.apartWords.many} numbered assemblies.`);
  }

  function closeApart(calm) {
    apartState.armed = false;
    Explode.setApart(explode, false, calm);
    emit("apart-close", { duration: FLIGHT_SECONDS });
    if (calm) emit("apart-seated", {});
    say("Going back together.");
  }

  // Arming: the machine only comes apart at rest and with the zoom frame gone, so it is stopped first.
  function setApartWanted(wanted) {
    if (wanted === apartWanted()) return;
    if (!wanted && apartState.armed) apartState.armed = false;
    else if (!wanted) closeApart(still.matches);
    else {
      hooks.prepareApart();
      if (still.matches) {
        hooks.settleStill(STILL_SECONDS);
        zoom.shown = 0;
        openApart(true);
      } else apartState.armed = true;
    }
    draw();
    run();
  }

  function toggleApart() {
    setApartWanted(!apartWanted());
  }

  function everyShare(test) {
    return Explode.LEAVE_ORDER.every((name) => test(explode.shares[name]));
  }

  function stepApart(seconds) {
    if (apartState.armed && hooks.readyToOpen() && zoom.shown < 0.01) openApart(false);
    if (Explode.isResting(explode)) return apartState.armed;
    for (const event of Explode.stepExplode(explode, seconds)) {
      emit(`piece-${event.name}`, { piece: event.piece, number: Explode.PIECES[event.piece].number }, event.at);
      const arrived = (share) => !share.pending && (share.landed || share.crossed);
      if (event.name === "arrive" && everyShare((share) => share.spring.target === 1 && arrived(share))) emit("apart-hold", {}, event.at);
      if (event.name === "land" && everyShare((share) => share.spring.target === 0 && arrived(share))) emit("apart-seated", {}, event.at);
    }
    if (Explode.isResting(explode) && !explode.apart && !manual) quietTour();
    return true;
  }

  function sameList(first, second) {
    for (let index = 0; index < first.length; index++) {
      if (first[index] !== second[index]) return false;
    }
    return true;
  }

  // Re-appends the items only when the painter's order really changed.
  function paintItems(shifts) {
    const assembled = Explode.isResting(explode) && !explode.apart;
    const order = assembled ? itemNodes.map((_, index) => index) : Explode.paintOrder(EX.items, shifts, AXES).order;
    if (sameList(order, apartState.painted)) return;
    const fragment = document.createDocumentFragment();
    for (const index of order) fragment.appendChild(itemNodes[index]);
    world.appendChild(fragment);
    apartState.painted = order;
  }

  // The view pulls back just far enough to keep the apart pose inside the card. A machine may run its own
  // camera (`hooks.camera()` gives { x, y, zoom }: the rest-frame point to centre and the magnification);
  // the apart view blends from it, and badges, step marks and the zoom birth all follow it.
  function worldView(open) {
    const centre = [EX.width / 2, EX.height / 2];
    const base = hooks.camera ? hooks.camera() : { x: centre[0], y: centre[1], zoom: 1 };
    const fit = Math.min(1, (EX.width - EX.margin.x) / EX.apart.width, (EX.height - EX.margin.y) / EX.apart.height);
    const share = Motion.smoothstep(0, 1, open);
    const apartY = EX.apart.y + EX.margin.lift / fit;
    return { x: base.x + (EX.apart.x - base.x) * share, y: base.y + (apartY - base.y) * share, zoom: base.zoom + (fit - base.zoom) * share };
  }

  function placeOnStage(node, point, view, opacity) {
    const spot = iso(point, P);
    const left = `${(((EX.width / 2 + (spot[0] - view.x) * view.zoom) / EX.width) * 100).toFixed(2)}%`;
    const top = `${(((EX.height / 2 + (spot[1] - view.y) * view.zoom) / EX.height) * 100).toFixed(2)}%`;
    if (node.style.left !== left) node.style.left = left;
    if (node.style.top !== top) node.style.top = top;
    if (node.style.opacity !== opacity) node.style.opacity = opacity;
  }

  function placeBadges(shifts, view) {
    for (const badge of badges) {
      const name = badge.getAttribute("data-badge");
      const anchor = EX.anchors[name];
      const shift = shifts[name];
      const share = Explode.isFixed(name) ? Explode.maxShare(explode) : Explode.shareOf(explode, name);
      placeOnStage(badge, [anchor[0] + shift[0], anchor[1] + shift[1], anchor[2] + shift[2]], view, Motion.smoothstep(0.5, 0.95, share).toFixed(2));
    }
  }

  function placeStepMarks(view, open) {
    if (!parts.stepMarks.length) return;
    const levels = hooks.stepLevels();
    parts.stepMarks.forEach((mark, index) => placeOnStage(mark, CONFIG.stepPoints[index], view, ((levels[index] ?? 0) * steps.shown * (1 - open)).toFixed(2)));
  }

  function drawApart() {
    const shifts = Explode.shiftsOf(explode);
    const open = Math.min(1, Math.max(0, Explode.maxShare(explode)));
    itemNodes.forEach((node, index) => {
      const shift = shifts[EX.items[index].piece];
      const moved = Math.abs(shift[0]) + Math.abs(shift[1]) + Math.abs(shift[2]) > 1e-6;
      write(node, "transform", moved ? translateAlong(P, shift) : null);
    });
    paintItems(shifts);
    const view = worldView(open);
    const centredAtRest = view.zoom === 1 && view.x === EX.width / 2 && view.y === EX.height / 2;
    const centred = `translate(${EX.width / 2} ${EX.height / 2}) scale(${view.zoom.toFixed(4)}) translate(${(-view.x).toFixed(2)} ${(-view.y).toFixed(2)})`;
    write(lens, "transform", centredAtRest ? null : centred);
    placeBadges(shifts, view);
    placeStepMarks(view, open);
    drawZoom(view);
    const legend = Motion.smoothstep(0.55, 0.95, Explode.leastShare(explode)).toFixed(2);
    if (document.body.style.getPropertyValue("--ma-apart") !== legend) document.body.style.setProperty("--ma-apart", legend);
    write(stage, "data-open", open > 0.005 ? "" : null);
    write(apartButton, "aria-pressed", String(apartWanted()));
    write(apartButton, "text", apartWanted() ? "Put together" : "Take apart");
    for (const button of disabledWhileApart) write(button, "disabled", apartBusy() ? "" : null);
  }

  // ---- sound -----------------------------------------------------------------------------------------------
  // The figure reports what happens as named events with a time on its own clock. The page plays them
  // through Web Audio when the reader turns sound on; the recorder takes the log and renders the film's
  // track offline (kit/sound.mjs) with the same voices.

  const MASTER_GAIN = 0.16;
  const HIGH_PASS = 110;
  const LOW_PASS = 3500;
  const MODE_GAIN = 3;
  const TAP_SECONDS = 0.07;
  const SWELL_LOW_PASS = 650;
  const decibels = (value) => 10 ** (value / 20);

  function emit(name, detail, at = null) {
    if (manual) eventLog.push({ name, at: Math.round((at ?? clock.elapsed) * 10000) / 10000, ...detail });
    if (sound.on && sound.context) playVoice(name, detail);
  }

  function audioReady() {
    if (sound.context) return sound.context;
    const context = new AudioContext();
    const buffer = context.createBuffer(1, context.sampleRate * 2, context.sampleRate);
    const samples = buffer.getChannelData(0);
    for (let index = 0; index < samples.length; index++) samples[index] = Math.random() * 2 - 1;
    sound.context = context;
    sound.noise = buffer;
    sound.master = context.createGain();
    sound.master.gain.value = MASTER_GAIN;
    sound.master.connect(context.destination);
    const dull = context.createBiquadFilter();
    dull.type = "lowpass";
    dull.frequency.value = LOW_PASS;
    dull.Q.value = 0.5;
    dull.connect(sound.master);
    sound.bus = context.createBiquadFilter();
    sound.bus.type = "highpass";
    sound.bus.frequency.value = HIGH_PASS;
    sound.bus.Q.value = 0.5;
    sound.bus.connect(dull);
    return context;
  }

  function variationOf() {
    const spread = () => Math.random() * 2 - 1;
    return { pitch: 1 + spread() * 0.07, level: decibels(spread() * 2), late: Math.random() * 0.004 };
  }

  // One tap: the noise of the blow fades in over a few milliseconds and dies away through two low-Q
  // resonances that are silent again within about 35 ms.
  function tap(body, level) {
    const context = sound.context;
    const variation = variationOf();
    const start = context.currentTime + variation.late;
    const source = context.createBufferSource();
    const blow = context.createGain();
    source.buffer = sound.noise;
    source.loop = true;
    blow.gain.setValueAtTime(0, start);
    blow.gain.linearRampToValueAtTime(1, start + body.attack);
    blow.gain.setTargetAtTime(0, start + body.attack, body.blow);
    source.connect(blow);
    for (const [frequency, ringTime, share] of body.modes) {
      const mode = context.createBiquadFilter();
      const out = context.createGain();
      mode.type = "bandpass";
      mode.frequency.value = frequency * variation.pitch;
      mode.Q.value = Math.max(1, Math.PI * frequency * ringTime);
      out.gain.value = share * level * variation.level * MODE_GAIN;
      blow.connect(mode).connect(out).connect(sound.bus);
    }
    source.start(start, Math.random() * 0.5);
    source.stop(start + TAP_SECONDS);
  }

  function swell(level, detail) {
    const context = sound.context;
    const start = context.currentTime;
    const duration = detail.duration ?? 1;
    const source = context.createBufferSource();
    const dull = context.createBiquadFilter();
    const gain = context.createGain();
    source.buffer = sound.noise;
    source.loop = true;
    dull.type = "lowpass";
    dull.frequency.value = SWELL_LOW_PASS;
    dull.Q.value = 0.5;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(level * (detail.level ?? 1), start + duration * 0.45);
    gain.gain.linearRampToValueAtTime(0, start + duration);
    source.connect(dull).connect(gain).connect(sound.bus);
    source.start(start, Math.random());
    source.stop(start + duration + 0.05);
  }

  function playVoice(name, detail) {
    const voice = CONFIG.sound.voices[name];
    if (!voice) return;
    const level = decibels(voice.level ?? 0);
    if (voice.swell) swell(level, detail);
    else tap(CONFIG.sound.bodies[voice.tap], level);
  }

  function toggleSound() {
    sound.on = !sound.on;
    if (sound.on) audioReady().resume();
    soundButton.setAttribute("aria-pressed", String(sound.on));
    soundButton.textContent = sound.on ? "Sound on" : "Sound";
  }

  // ---- loop, pointer, keyboard -----------------------------------------------------------------------------

  function tick(now) {
    const dt = clock.last ? Math.min((now - clock.last) / 1000, 1 / 30) : 1 / 60;
    clock.last = now;
    const flying = stepApart(dt);
    if (!still.matches) advance(dt);
    draw();
    const active = flying || (!still.matches && (busy() || wantsTour()));
    clock.frame = clock.visible && active ? requestAnimationFrame(tick) : 0;
  }

  function run() {
    if (manual || clock.frame || !clock.visible) return;
    clock.last = 0;
    clock.frame = requestAnimationFrame(tick);
  }

  function quietTour() {
    clock.touring = false;
    clearTimeout(clock.resumeTimer);
    if (manual) return;
    clock.resumeTimer = setTimeout(() => {
      clock.touring = tourAllowed && !still.matches;
      clock.tourTime = hooks.tourResumeAt ? hooks.tourResumeAt() : 0;
      run();
    }, RESUME_AFTER);
  }

  // Reduced motion: no travel; the machine jumps to where it settles.
  function afterAction() {
    quietTour();
    if (still.matches) {
      hooks.settleStill(STILL_SECONDS);
      stepZoom(0);
    }
    draw();
    run();
  }

  function hold(value) {
    clock.held = value;
    if (!value) quietTour();
    run();
  }

  function onKey(event) {
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.shiftKey && event.key.toUpperCase() === "E") {
      event.preventDefault();
      toggleApart();
      return;
    }
    const keyName = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    const action = (hooks.keys ?? {})[keyName];
    if (!action) return;
    event.preventDefault();
    action();
  }

  if (!manual) {
    stage.addEventListener("pointerenter", () => hold(true));
    stage.addEventListener("pointerleave", () => hold(false));
    stage.addEventListener("focusin", () => hold(true));
    stage.addEventListener("focusout", () => hold(false));
    if (hooks.onStageClick) stage.addEventListener("click", hooks.onStageClick);
    stage.addEventListener("keydown", onKey);
    apartButton.addEventListener("click", toggleApart);
    soundButton.addEventListener("click", toggleSound);
    if (hooks.wire) hooks.wire();
    new IntersectionObserver(
      (entries) => {
        clock.visible = entries[entries.length - 1].isIntersecting;
        if (clock.visible) run();
      },
      { rootMargin: "120px 0px" },
    ).observe(stage);
    still.addEventListener("change", () => {
      clock.touring = tourAllowed && !still.matches;
      draw();
      run();
    });
  }

  clock.touring = !manual && tourAllowed && !still.matches;
  if (query.get("apart") === "1") {
    zoom.shown = 0;
    Explode.setApart(explode, true, true);
  }
  draw();

  // A deterministic clock for frame-by-frame capture: open the page with ?clock=manual and drive it from
  // here. Every call advances the figure's own clock, so the event log carries exact film times.
  const kitActions = {
    holdZoom(held) {
      zoom.held = held;
    },
    setSpeed(speed) {
      clock.speed = speed;
    },
    setApart(apart) {
      explode.time = clock.elapsed;
      setApartWanted(apart);
    },
    steps(opacity) {
      steps.shown = opacity;
      document.body.style.setProperty("--ma-steps", String(opacity));
    },
  };

  window.__anatomy = {
    pieces: CONFIG.explodeSpec.pieces,
    advance(seconds) {
      explode.time = clock.elapsed;
      stepApart(seconds);
      advance(seconds);
      draw();
    },
    act(name, value) {
      const action = kitActions[name] ?? hooks.actions[name];
      if (!action) throw new Error(`no action "${name}"`);
      action(value);
    },
    look(theme, style) {
      setLook(theme, style);
    },
    project(point) {
      return iso(point, P);
    },
    takeEvents() {
      return eventLog.splice(0);
    },
    state() {
      const round = (value) => Math.round(value * 10000) / 10000;
      return {
        ...hooks.snapshot(),
        working: hooks.working(),
        zoomAge: round(zoom.age),
        zoomShown: round(zoom.shown),
        apart: explode.apart,
        open: round(Explode.maxShare(explode)),
        resting: Explode.isResting(explode),
        time: round(clock.elapsed),
        readout: readout.textContent,
      };
    },
  };
}

// Falcon 9's live hooks. The kit runtime owns the clock, zoom frame, exploded view, trace, steps, readout,
// sound and film hooks; this file owns the flight: the model's state, the camera, the carriers that fly
// the booster, the second stage, the fairing halves and the scenery, the flames (kit effect), the exhaust
// cloud and glows, the strongback, legs, grid fins and nitrogen puffs.
//
// Camera (kit hook `camera`): it frames the subject inside the part of the frame no text uses: the whole
// pad complex on the pad, the rocket during the climb, both stages after separation, booster and deck at
// the landing. It rolls with the rocket only while the rocket is apart, so the rocket stands upright and
// comes apart along its own axis. Distances to the pad and droneship are squeezed (fact film-compression).

function createMachineHooks(kit) {
  const Falcon = Modules["model.mjs"].FalconApi;
  const Layout = Modules["layout.mjs"].createLayout();
  const SIZES = Layout.sizes;
  const { write, setGlow, trace, emit, say, Motion, Effects } = kit;
  const SQUEEZE_METRES = 140;
  const SHIP_SQUEEZE_METRES = 26;
  const UPPER_SQUEEZE_METRES = 24;
  const LEAD_METRES = 7;
  const RUMBLE_EVERY = 1;
  const RUMBLE_SECONDS = 0.9;
  const MOST_ZOOM = 2.3;
  // Flying alone the booster keeps a margin round it, so its flame and fins stay in frame.
  const ALONE_ZOOM = 1.6;
  const PIVOT = [0, 0, 1.5];
  const ACROSS = [Math.SQRT1_2, -Math.SQRT1_2, 0];
  const TOUR = [[0.4, "launch"]];
  const FILM = Boolean(kit.CONFIG.film);
  const EX = kit.CONFIG.explode;
  // The part of the frame the camera may fill: clear of the step list, the zoom frame and the trace strip.
  const SAFE = FILM ? { left: 560, right: 1360, top: 130, bottom: 900 } : { left: 30, right: 400, top: 70, bottom: 540 };

  const launchButton = document.querySelector("[data-launch]");
  const carriers = {};
  for (const name of ["booster", "upper", "fairingLeft", "fairingRight", "pad", "ship"]) carriers[name] = Array.from(document.querySelectorAll(`[data-carry="${name}"]`));
  const flames = kit.keyed("plume", "data-index");
  const vacuumFlame = kit.one("vacuum-plume");
  const clusterFlame = kit.one("cluster-plume");
  const CLUSTER_RADIUS = SIZES.engines.ring + SIZES.engines.exit;
  const legs = kit.keyed("leg", "data-index");
  const legSides = kit.keyed("leg-side", "data-index");
  const struts = kit.keyed("strut", "data-index");
  const fins = kit.keyed("fin", "data-index");
  const puffs = Array.from(document.querySelectorAll('[data-dyn="puff"]'));
  const erector = kit.one("erector");
  const erectorLattice = kit.one("erector-lattice");
  const erectorArms = kit.one("erector-arms");
  const clampJaws = kit.one("clamp-jaws");
  const smoke = kit.keyed("smoke", "data-index");
  const padGlow = kit.one("pad-glow");
  const deckGlow = kit.one("deck-glow");

  const planned = Falcon.plannedLanding();
  const roll = Motion.createSpring({ ...Motion.springFor(0.8, 1), value: 0 });
  const pivot = iso(PIVOT, kit.P);
  const metre = Math.hypot(...[0, 1].map((index) => iso([0, 0, 1], kit.P)[index] - iso([0, 0, 0], kit.P)[index]));
  const view = { springs: null };
  let flight = Falcon.createFlight();
  let running = false;
  let playback = 1;
  let clockSpeed = 1;
  let rumbleClock = 0;

  const PHASE_SAY = {
    ignition: "Nine engines starting; the rocket is held down.",
    liftoff: "Released: liftoff.",
    "max-q": "Max Q: the engines throttle down.",
    meco: "Main engine cutoff.",
    separation: "Stage separation.",
    flip: "The booster flips round on its nitrogen thrusters.",
    boostback: "Boostback burn.",
    "entry-burn": "Entry burn.",
    "landing-burn": "Landing burn on one engine.",
    landed: "Touchdown on the droneship.",
  };

  function flightEvent(event) {
    emit(event.name, {});
    if (event.phase && PHASE_SAY[event.phase]) say(PHASE_SAY[event.phase]);
  }

  function rumble(seconds) {
    const share = (flight.booster.engines * Falcon.throttleShare(flight)) / Falcon.ENGINE_COUNT;
    rumbleClock += seconds;
    if (rumbleClock < RUMBLE_EVERY) return;
    rumbleClock = 0;
    if (share > 0.03 && flight.phase !== "landed") emit("rumble", { level: Math.min(1, 0.25 + share), duration: RUMBLE_SECONDS });
  }

  function advance(seconds, speed) {
    Motion.setSpringTarget(roll, kit.apartBusy() ? 1 : 0);
    Motion.stepSpring(roll, seconds);
    stepCamera(seconds);
    clockSpeed = speed;
    if (!running) return;
    playback = Falcon.easePlayback(playback, Falcon.playbackRate(flight), seconds);
    for (const event of Falcon.step(flight, seconds * speed * playback, planned.aim)) flightEvent(event);
    rumble(seconds);
  }

  function busy() {
    return running || !roll.settled;
  }

  // ---- where the carriers sit ---------------------------------------------------------------------------

  function squeeze(metres, scale) {
    return (metres * scale) / (scale + Math.abs(metres));
  }

  function degrees(radians) {
    return (radians * 180) / Math.PI;
  }

  function leadMetres() {
    return Math.min(Math.max(0, flight.booster.h), LEAD_METRES) * (1 - Falcon.smooth(1.5, 4, flight.time));
  }

  function rotated([x, y], angle, about) {
    const turn = (angle * Math.PI) / 180;
    const dx = x - about[0];
    const dy = y - about[1];
    return [about[0] + dx * Math.cos(turn) - dy * Math.sin(turn), about[1] + dx * Math.sin(turn) + dy * Math.cos(turn)];
  }

  // Every carrier as an angle about the pivot and a shift, so points can be placed for the camera too.
  function poses() {
    const booster = flight.booster;
    const upper = flight.upper;
    const cameraRoll = degrees(booster.pitch) * roll.value;
    const lead = leadMetres() * metre;
    const height = booster.h - leadMetres();
    const scenery = (downrange, upScale = SQUEEZE_METRES) => ({ angle: -cameraRoll, shift: [squeeze(downrange, SQUEEZE_METRES) * metre, squeeze(height, upScale) * metre] });
    const boosterPose = { angle: degrees(booster.pitch) - cameraRoll, shift: [0, -lead] };
    const leaving = 90 * Falcon.smooth(Falcon.TIMES.fairing + 6, Falcon.TIMES.fairing + 40, flight.time);
    const upperAngle = flight.joined ? boosterPose.angle : degrees(upper.pitch) - cameraRoll;
    const upperOffset = flight.joined ? 0 : (squeeze(upper.apart, UPPER_SQUEEZE_METRES) + leaving) * metre;
    return { booster: boosterPose, upper: { angle: upperAngle, shift: [0, -lead], offset: upperOffset }, pad: scenery(-booster.x), ship: scenery(planned.x - booster.x, SHIP_SQUEEZE_METRES) };
  }

  function rotateAbout(angle, point) {
    return `rotate(${angle.toFixed(3)} ${point[0].toFixed(2)} ${point[1].toFixed(2)})`;
  }

  function transformOf(pose, scenery = false) {
    const offset = pose.offset ? ` translate(0 ${(-pose.offset).toFixed(2)})` : "";
    return scenery ? `${rotateAbout(pose.angle, pivot)} translate(${pose.shift[0].toFixed(2)} ${pose.shift[1].toFixed(2)})` : `translate(${pose.shift[0].toFixed(2)} ${pose.shift[1].toFixed(2)}) ${rotateAbout(pose.angle, pivot)}${offset}`;
  }

  // A rest-frame point of a carrier, placed where the carrier's transform puts it on screen.
  function placed(point, pose, scenery = false) {
    const flat = iso(point, kit.P);
    if (scenery) return rotated([flat[0] + pose.shift[0], flat[1] + pose.shift[1]], pose.angle, pivot);
    const lifted = [flat[0], flat[1] - (pose.offset ?? 0)];
    const turned = rotated(lifted, pose.angle, pivot);
    return [turned[0] + pose.shift[0], turned[1] + pose.shift[1]];
  }

  function place(name, transform, opacity = null) {
    for (const node of carriers[name]) {
      write(node, "transform", transform);
      write(node, "opacity", opacity);
    }
  }

  function shipShown() {
    // The ship fades in once the camera already frames it, so it never crosses the text band.
    return flight.joined ? 0 : 1 - Falcon.smooth(700, 1100, flight.booster.h);
  }

  function placeFairing(upperTransform) {
    const seconds = flight.upper.fairingOpen;
    const drift = squeeze(seconds * 3, 16) * metre;
    const fall = squeeze(seconds * seconds * 0.8, 22) * metre;
    const tip = Math.min(40, seconds * 12);
    const base = iso([0, 0, SIZES.fairing.z0], kit.P);
    const fade = seconds > 0 ? (1 - Falcon.smooth(4, 7, seconds)).toFixed(2) : null;
    place("fairingLeft", `${upperTransform} translate(${(-drift).toFixed(2)} ${fall.toFixed(2)}) ${rotateAbout(-tip, base)}`, fade);
    place("fairingRight", `${upperTransform} translate(${drift.toFixed(2)} ${fall.toFixed(2)}) ${rotateAbout(tip, base)}`, fade);
  }

  function placeCarriers() {
    const pose = poses();
    place("booster", transformOf(pose.booster));
    const upper = transformOf(pose.upper);
    const upperShown = 1 - Falcon.smooth(Falcon.TIMES.fairing + 8, Falcon.TIMES.fairing + 30, flight.time);
    place("upper", upper, upperShown < 0.999 ? upperShown.toFixed(2) : null);
    placeFairing(upper);
    // The pad fades as the rocket climbs away from it, before it would pass under the text band.
    const padShown = flight.joined ? 1 - Falcon.smooth(20, 70, flight.booster.h) : 0;
    place("pad", transformOf(pose.pad, true), padShown < 0.999 ? padShown.toFixed(2) : null);
    const shown = shipShown();
    place("ship", transformOf(pose.ship, true), shown < 0.999 ? shown.toFixed(2) : null);
  }

  // ---- the camera ---------------------------------------------------------------------------------------

  function subjectPoints() {
    const pose = poses();
    const points = [placed(PIVOT, pose.booster), placed([0, 0, flight.joined ? SIZES.fairing.tip : SIZES.interstage.z1], pose.booster)];
    if (!flight.joined && flight.time < Falcon.TIMES.fairing + 7) points.push(placed([0, 0, SIZES.mvac.exitZ], pose.upper), placed([0, 0, SIZES.fairing.tip], pose.upper));
    if (flight.joined && flight.booster.h < 40) {
      const T = SIZES.pad.towers;
      const A = SIZES.pad.half;
      for (const [across, depth] of T.places) points.push(placed([...Layout.site(across, depth), T.mastTop], pose.pad, true));
      for (const [across, depth] of T.places) points.push(placed([...Layout.site(across, depth), SIZES.pad.z1], pose.pad, true));
      points.push(placed([A, A, SIZES.pad.z0], pose.pad, true));
    }
    if (!flight.joined && flight.booster.h < 1600) {
      const H = SIZES.ship;
      for (const [x, y] of [[-H.seaHalf, H.seaHalf], [H.seaHalf, -H.seaHalf], [H.seaHalf, H.seaHalf]]) points.push(placed([x, y, H.sea], pose.ship, true));
    }
    return points;
  }

  function cameraTarget() {
    const points = subjectPoints();
    const xs = points.map((point) => point[0]);
    const ys = points.map((point) => point[1]);
    const wide = Math.max(40, Math.max(...xs) - Math.min(...xs));
    const tall = Math.max(40, Math.max(...ys) - Math.min(...ys));
    const bothStages = !flight.joined && flight.time < Falcon.TIMES.fairing + 7;
    const shipFramed = !flight.joined && flight.booster.h < 1600;
    const least = flight.booster.h > 100 && !bothStages && !shipFramed ? 1 : 0.4;
    const most = flight.joined ? MOST_ZOOM : ALONE_ZOOM;
    const zoom = Math.max(least, Math.min(most, (SAFE.right - SAFE.left) / wide, (SAFE.bottom - SAFE.top) / tall));
    const centre = [(Math.max(...xs) + Math.min(...xs)) / 2, (Math.max(...ys) + Math.min(...ys)) / 2];
    const goal = [(SAFE.left + SAFE.right) / 2, (SAFE.top + SAFE.bottom) / 2];
    return { x: centre[0] - (goal[0] - EX.width / 2) / zoom, y: centre[1] - (goal[1] - EX.height / 2) / zoom, zoom };
  }

  function stepCamera(seconds) {
    const target = cameraTarget();
    if (!view.springs) {
      view.springs = {};
      for (const name of ["x", "y", "zoom"]) view.springs[name] = Motion.createSpring({ ...Motion.springFor(0.7, 1), value: target[name] });
    }
    for (const name of ["x", "y", "zoom"]) {
      Motion.setSpringTarget(view.springs[name], target[name]);
      Motion.stepSpring(view.springs[name], seconds);
    }
  }

  function camera() {
    if (!view.springs) stepCamera(0);
    return { x: view.springs.x.value, y: view.springs.y.value, zoom: view.springs.zoom.value };
  }

  // ---- flames, cloud, glows -----------------------------------------------------------------------------

  function local(centre) {
    return ([across, along]) => [centre[0] + ACROSS[0] * across, centre[1] + ACROSS[1] * across, centre[2] - along];
  }

  function writeFlame(group, shapes, centre) {
    const [halo, body, splash, core, ...diamonds] = group.children;
    const toWorld = local(centre);
    write(halo, "d", trace(shapes.halo.map(toWorld), true));
    write(halo, "opacity", shapes.haloOpacity.toFixed(2));
    write(body, "d", trace(shapes.body.map(toWorld), true));
    write(splash, "d", shapes.splash ? trace(shapes.splash.map(toWorld), true) : "");
    write(core, "d", trace(shapes.core.map(toWorld), true));
    write(core, "opacity", shapes.coreOpacity.toFixed(2));
    diamonds.forEach((node, index) => {
      const diamond = shapes.diamonds[index];
      write(node, "d", diamond ? trace(diamond.points.map(toWorld), true) : "");
      write(node, "opacity", diamond ? diamond.opacity.toFixed(2) : "0");
    });
  }

  function groundBelow() {
    const booster = flight.booster;
    if (Math.abs(booster.pitch) > 0.3) return Infinity;
    if (flight.joined && booster.h < 60) return booster.h - SIZES.pad.z1;
    if (!flight.joined && booster.h < 80) return booster.h - SIZES.ship.deck;
    return Infinity;
  }

  // The kit plume per burning engine: throttle and thin air from the model (effects.mjs). While apart the
  // flames fade back so the numbered parts read.
  function drawFlames(assembled) {
    const booster = flight.booster;
    const throttle = Falcon.throttleShare(flight);
    const thin = 1 - Falcon.densityAt(booster.h) / Falcon.densityAt(0);
    const burning = new Set(Layout.burningEngines(booster.engines));
    const ground = groundBelow();
    drawCluster(assembled, throttle, thin, ground);
    Layout.enginePlaces().forEach((place, index) => {
      const group = flames[index];
      const on = burning.has(index) && throttle > 0.02;
      write(group, "opacity", on ? ((0.3 + 0.7 * assembled) * Math.min(1, throttle * 1.4)).toFixed(2) : "0");
      if (!on) return;
      const shapes = Effects.plume({ throttle, thin, exitRadius: SIZES.engines.exit, length: booster.engines === 1 ? 11 : 15, spread: 1.15, ground, time: flight.time, seed: index + 1, diamonds: 4 });
      writeFlame(group, shapes, [place[0], place[1], 0]);
    });
    const upper = flight.upper;
    const vacuumOn = upper.burning && flight.time < Falcon.TIMES.fairing + 36;
    write(vacuumFlame, "opacity", vacuumOn ? "0.9" : "0");
    if (vacuumOn) writeFlame(vacuumFlame, Effects.plume({ throttle: 1, thin: 1, exitRadius: SIZES.mvac.exit, length: 9, spread: 3.2, time: flight.time, seed: 11 }), [0, 0, SIZES.mvac.exitZ]);
    drawGlows(throttle, booster);
  }

  // All nine together make one plume with shock diamonds the size of the engine cluster (plume-drawing).
  function drawCluster(assembled, throttle, thin, ground) {
    const on = flight.booster.engines >= 9 && throttle > 0.02;
    write(clusterFlame, "opacity", on ? ((0.3 + 0.7 * assembled) * Math.min(1, throttle * 1.4)).toFixed(2) : "0");
    if (!on) return;
    const shapes = Effects.plume({ throttle, thin, exitRadius: CLUSTER_RADIUS, length: 30, spread: 3.4, ground, time: flight.time, seed: 21, diamonds: 6 });
    writeFlame(clusterFlame, shapes, [0, 0, 0]);
  }

  function drawGlows(throttle, booster) {
    const padPower = (booster.engines * throttle) / Falcon.ENGINE_COUNT;
    const padLight = flight.joined ? Effects.glow({ power: padPower, distance: booster.h, reach: 30 }) : 0;
    write(padGlow, "rx", (16 * metre).toFixed(1));
    write(padGlow, "ry", (8 * metre).toFixed(1));
    write(padGlow, "opacity", (0.5 * padLight).toFixed(2));
    const deckLight = flight.phase === "landing-burn" ? Effects.glow({ power: throttle, distance: booster.h, reach: 22 }) : 0;
    write(deckGlow, "rx", (9 * metre).toFixed(1));
    write(deckGlow, "ry", (4.5 * metre).toFixed(1));
    write(deckGlow, "opacity", (0.55 * deckLight).toFixed(2));
  }

  // The exhaust cloud: it billows out of the flame trench from engine start and thins out over the climb.
  function drawSmoke() {
    const age = flight.time - Falcon.TIMES.engineStart;
    const clouds = age > 0 ? Effects.puffs({ age, count: 16, spread: 24, rise: 10, size: 6.5, life: 16, seed: 4 }) : [];
    for (let index = 0; index < 16; index++) {
      const node = smoke[index];
      const puff = clouds[index];
      if (!puff) {
        write(node, "opacity", "0");
        continue;
      }
      const [across, up, radius, opacity] = puff;
      const centre = iso([across * 0.5, 15 + across * 0.7, SIZES.pad.z1 + up], kit.P);
      write(node, "cx", centre[0].toFixed(1));
      write(node, "cy", centre[1].toFixed(1));
      write(node, "r", (radius * metre).toFixed(1));
      write(node, "opacity", (0.85 * opacity).toFixed(2));
    }
  }

  // ---- strongback, legs, fins, puffs --------------------------------------------------------------------

  function writeSolid(group, corners, extraLines = "") {
    const outline = trace(corners, true);
    const [fill, shade, edge] = group.children;
    write(fill, "d", outline);
    write(shade, "d", outline);
    write(edge, "d", outline + extraLines);
  }

  // The erector tilts back just before launch (guide-strongback), over the last seconds of the count.
  function drawErector() {
    const share = Falcon.smooth(-2.1, -0.8, flight.time);
    const frame = Layout.erectorFrame(share);
    const front = frame.depth;
    const back = -frame.depth;
    const face = [frame.point(0, front, 0), frame.point(frame.width, front, 0), frame.point(frame.width, front, frame.height), frame.point(0, front, frame.height)];
    writeSolid(erector, face);
    write(erectorLattice, "d", erectorLines(frame, front, back));
    write(erectorArms, "d", armLines(frame, front, back));
  }

  function erectorLines(frame, front, back) {
    const E = SIZES.pad.erector;
    let lines = "";
    for (let up = 0; up < frame.height - 3; up += 4) {
      lines += trace([frame.point(0, front, up), frame.point(frame.width, front, up + 4)]);
      lines += trace([frame.point(frame.width, front, up), frame.point(0, front, up + 4)]);
    }
    for (const offset of [0, frame.width]) lines += trace([frame.point(offset, back, 0), frame.point(offset, back, frame.height)]);
    for (const depth of [front, back]) {
      const [x, y] = Layout.site(E.across + E.ram.to, depth);
      lines += trace([[x, y, SIZES.pad.z1], frame.point(frame.width, depth, E.ram.from)]);
    }
    return lines;
  }

  // The arms that hold the stack: from the beam's inner chord to a clamp pad on the rocket's skin; they
  // ride with the beam, so they leave the rocket as it tilts back (photo-erector).
  function armLines(frame, front, back) {
    const E = SIZES.pad.erector;
    const reach = SIZES.radius + 0.05 - E.across;
    let lines = "";
    for (const up of E.arms) {
      lines += trace([frame.point(0, front, up), frame.point(reach, front * 0.45, up), frame.point(reach, back * 0.45, up), frame.point(0, back, up)]);
      lines += trace([frame.point(reach, front * 0.45, up - 0.8), frame.point(reach, front * 0.45, up + 0.8)]);
    }
    return lines;
  }

  function lattice(corners) {
    let lines = "";
    for (const share of [0.25, 0.5, 0.75]) {
      lines += trace([Layout.lerp3(corners[0], corners[1], share), Layout.lerp3(corners[3], corners[2], share)]);
      lines += trace([Layout.lerp3(corners[0], corners[3], share), Layout.lerp3(corners[1], corners[2], share)]);
    }
    return lines;
  }

  function drawHinged() {
    SIZES.legs.angles.forEach((angle, index) => {
      writeSolid(legs[index], Layout.legCorners(angle, flight.legs.value));
      const leg = Layout.legSide(angle, flight.legs.value);
      writeSolid(legSides[index], leg.side);
      write(struts[index], "d", flight.legs.value > 0.05 ? trace(leg.strut) : "");
    });
    SIZES.fins.angles.forEach((angle, index) => {
      const corners = Layout.finCorners(angle, flight.fins.value);
      writeSolid(fins[index], corners, lattice(corners));
    });
    const turning = thrustersFiring();
    const flutter = 0.6 + 0.4 * Math.abs(Math.sin(flight.time * 9));
    for (const puff of puffs) setGlow(puff, turning ? flutter : 0);
  }

// The nitrogen thrusters fire whenever they are turning the booster or stopping a turn (turnCause).
  function thrustersFiring() {
    const attitude = flight.booster.attitude;
    const working = Math.abs(attitude.target - attitude.value) > 0.01 || Math.abs(attitude.velocity) > 0.005;
    return working && Falcon.turnCause(flight) === "nitrogen thrusters";
  }

  // The four hold-down clamps grip the engine section until T-0, then swing open (guide-clamps).
  function drawClamps() {
    const open = Falcon.smooth(-0.1, 0.5, flight.time);
    const S = SIZES.pad;
    let lines = "";
    for (const [sideX, sideY] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      const out = [sideX * Math.SQRT1_2, sideY * Math.SQRT1_2];
      const base = SIZES.radius + 0.6;
      const reach = SIZES.radius - 0.1 + 1.4 * open;
      const tipZ = 2.2 - 0.6 * open;
      lines += trace([[out[0] * base, out[1] * base, S.clampTop], [out[0] * reach, out[1] * reach, tipZ]]);
    }
    write(clampJaws, "d", lines);
  }

  // What acts on the booster's turn now, as drawn: the thrusters count only while their puffs show.
  function turnCauseShown() {
    const cause = Falcon.turnCause(flight);
    if (cause !== "nitrogen thrusters") return cause;
    return thrustersFiring() ? cause : "none";
  }

  function draw(assembled) {
    placeCarriers();
    drawFlames(assembled);
    drawSmoke();
    drawErector();
    drawClamps();
    drawHinged();
    write(launchButton, "text", running ? "Launch again" : "Launch");
  }

  function settleStill(seconds) {
    if (!running) return;
    Falcon.step(flight, seconds * Math.max(1, Falcon.playbackRate(flight)), planned.aim);
  }

  function launch() {
    flight = Falcon.createFlight();
    running = true;
    playback = 1;
    rumbleClock = 0;
    say("Countdown: engines start at T-3 seconds.");
  }

  function relaunch() {
    if (kit.apartBusy()) return;
    launch();
    kit.afterAction();
  }

  return {
    advance,
    draw,
    busy,
    camera,
    readout: () => Falcon.readoutOf(flight, running ? clockSpeed * playback : 1),
    settleStill,
    actions: { launch, start: launch, stop: () => (running = false) },
    wire: () => launchButton.addEventListener("click", relaunch),
    onStageClick: relaunch,
    keys: { Enter: relaunch, " ": relaunch },
    tour: { steps: TOUR, seconds: 38 },
    tourPaused: () => false,
    tourResumeAt: () => 0,
    disabledWhileApart: ["[data-launch]"],
    armedText: "rolling the camera upright · then apart",
    zoomReady: () => flight.time > 0.6 && leadMetres() < 0.3,
    stepLevels: () => Falcon.stepLevels(flight),
    traceLevels: () => Falcon.traceLevels(flight),
    // Apart needs the whole stack: once the stages have split, the page shows a fresh rocket on the pad.
    prepareApart: () => {
      if (flight.joined) return;
      flight = Falcon.createFlight();
      running = false;
    },
    readyToOpen: () => roll.value > 0.985,
    stageName: () => flight.phase,
    working: () => flight.phase !== "pad",
    snapshot() {
      const round = (value) => Math.round(value * 1000) / 1000;
      const booster = flight.booster;
      return {
        phase: flight.phase,
        missionTime: round(flight.time),
        height: round(booster.h),
        downrange: round(booster.x),
        pitch: round(booster.pitch),
        engines: booster.engines,
        throttle: round(Falcon.throttleShare(flight)),
        legs: round(flight.legs.value),
        fins: round(flight.fins.value),
        turnCause: turnCauseShown(),
        thrusters: thrustersFiring() ? 1 : 0,
        clampsOpen: round(Falcon.smooth(-0.1, 0.5, flight.time)),
        erector: round(Falcon.smooth(-2.1, -0.8, flight.time)),
        fairingOpen: round(flight.upper.fairingOpen),
        upperBurning: flight.upper.burning ? 1 : 0,
        upperApart: round(flight.upper.apart),
        roll: round(roll.value),
        cameraZoom: round(camera().zoom),
        playback: round(playback),
        touchdownSpeed: flight.touchdownSpeed === undefined ? null : round(flight.touchdownSpeed),
        missFromShip: round(booster.x - planned.x),
      };
    },
  };
}

startFigure(createMachineHooks);
</script></body></html>
