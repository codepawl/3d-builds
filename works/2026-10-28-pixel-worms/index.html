<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="A free swarm game in the browser. Start as one worm, eat everything, survive." />
  <meta name="theme-color" content="#2a080c" />
  <title>Pixel Worms</title>
  <link rel="icon" href="./icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preload" href="./fonts/PixelifySans.ttf" as="font" type="font/ttf" crossorigin />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Pixel Worms" />
  <meta property="og:title" content="Pixel Worms" />
  <meta property="og:description" content="A free swarm game in the browser. Start as one worm, eat everything, survive." />
  <meta property="og:url" content="https://worms.codepawl.com/" />
  <meta property="og:image" content="https://worms.codepawl.com/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pixel Worms" />
  <meta name="twitter:description" content="A free swarm game in the browser. Start as one worm, eat everything, survive." />
  <meta name="twitter:image" content="https://worms.codepawl.com/og.png" />
  <style>
    @font-face { font-family: 'Pixelify Sans'; src: url('./fonts/PixelifySans.ttf'); font-weight: 400 700; font-display: swap; }
    html, body { margin: 0; height: 100%; background: #ead9b4; overflow: hidden; touch-action: none; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; image-rendering: pixelated; cursor: crosshair; }
    body.play canvas { object-fit: fill; width: 100%; height: 100%; }
    #hud {
      position: fixed; left: 28px; bottom: 24px; color: #fff3d6; font: 600 30px/1 'Pixelify Sans', monospace;
      text-shadow: 3px 3px 0 #3a1017; white-space: pre; pointer-events: none; user-select: none;
    }
    body.play #hud { display: none; }
    /* Loader: inline so it paints before any script. --p runs 0 to 1 and is set from src/loading.js. */
    #loading {
      --p: 0; position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: #ead9b4; color: #2a080c; pointer-events: none; user-select: none; -webkit-user-select: none;
      transition: opacity 450ms steps(6);
    }
    #loading.done { opacity: 0; }
    #loading h1 { margin: 0; font: 700 clamp(40px, 10vw, 84px)/1 'Pixelify Sans', monospace; color: #8a1828; text-shadow: 4px 4px 0 #f6ead0; }
    #load-lane { position: relative; width: min(72vw, 360px); padding-top: 64px; }
    #load-worm {
      position: absolute; top: 4px; left: calc(var(--p) * (100% - 64px)); width: 64px; height: 64px; image-rendering: pixelated; transform: scaleX(-1);
      transition: left 300ms steps(6); animation: crawl 360ms steps(1) infinite;
    }
    @keyframes crawl { 0% { translate: 0 0; } 50% { translate: 0 -4px; } }
    #load-track { height: 24px; box-sizing: border-box; border: 4px solid #2a080c; background: #d6c093; padding: 0; }
    #load-fill {
      height: 100%; width: calc(var(--p) * 100%); transition: width 300ms steps(6);
      background: repeating-linear-gradient(90deg, #c0303f 0 12px, #8a1828 12px 16px);
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="loading">
    <h1>Pixel Worms</h1>
    <div id="load-lane">
      <img id="load-worm" alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAy0lEQVR4nGNgoBAwwhhaHDz/cSm69uMLI14DtDh4/ucISOC0ZcqHFzgNYoRpTrmyDqvmOTpBKAahG8KEzNGTssBKwwDIInSvMhGrOSDMC6sLmZA5l56dwEqDwIZV2/AbcAmPZnyABRQoUz68+M+gE8Tg/e8fw1YmiJnIbKKAFgfP/4diSvAAQmaD5KZJqIBxCp/Ef+SAZCKUWJDTyLlvXxiO/fqCopYJl4vkX91jJKQZBBjxeYmQZpwuIFYzVgNI0YzVC+hJFZ9mkDwAWGOAVAklL4MAAAAASUVORK5CYII=" />
      <div id="load-track"><div id="load-fill"></div></div>
    </div>
  </div>
  <div id="play" hidden>
    <div id="stats">
      <div class="row"><span id="count-chip" class="chip"></span><span id="time-chip" class="chip"></span></div>
      <div id="eaten" class="row"></div>
      <div id="alerts" class="row"><span id="hunger" hidden></span><span id="threat" hidden></span></div>
    </div>
    <button id="sound" class="icon-button" aria-label="Sound"></button>
    <div id="abilities" class="hidden">
      <button id="dodge-button" class="ability" title="Dodge (right click)" aria-label="Dodge (right click)"></button>
      <button id="lunge-button" class="ability" title="Lunge (left click)" aria-label="Lunge (left click)"></button>
    </div>
    <div id="toast" aria-live="polite"></div>
    <section id="start" class="screen">
      <h1>Pixel Worms</h1>
      <p id="goal">Start as one worm. Eat everything. Survive.</p>
      <button id="play-button" class="primary">Play</button>
    </section>
    <div id="links"><button id="credits-open" class="text-button">Credits</button><button id="howto-open" class="text-button">How to play</button></div>
    <div id="tutorial" hidden>
      <div id="tutorial-labels"></div>
      <button id="tutorial-skip" class="text-button">Skip</button>
    </div>
    <section id="end" class="screen" hidden>
      <div id="end-icon"></div>
      <h2 id="end-title"></h2>
      <div id="end-stats" class="row"></div>
      <button id="again-button" class="primary">Play again</button>
    </section>
    <section id="credits" class="page" hidden>
      <div class="page-inner">
        <button id="credits-back" class="text-button">Back</button>
        <h2>Credits</h2>
        <div id="credits-body"></div>
      </div>
    </section>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
