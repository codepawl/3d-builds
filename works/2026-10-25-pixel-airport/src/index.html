<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: rgba(18, 17, 30, 0.86);
    --panel-soft: rgba(255, 255, 255, 0.06);
    --text: #f4ecd8;
    --muted: #a7a3b8;
    --amber: #ffc857;
    --green: #7ad67f;
    --blue: #7fc4ff;
    --red: #ff6b5b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d18; }
  body {
    font-family: 'Silkscreen', ui-monospace, 'Courier New', monospace;
    font-size: 16px;
    line-height: 1.25;
    color: var(--text);
    -webkit-font-smoothing: none;
    font-smooth: never;
  }
  [hidden] { display: none !important; }
  #view {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    cursor: grab;
  }
  #view:active { cursor: grabbing; }
  #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; }
  .panel { position: absolute; background: var(--panel); padding: 10px 12px; pointer-events: auto; }
  #stats { top: 12px; left: 12px; min-width: 196px; }
  .clock-row { display: flex; align-items: center; gap: 10px; font-size: 32px; line-height: 1; margin-bottom: 10px; }
  #sky-icon { width: 16px; height: 16px; flex: none; }
  #sky-icon.sun { background: var(--amber); box-shadow: 0 0 0 3px rgba(255, 200, 87, 0.25); }
  #sky-icon.moon { background: #dfe6ff; box-shadow: inset -5px -3px 0 0 #6f7bb0; border-radius: 50%; }
  #sky-icon.dusk { background: #ff8f5a; clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%); }
  .stat { display: flex; justify-content: space-between; gap: 16px; }
  .stat span { color: var(--muted); }
  #speed { display: flex; gap: 4px; margin-top: 10px; }
  #speed button {
    font: inherit; color: var(--muted); background: transparent; border: 0;
    padding: 4px 8px; cursor: pointer;
  }
  #speed button:hover { color: var(--text); }
  #speed button[aria-pressed="true"] { color: var(--text); background: var(--panel-soft); }
  #board { top: 12px; right: 12px; width: 470px; }
  #board h2 { font-size: 16px; font-weight: normal; color: var(--amber); margin: 0 0 4px; }
  #board h2 + table { margin-bottom: 10px; }
  #board table:last-child { margin-bottom: 0; }
  #board table { width: 100%; border-collapse: collapse; }
  #board td { padding: 2px 4px; white-space: nowrap; }
  #board td:first-child { padding-left: 0; }
  #board tr { cursor: pointer; }
  #board tr.live:hover td { background: var(--panel-soft); }
  #board tr.followed td { background: rgba(255, 200, 87, 0.14); }
  #board .time { color: var(--muted); }
  #board .empty td { color: var(--muted); cursor: default; }
  .status { display: inline-flex; align-items: center; gap: 6px; }
  .ic { display: inline-block; width: 10px; height: 10px; background: currentColor; flex: none; }
  .ic.up { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .ic.down { clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .ic.dot { border-radius: 50%; }
  .ic.diamond { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .ic.ring { background: none; box-shadow: inset 0 0 0 2px currentColor; border-radius: 50%; }
  .c-green { color: var(--green); } .c-amber { color: var(--amber); } .c-blue { color: var(--blue); }
  .c-red { color: var(--red); } .c-muted { color: var(--muted); } .c-text { color: var(--text); }
  #follow { left: 12px; bottom: 12px; min-width: 250px; }
  #follow .flight { font-size: 32px; line-height: 1; margin-bottom: 4px; }
  #follow .airline { color: var(--amber); margin-bottom: 8px; }
  #follow .row { display: flex; justify-content: space-between; gap: 16px; }
  #follow .row span { color: var(--muted); }
  #follow button {
    font: inherit; color: var(--muted); background: var(--panel-soft); border: 0;
    padding: 4px 8px; margin-top: 10px; cursor: pointer;
  }
  #follow button:hover { color: var(--text); }
  #tag {
    position: absolute; transform: translate(-50%, -100%); padding: 2px 6px;
    background: var(--panel); color: var(--amber); white-space: nowrap; font-size: 16px;
  }
  #hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); color: var(--text);
    background: var(--panel); padding: 4px 10px; transition: opacity 1s; white-space: nowrap; }
  @media (max-width: 760px) {
    body { font-size: 16px; }
    #stats { top: 8px; left: 8px; min-width: 0; padding: 8px 10px; }
    .clock-row { font-size: 24px; margin-bottom: 6px; }
    #board { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; padding: 8px 10px; }
    #board .city { display: none; }
    #board table, #board h2 { font-size: 12px; }
    #board td { padding: 1px 3px; }
    #board tbody tr:nth-child(n+4) { display: none; }
    #follow {
      left: 8px; right: 8px; top: auto; bottom: 184px; min-width: 0; padding: 8px 10px;
      font-size: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px;
    }
    #follow .flight, #follow .airline, #follow button { grid-column: 1 / -1; }
    #follow .flight { font-size: 24px; }
    #follow .airline { margin-bottom: 4px; }
    #follow button { justify-self: start; margin-top: 6px; }
    #hint { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<canvas id="view"></canvas>
<div id="hud">
  <section id="stats" class="panel" aria-label="Airport status">
    <div class="clock-row"><span id="sky-icon" class="sun"></span><span id="clock">06:30</span></div>
    <div class="stat"><span>Ground</span><b id="stat-ground">0</b></div>

    <div id="speed" role="group" aria-label="Simulation speed">
      <button type="button" data-speed="1" aria-pressed="true">1x</button>

    <div class="airline" id="follow-airline"></div>

    <div class="row"><span>Gate</span><b id="follow-gate"></b></div>

    <div class="row"><span>Speed</span><b id="follow-speed"></b></div>

  </section>
  <div id="tag" hidden></div>
  <div id="hint">Drag to orbit, scroll to zoom, click a plane</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------------------
// Seeded randomness: the simulation never touches Math.random.
// ---------------------------------------------------------------------------
function createRandom(seed) {
  let state = seed >>> 0;
  return function next() {
    state = (state + 0x6D2B79F5) >>> 0;
    let value = state;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
  };
}
const simRandom = createRandom(20261024);
const decorRandom = createRandom(7741);
const randomBetween = (random, low, high) => low + (high - low) * random();
const pickFrom = (random, list) => list[Math.floor(random() * list.length)];
const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
const clamp01 = (value) => clamp(value, 0, 1);
const lerp = (from, to, amount) => from + (to - from) * amount;
const smoothstep = (edge0, edge1, value) => {
  const t = clamp01((value - edge0) / (edge1 - edge0));
  return t * t * (3 - 2 * t);
};
function wrapAngle(angle) {
  let result = angle % (Math.PI * 2);
  if (result > Math.PI) result -= Math.PI * 2;
  if (result < -Math.PI) result += Math.PI * 2;
  return result;
}
function approachAngle(current, target, maxStep) {
  const difference = wrapAngle(target - current);
  return current + clamp(difference, -maxStep, maxStep);
}

// ---------------------------------------------------------------------------
// World layout (x east, z south, y up). Runway 09/27 runs along x.
// ---------------------------------------------------------------------------
const SIM_RATE = 4;                 // simulated seconds per real second at 1x
const DAY_LENGTH_SIM = 240 * SIM_RATE; // a full sky cycle takes 4 real minutes at 1x
const DAY_START = 0.27;
const START_CLOCK = 6 * 3600 + 30 * 60;
const STEP = 0.25;

const RUNWAY = { x0: -93, x1: 93, halfWidth: 2.8 };
const TAXIWAY_Z = -14;
const LANE_Z = -22;
const NOSE_Z = -37;
const ROAD_Z = -39;
const TERMINAL_FRONT_Z = -41;
const GATE_X = [-44, -28, -12, 4, 20, 36];
const GATE_NAMES = ['A1', 'A2', 'A3', 'A4', 'A5', 'A6'];
const EXIT_NEAR = 46;
const EXIT_FAR = 76;
const HOLD = { x: -82, z: -7.5 };
const CONNECTOR_X = -58;
const TOUCHDOWN_X = -70;
const ORBIT = { x: -190, z: 30, radius: 30 };
const FINAL_ALT = 13;
const DEPOTS = [{ x: -62, z: ROAD_Z }, { x: 54, z: ROAD_Z }];

const PALETTE = {
  grass: 0x6f9a4a, grassDark: 0x5d8a40, grassLight: 0x8aae58, wheat: 0xc9b25e,
  soil: 0x7a5534, soilDark: 0x553a26,
  asphalt: 0x3a3e49, taxiway: 0x4a4e59, apron: 0x9c9b93, apronDark: 0x8a8981, road: 0x55555e,
  white: 0xf2efe6, yellow: 0xf2c14e,
  terminal: 0xdcd2bf, roof: 0x8c95a3, concrete: 0xb9b2a4,
  hangar: 0x8a9696, hangarRoof: 0x5d6b78, hangarDoor: 0x4c5560,
  tank: 0xe9e5db, tankBand: 0xc8372d, tower: 0xd6cfc0,
  tree: 0x3f7a3a, treeDark: 0x2f5f30, trunk: 0x6b4a2f,
  dark: 0x2a2a33, outline: 0x17151f,
};

const AIRLINES = [
  { code: 'MG', name: 'Mango Air', main: 0xf08a24, accent: 0x2b2d42, body: 0xf4efe4 },
  { code: 'PL', name: 'Polar Lines', main: 0x2f6fb5, accent: 0x9fd3f0, body: 0xf2f2ee },
  { code: 'KS', name: 'Kestrel', main: 0xc8372d, accent: 0xf2c14e, body: 0xf0ebe0 },
  { code: 'LT', name: 'Lotus Sky', main: 0x8a4fa3, accent: 0xf29bb8, body: 0xf4f0f4 },
  { code: 'TA', name: 'Teal Atlantic', main: 0x1f8a87, accent: 0xe9d8a6, body: 0xeef0ec },
];
const CITIES = ['OSL', 'LIS', 'NRT', 'SYD', 'YVR', 'CPT', 'REK', 'HAN', 'MEX', 'DXB', 'SFO', 'BKK', 'AMS', 'GRU', 'ICN', 'NBO'];
const TYPES = {
  narrow: { key: 'narrow', name: 'N320 narrow body', code: 'N320', length: 5.0, span: 4.8, radius: 0.36, gear: 0.3 },
  wide: { key: 'wide', name: 'W787 wide body', code: 'W787', length: 7.4, span: 7.2, radius: 0.54, gear: 0.4 },
  prop: { key: 'prop', name: 'T72 turboprop', code: 'T72', length: 3.8, span: 4.3, radius: 0.3, gear: 0.26 },
};
for (const type of Object.values(TYPES)) type.reach = Math.max(type.length, type.span) / 2;

// ---------------------------------------------------------------------------
// Renderer, low resolution targets and the pixel post pass.
// ---------------------------------------------------------------------------
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
renderer.shadowMap.autoUpdate = false;

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-100, 100, 60, -60, 1, 2600);
const controls = new OrbitControls(camera, canvas);
controls.target.set(-6, 0, -22);
camera.zoom = 1.7;
camera.updateProjectionMatrix();
{
  const radius = 900;
  const polar = 0.96;
  const azimuth = 0.62;
  camera.position.set(
    controls.target.x + radius * Math.sin(polar) * Math.sin(azimuth),
    controls.target.y + radius * Math.cos(polar),
    controls.target.z + radius * Math.sin(polar) * Math.cos(azimuth),
  );
}
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = 1.25;
controls.minZoom = 0.45;
controls.maxZoom = 8;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.update();

let pixelScale = 4;
let renderWidth = 400;
let renderHeight = 225;
let colorTarget = null;
let idTarget = null;

const BAYER_GLSL = `
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);
float bayer(ivec2 p) { return (BAYER[(p.x & 3) + (p.y & 3) * 4] + 0.5) / 16.0; }
`;

const postMaterial = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: null }, tColorDepth: { value: null }, tId: { value: null }, tIdDepth: { value: null },
    rtSize: { value: new THREE.Vector2(400, 225) }, pixelScale: { value: 4 },
    skyTop: { value: new THREE.Color() }, skyBottom: { value: new THREE.Color() },
    outlineColor: { value: new THREE.Color(PALETTE.outline) },
    uNight: { value: 0 }, uTime: { value: 0 },
  },
  vertexShader: `void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D tColor; uniform sampler2D tColorDepth; uniform sampler2D tId; uniform sampler2D tIdDepth;
    uniform vec2 rtSize; uniform float pixelScale; uniform vec3 skyTop; uniform vec3 skyBottom;
    uniform vec3 outlineColor; uniform float uNight; uniform float uTime;
    ${BAYER_GLSL}
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      ivec2 size = ivec2(rtSize);
      ivec2 p = ivec2(floor(gl_FragCoord.xy / pixelScale));
      p = min(p, size - 1);
      vec4 base = texelFetch(tColor, p, 0);
      vec3 color;
      if (base.a < 0.5) {
        float t = (float(p.y) + 0.5) / rtSize.y;
        color = mix(skyBottom, skyTop, smoothstep(0.0, 1.0, t));
        float star = step(0.9965, hash(vec2(p)));
        float twinkle = 0.55 + 0.45 * sin(uTime * 2.0 + hash(vec2(p.yx)) * 6.28);
        color += star * uNight * t * twinkle * vec3(0.8, 0.82, 1.0);
      } else {
        color = base.rgb;
        vec2 id = texelFetch(tId, p, 0).rg;
        if (id.x + id.y > 0.0) {
          float depth = texelFetch(tIdDepth, p, 0).r;
          float visibleDepth = texelFetch(tColorDepth, p, 0).r;
          if (abs(depth - visibleDepth) < 0.0004) {
            bool edge = false;
            ivec2 offsets[4] = ivec2[4](ivec2(1, 0), ivec2(-1, 0), ivec2(0, 1), ivec2(0, -1));
            for (int i = 0; i < 4; i++) {
              ivec2 q = clamp(p + offsets[i], ivec2(0), size - 1);
              vec2 neighbourId = texelFetch(tId, q, 0).rg;
              if (abs(neighbourId.x - id.x) + abs(neighbourId.y - id.y) > 0.001) {
                float neighbourDepth = texelFetch(tIdDepth, q, 0).r;
                if (neighbourId.x + neighbourId.y == 0.0 || neighbourDepth > depth + 0.00004) edge = true;
              }
            }
            if (edge) color = mix(color, outlineColor, 0.88);
          }
        }
      }
      vec3 srgb = pow(max(color, vec3(0.0)), vec3(1.0 / 2.2));
      float levels = 18.0;
      srgb = floor(srgb * levels + bayer(p)) / levels;
      gl_FragColor = vec4(srgb, 1.0);
    }
  `,
  depthTest: false,
  depthWrite: false,
});
const postScene = new THREE.Scene();
const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial));

function createTargets() {
  if (colorTarget) colorTarget.dispose();
  if (idTarget) idTarget.dispose();
  const colorDepth = new THREE.DepthTexture(renderWidth, renderHeight);
  colorTarget = new THREE.WebGLRenderTarget(renderWidth, renderHeight, {
    type: THREE.HalfFloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthTexture: colorDepth,
  });
  const idDepth = new THREE.DepthTexture(renderWidth, renderHeight);
  idTarget = new THREE.WebGLRenderTarget(renderWidth, renderHeight, {
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthTexture: idDepth,
  });
  postMaterial.uniforms.tColor.value = colorTarget.texture;
  postMaterial.uniforms.tColorDepth.value = colorTarget.depthTexture;
  postMaterial.uniforms.tId.value = idTarget.texture;
  postMaterial.uniforms.tIdDepth.value = idTarget.depthTexture;
  postMaterial.uniforms.rtSize.value.set(renderWidth, renderHeight);
}

function resize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  pixelScale = Math.max(1, Math.round(Math.max(width, height) / 400));
  renderWidth = Math.ceil(width / pixelScale);
  renderHeight = Math.ceil(height / pixelScale);
  renderer.setSize(width, height, false);
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  postMaterial.uniforms.pixelScale.value = pixelScale;
  createTargets();
  const aspect = renderWidth / renderHeight;
  let halfWidth;
  let halfHeight;
  if (aspect >= 1) {
    halfHeight = 60;
    halfWidth = halfHeight * aspect;
  } else {
    halfWidth = 64;
    halfHeight = halfWidth / aspect;
  }
  camera.left = -halfWidth;
  camera.right = halfWidth;
  camera.top = halfHeight;
  camera.bottom = -halfHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

// ---------------------------------------------------------------------------
// Materials.
// ---------------------------------------------------------------------------
const lambertCache = new Map();
function lambert(hex) {
  if (!lambertCache.has(hex)) lambertCache.set(hex, new THREE.MeshLambertMaterial({ color: hex, flatShading: true }));
  return lambertCache.get(hex);
}

const ID_VERTEX = `
#include <common>
void main() {
  #include <begin_vertex>
  #include <project_vertex>
}`;
const ID_FRAGMENT = `uniform vec3 idColor; void main() { gl_FragColor = vec4(idColor, 1.0); }`;
let nextOutlineId = 1;
function createIdMaterial() {
  const id = nextOutlineId++;
  return new THREE.ShaderMaterial({
    uniforms: { idColor: { value: new THREE.Vector3((id & 255) / 255, ((id >> 8) & 255) / 255, 0) } },
    vertexShader: ID_VERTEX,
    fragmentShader: ID_FRAGMENT,
  });
}
const ID_ZERO = new THREE.ShaderMaterial({
  uniforms: { idColor: { value: new THREE.Vector3(0, 0, 0) } },
  vertexShader: ID_VERTEX,
  fragmentShader: ID_FRAGMENT,
});

const sharedTime = { value: 0 };

const exhaustTemplate = new THREE.ShaderMaterial({
  uniforms: { uStrength: { value: 0 }, uTime: sharedTime },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uStrength; uniform float uTime; varying vec2 vUv;
    ${BAYER_GLSL}
    void main() {
      float along = vUv.x;
      float across = 1.0 - abs(vUv.y - 0.5) * 2.0;
      float flicker = 0.55 + 0.45 * sin(uTime * 23.0 + vUv.x * 19.0 + vUv.y * 11.0);
      float alpha = uStrength * pow(along, 1.4) * across * flicker;
      if (alpha < bayer(ivec2(gl_FragCoord.xy))) discard;
      vec3 hot = vec3(0.98, 0.86, 0.68);
      vec3 cool = vec3(0.78, 0.8, 0.84);
      gl_FragColor = vec4(mix(cool, hot, along), 1.0);
    }`,
  side: THREE.DoubleSide,
});

const propMaterial = new THREE.ShaderMaterial({
  uniforms: { uTime: sharedTime },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uTime; varying vec2 vUv;
    ${BAYER_GLSL}
    void main() {
      vec2 c = vUv - 0.5;
      float angle = atan(c.y, c.x);
      float blades = 0.5 + 0.5 * sin(angle * 2.0 + uTime * 40.0);
      float alpha = 0.25 + 0.45 * blades;
      if (alpha < bayer(ivec2(gl_FragCoord.xy))) discard;
      gl_FragColor = vec4(vec3(0.2, 0.2, 0.24), 1.0);
    }`,
  side: THREE.DoubleSide,
});

const cloudUniforms = { uTime: sharedTime, uLit: { value: new THREE.Color(1, 1, 1) }, uShade: { value: new THREE.Color(0.7, 0.75, 0.85) } };

// ---------------------------------------------------------------------------
// Lighting.
// ---------------------------------------------------------------------------
const sunLight = new THREE.DirectionalLight(0xfff1d6, 2.6);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(1024, 1024);
sunLight.shadow.camera.left = -150;
sunLight.shadow.camera.right = 150;
sunLight.shadow.camera.top = 150;
sunLight.shadow.camera.bottom = -150;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 700;
sunLight.shadow.bias = -0.0006;

const surfaceBatches = new Map();
function addSurface(hex, x0, x1, z0, z1, y) {
  const geometry = new THREE.PlaneGeometry(Math.abs(x1 - x0), Math.abs(z1 - z0));
  geometry.rotateX(-Math.PI / 2);
  geometry.translate((x0 + x1) / 2, y, (z0 + z1) / 2);
  if (!surfaceBatches.has(hex)) surfaceBatches.set(hex, []);
  surfaceBatches.get(hex).push(geometry);
}
function addLine(hex, ax, az, bx, bz, width, y = 0.06) {
  const half = width / 2;
  if (Math.abs(az - bz) < 1e-6) addSurface(hex, Math.min(ax, bx), Math.max(ax, bx), az - half, az + half, y);
  else addSurface(hex, ax - half, ax + half, Math.min(az, bz), Math.max(az, bz), y);
}
function flushSurfaces() {
  for (const [hex, geometries] of surfaceBatches) {
    const mesh = new THREE.Mesh(mergeGeometries(geometries), lambert(hex));
    mesh.receiveShadow = true;
    scene.add(mesh);
  }
  surfaceBatches.clear();
}

const DIGITS = {
  '0': ['111', '101', '101', '101', '111'],
  '9': ['111', '101', '111', '001', '111'],
  '2': ['111', '001', '111', '100', '111'],
  '7': ['111', '001', '010', '010', '010'],
};
function drawRunwayNumber(text, startX, direction, cell) {
  // direction 1: read by a pilot heading east, -1: heading west.
  const totalWidth = text.length * 3 * cell + (text.length - 1) * cell;
  const zStart = -direction * totalWidth / 2;
  text.split('').forEach((character, characterIndex) => {
    const rows = DIGITS[character];
    rows.forEach((row, rowIndex) => {
      row.split('').forEach((bit, columnIndex) => {
        if (bit !== '1') return;
        const x = startX + direction * (4 - rowIndex) * cell;
        const z = zStart + direction * ((characterIndex * 4 + columnIndex) * cell);
        addSurface(PALETTE.white, x, x + direction * cell, z, z + direction * cell, 0.06);
      });
    });
  });
}

  const mesh = new THREE.Mesh(geometry, typeof hex === 'number' ? lambert(hex) : hex);

  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData.idMat = idMaterial;
  parent.add(mesh);
  return mesh;
}

function buildBridges() {

  const rotundaGeometry = new THREE.CylinderGeometry(0.6, 0.6, 1, 8);
  rotundaGeometry.translate(0, 0.5, 0);
  const legGeometry = new THREE.BoxGeometry(0.18, 1, 0.18);
  legGeometry.translate(0, 0.5, 0);
  for (const gate of gates) {
    const idMaterial = createIdMaterial();
    const start = { x: gate.x - 5, z: TERMINAL_FRONT_Z + 0.7 };
    const rotunda = addBuildingMesh(rotundaGeometry, 0xd8dbe2, start.x, 0, start.z, idMaterial);
    const tunnel = addBuildingMesh(tunnelGeometry, 0xd8dbe2, start.x, 1.2, start.z, idMaterial);
    const leg = addBuildingMesh(legGeometry, PALETTE.dark, start.x, 0, start.z, idMaterial);
    const cab = addBuildingMesh(new THREE.BoxGeometry(0.5, 0.65, 0.75), 0x4f6d8a, start.x, 1.2, start.z, idMaterial);
    gate.bridge = { start, rotunda, tunnel, leg, cab };
  }

function updateBridge(gate, dt) {
  const step = dt / 8;
  gate.extension = gate.goal > gate.extension ? Math.min(gate.goal, gate.extension + step) : Math.max(gate.goal, gate.extension - step);
  const bridge = gate.bridge;
  const park = { x: gate.x - 3.6, z: NOSE_Z - 1.2 };
  let door = park;
  let doorY = 1.2;
  const aircraft = gate.docked;
  if (aircraft) {
    door = { x: gate.x - aircraft.type.radius - 0.3, z: NOSE_Z + aircraft.type.length * 0.16 };
    doorY = aircraft.type.gear + aircraft.type.radius * 1.15;
  }
  const amount = smoothstep(0, 1, gate.extension);
  const endX = lerp(park.x, door.x, amount);
  const endZ = lerp(park.z, door.z, amount);
  const y = lerp(1.2, doorY, amount);
  const deltaX = endX - bridge.start.x;
  const deltaZ = endZ - bridge.start.z;
  const length = Math.hypot(deltaX, deltaZ);
  const yaw = Math.atan2(-deltaZ, deltaX);
  bridge.tunnel.position.set(bridge.start.x, y, bridge.start.z);
  bridge.tunnel.rotation.y = yaw;
  bridge.tunnel.scale.x = Math.max(0.5, length - 0.25);
  bridge.cab.position.set(endX - Math.cos(yaw) * 0.25, y, endZ + Math.sin(yaw) * 0.25);
  bridge.cab.rotation.y = yaw;
  bridge.rotunda.scale.y = y + 0.3;
  bridge.leg.position.set(bridge.start.x + deltaX * 0.75, 0, bridge.start.z + deltaZ * 0.75);
  bridge.leg.scale.y = Math.max(0.1, y - 0.27);
}

const clouds = [];
function buildClouds() {
  const material = new THREE.ShaderMaterial({
    uniforms: cloudUniforms,
    vertexShader: `varying vec2 vUv; varying vec3 vWorld;
      void main() { vUv = uv; vec4 world = modelMatrix * vec4(position, 1.0); vWorld = world.xyz; gl_Position = projectionMatrix * viewMatrix * world; }`,
    fragmentShader: `
      uniform vec3 uLit; uniform vec3 uShade; varying vec2 vUv; varying vec3 vWorld;
      ${BAYER_GLSL}
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p); vec2 f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
      }
      float fbm(vec2 p) { float total = 0.0; float amplitude = 0.5; for (int i = 0; i < 4; i++) { total += amplitude * noise(p); p *= 2.1; amplitude *= 0.5; } return total; }
      void main() {
        vec2 centered = (vUv - 0.5) * vec2(1.0, 1.5);
        float radius = length(centered) * 2.0;
        float density = fbm(vWorld.xz * 0.06) - radius * 0.6 + 0.3;
        float alpha = smoothstep(0.25, 0.6, density) * 0.9;
        if (alpha < bayer(ivec2(gl_FragCoord.xy))) discard;
        gl_FragColor = vec4(mix(uShade, uLit, smoothstep(0.25, 0.75, density + (0.5 - vUv.y) * 0.3)), 1.0);
      }`,
    side: THREE.DoubleSide,
  });
  for (let k = 0; k < 7; k++) {
    const width = randomBetween(decorRandom, 30, 52);
    const geometry = new THREE.PlaneGeometry(width, width * 0.6);
    geometry.rotateX(-Math.PI / 2);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(randomBetween(decorRandom, -260, 260), randomBetween(decorRandom, 42, 62), randomBetween(decorRandom, -110, 70));
    mesh.userData.noId = true;
    mesh.userData.drift = randomBetween(decorRandom, 0.25, 0.45);
    scene.add(mesh);
    clouds.push(mesh);
  }
}

// Point lights (runway, taxiway, beacons) with dithered glow.
// ---------------------------------------------------------------------------
const lightMaterial = new THREE.ShaderMaterial({
  uniforms: { uNight: { value: 0 }, uScale: { value: 1 } },
  vertexShader: `
    attribute vec3 lightColor; attribute float size; attribute float kind;
    uniform float uNight; uniform float uScale;
    varying vec3 vColor; varying float vGlow;
    void main() {
      vec4 viewPosition = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * viewPosition;
      float lit = kind < 0.5 ? uNight : 1.0;
      if (lit < 0.05 || size <= 0.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); }
      float pointSize = size * uScale * mix(0.7, 1.0, uNight) * mix(0.6, 1.0, lit);
      gl_PointSize = max(pointSize, 1.0);
      vColor = lightColor * mix(0.6, 1.0, lit);
      vGlow = mix(0.35, 1.0, uNight);
    }`,
  fragmentShader: `
    varying vec3 vColor; varying float vGlow;
    ${BAYER_GLSL}
    void main() {
      vec2 offset = gl_PointCoord - 0.5;
      float distance = length(offset) * 2.0;
      bool core = distance < 0.42;
      float halo = (1.0 - distance) * vGlow;
      if (!core && halo < bayer(ivec2(gl_FragCoord.xy)) + 0.2) discard;
      vec3 color = core ? vColor * 1.6 : vColor * 0.75;
      gl_FragColor = vec4(color, 1.0);
    }`,
  depthWrite: true,
});

function buildStaticLights() {
  const positions = [];
  const colors = [];
  const sizes = [];
  const add = (x, y, z, hex, size) => {
    positions.push(x, y, z);
    const color = new THREE.Color(hex);
    colors.push(color.r, color.g, color.b);
    sizes.push(size);
  };
  for (let x = RUNWAY.x0; x <= RUNWAY.x1 + 0.1; x += 7.15) {
    add(x, 0.2, RUNWAY.halfWidth + 0.3, 0xfff2cc, 3);
    add(x, 0.2, -RUNWAY.halfWidth - 0.3, 0xfff2cc, 3);

  for (let z = -2.5; z <= 2.51; z += 0.84) {

const geometryCache = new Map();
function cachedGeometry(key, factory) {
  if (!geometryCache.has(key)) geometryCache.set(key, factory());
  return geometryCache.get(key);
}
function halfWingGeometry(span, rootChord, tipChord, thickness, sweep, side) {
  const geometry = new THREE.BoxGeometry(rootChord, thickness, span / 2);
  geometry.translate(0, 0, side * span / 4);
  const position = geometry.attributes.position;
  for (let index = 0; index < position.count; index++) {
    const t = Math.abs(position.getZ(index)) / (span / 2);
    const x = position.getX(index);
    position.setX(index, x * (1 + (tipChord / rootChord - 1) * t) - sweep * t);
  }
  geometry.computeVertexNormals();
  return geometry;
}
function wingGeometry(span, rootChord, tipChord, thickness, sweep) {
  return mergeGeometries([
    halfWingGeometry(span, rootChord, tipChord, thickness, sweep, 1),
    halfWingGeometry(span, rootChord, tipChord, thickness, sweep, -1),
  ]);
}
function finGeometry(chord, height, thickness, taper, sweep) {
  const geometry = new THREE.BoxGeometry(chord, height, thickness);
  geometry.translate(0, height / 2, 0);
  const position = geometry.attributes.position;
  for (let index = 0; index < position.count; index++) {
    if (position.getY(index) > 0.01) position.setX(index, position.getX(index) * taper - sweep);
  }
  geometry.computeVertexNormals();
  return geometry;
}

function buildAircraftModel(type, airline, idMaterial) {
  const length = type.length;
  const radius = type.radius;
  const span = type.span;
  const gear = type.gear;
  const bodyY = gear + radius;
  const key = type.key;
  const isProp = key === 'prop';
  const root = new THREE.Group();
  const body = new THREE.Group();
  root.add(body);
  const white = lambert(airline.body);
  const main = lambert(airline.main);
  const accent = lambert(airline.accent);
  const dark = lambert(PALETTE.dark);
  const grey = lambert(0xb8bcc4);
  const add = (geometry, material, x, y, z) => {
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.userData.idMat = idMaterial;
    body.add(mesh);
    return mesh;
  };
  const bodyLength = length * 0.64;
  const noseLength = length * 0.14;
  const tailLength = length * 0.22;
  const bodyCenter = -length / 2 + tailLength + bodyLength / 2;
  add(cachedGeometry(key + 'body', () => new THREE.CylinderGeometry(radius, radius, bodyLength, 8).rotateZ(Math.PI / 2)), white, bodyCenter, bodyY, 0);
  add(cachedGeometry(key + 'nose', () => new THREE.CylinderGeometry(radius * 0.3, radius, noseLength, 8).rotateZ(-Math.PI / 2)), white, length / 2 - noseLength / 2, bodyY - radius * 0.08, 0);
  add(cachedGeometry(key + 'tail', () => new THREE.CylinderGeometry(radius * 0.3, radius, tailLength, 8).rotateZ(Math.PI / 2)), white, -length / 2 + tailLength / 2, bodyY + radius * 0.2, 0);
  add(cachedGeometry(key + 'cheat', () => new THREE.BoxGeometry(bodyLength + noseLength * 0.4, radius * 0.3, radius * 2 + 0.06)), main, bodyCenter + noseLength * 0.2, bodyY - radius * 0.1, 0);
  add(cachedGeometry(key + 'belly', () => new THREE.BoxGeometry(bodyLength * 0.95, radius * 0.25, radius * 1.4)), accent, bodyCenter, bodyY - radius * 0.86, 0);

  const wingX = isProp ? length * 0.06 : length * 0.04;
  const wingY = isProp ? bodyY + radius * 0.9 : bodyY - radius * 0.5;
  const wingSweep = isProp ? length * 0.02 : length * 0.13;
  const rootChord = isProp ? length * 0.15 : length * 0.22;
  const tipChord = isProp ? length * 0.09 : length * 0.07;
  add(cachedGeometry(key + 'wing', () => wingGeometry(span, rootChord, tipChord, 0.07, wingSweep)), grey, wingX, wingY, 0);

  const finX = -length * 0.4;
  const finHeight = radius * (isProp ? 2.6 : 2.8);
  add(cachedGeometry(key + 'fin', () => finGeometry(length * 0.15, finHeight, 0.07, 0.55, length * 0.09)), main, finX, bodyY + radius * 0.5, 0);
  add(cachedGeometry(key + 'logo', () => finGeometry(length * 0.08, finHeight * 0.35, 0.09, 0.8, length * 0.02)), accent, finX - length * 0.03, bodyY + radius * 0.5 + finHeight * 0.35, 0);
  const stabilizerY = isProp ? bodyY + radius * 0.5 + finHeight * 0.95 : bodyY + radius * 0.25;
  const stabilizerX = isProp ? finX - length * 0.085 : -length * 0.43;
  add(cachedGeometry(key + 'stab', () => wingGeometry(span * 0.36, length * 0.1, length * 0.05, 0.06, length * 0.05)), isProp ? main : grey, stabilizerX, stabilizerY, 0);

  // Engines.
  const exhausts = [];
  const props = [];
  const engineRadius = isProp ? radius * 0.55 : radius * (key === 'wide' ? 0.55 : 0.45);
  const engineLength = isProp ? length * 0.2 : length * 0.14;
  const engineZ = span * (isProp ? 0.19 : (key === 'wide' ? 0.22 : 0.18));
  const engineX = wingX + (isProp ? length * 0.06 : length * 0.07) - wingSweep * (engineZ / (span / 2));
  const engineY = isProp ? wingY - engineRadius * 0.2 : wingY - engineRadius * 0.9;
  const nacelleGeometry = cachedGeometry(key + 'nacelle', () => new THREE.CylinderGeometry(engineRadius, engineRadius * 0.85, engineLength, 8).rotateZ(-Math.PI / 2));
  const exhaustLength = isProp ? length * 0.25 : length * 0.38;
  const exhaustGeometry = cachedGeometry(key + 'exhaust', () => new THREE.PlaneGeometry(exhaustLength, engineRadius * 2.6).rotateX(-Math.PI / 2));
  for (const side of [-1, 1]) {
    add(nacelleGeometry, accent, engineX, engineY, side * engineZ);
    const exhaust = new THREE.Mesh(exhaustGeometry, exhaustTemplate.clone());
    exhaust.material.uniforms.uTime = sharedTime;
    exhaust.position.set(engineX - engineLength / 2 - exhaustLength / 2, engineY, side * engineZ);
    exhaust.userData.noId = true;
    exhaust.visible = false;
    body.add(exhaust);
    exhausts.push(exhaust);
    if (isProp) {
      const propRadius = span * 0.13;
      const disc = new THREE.Mesh(cachedGeometry('propdisc', () => new THREE.CircleGeometry(1, 12).rotateY(Math.PI / 2)), propMaterial);
      disc.scale.setScalar(propRadius);
      disc.position.set(engineX + engineLength / 2 + 0.04, engineY, side * engineZ);
      disc.userData.noId = true;
      body.add(disc);
      const blades = add(cachedGeometry('propblade', () => new THREE.BoxGeometry(0.04, 1, 0.08)), dark, engineX + engineLength / 2 + 0.04, engineY, side * engineZ);
      blades.scale.y = propRadius * 2;
      props.push({ disc, blades });
    }
  }
  // Landing gear.
  const gearGeometry = cachedGeometry(key + 'gear', () => new THREE.BoxGeometry(0.14, gear, 0.14));
  add(gearGeometry, dark, length * 0.33, gear / 2, 0);
  add(gearGeometry, dark, wingX - rootChord * 0.3, gear / 2, radius * 0.8);
  add(gearGeometry, dark, wingX - rootChord * 0.3, gear / 2, -radius * 0.8);

  const tipX = wingX - wingSweep;
  const lightOffsets = {
    beaconTop: new THREE.Vector3(bodyCenter, bodyY + radius + 0.04, 0),
    beaconBottom: new THREE.Vector3(bodyCenter - 0.3, bodyY - radius - 0.04, 0),
    navLeft: new THREE.Vector3(tipX, wingY, -span / 2),
    navRight: new THREE.Vector3(tipX, wingY, span / 2),
    tail: new THREE.Vector3(-length / 2, bodyY + radius * 0.2, 0),
  };
  return { root, body, exhausts, props, lightOffsets };
}
