// ---------------------------------------------------------------------------
// Paths with rounded corners.
// ---------------------------------------------------------------------------
function buildPath(points, radius = 3) {
  const dense = [points[0]];
  for (let index = 1; index < points.length - 1; index++) {
    const previous = points[index - 1];
    const corner = points[index];
    const next = points[index + 1];
    const toPreviousX = previous.x - corner.x;
    const toPreviousZ = previous.z - corner.z;
    const toNextX = next.x - corner.x;
    const toNextZ = next.z - corner.z;
    const previousLength = Math.hypot(toPreviousX, toPreviousZ);
    const nextLength = Math.hypot(toNextX, toNextZ);
    if (previousLength < 1e-6 || nextLength < 1e-6) continue;
    const firstRadius = Math.min(radius, previousLength / 2);
    const secondRadius = Math.min(radius, nextLength / 2);
    const start = { x: corner.x + toPreviousX / previousLength * firstRadius, z: corner.z + toPreviousZ / previousLength * firstRadius };
    const end = { x: corner.x + toNextX / nextLength * secondRadius, z: corner.z + toNextZ / nextLength * secondRadius };
    const steps = 8;
    for (let step = 0; step <= steps; step++) {
      const t = step / steps;
      const u = 1 - t;
      dense.push({
        x: u * u * start.x + 2 * u * t * corner.x + t * t * end.x,
        z: u * u * start.z + 2 * u * t * corner.z + t * t * end.z,
      });
    }
  }
  dense.push(points[points.length - 1]);
  const cleaned = [dense[0]];
  for (let index = 1; index < dense.length; index++) {
    const last = cleaned[cleaned.length - 1];
    if (Math.hypot(dense[index].x - last.x, dense[index].z - last.z) > 1e-4) cleaned.push(dense[index]);
  }
  const lengths = [0];
  for (let index = 1; index < cleaned.length; index++) {
    lengths.push(lengths[index - 1] + Math.hypot(cleaned[index].x - cleaned[index - 1].x, cleaned[index].z - cleaned[index - 1].z));
  }
  return { points: cleaned, lengths, total: lengths[lengths.length - 1] };
}

function samplePath(path, distance) {
  const points = path.points;
  const lengths = path.lengths;
  if (points.length === 1) return { x: points[0].x, z: points[0].z, dirX: 1, dirZ: 0 };
  const clamped = clamp(distance, 0, path.total);
  let low = 0;
  let high = lengths.length - 1;
  while (high - low > 1) {
    const middle = (low + high) >> 1;
    if (lengths[middle] <= clamped) low = middle;
    else high = middle;
  }
  const segmentLength = lengths[high] - lengths[low];
  const t = segmentLength > 0 ? (clamped - lengths[low]) / segmentLength : 0;
  const from = points[low];
  const to = points[high];
  return {
    x: from.x + (to.x - from.x) * t,
    z: from.z + (to.z - from.z) * t,
    dirX: segmentLength > 0 ? (to.x - from.x) / segmentLength : 1,
    dirZ: segmentLength > 0 ? (to.z - from.z) / segmentLength : 0,
  };
}

// ---------------------------------------------------------------------------
// Simulation state.
// ---------------------------------------------------------------------------
let simTime = 0;
let speedMultiplier = 1;
const runway = { owner: null };
const aircraftList = [];
const vehicles = [];
const movements = [];
const departedRecords = [];
const scheduledArrivals = [];
let nextArrivalTime = 25;
let nextAircraftId = 1;

const GROUND_STATES = new Set(['ROLLOUT', 'TAXI_IN', 'DOCKED', 'PUSHBACK', 'STARTUP', 'TAXI_OUT', 'HOLD_SHORT']);
function isOnGround(aircraft) {
  if (GROUND_STATES.has(aircraft.state)) return true;
  return aircraft.state === 'TAKEOFF' && aircraft.altitude < 0.3;
}
function isGroundMover(aircraft) {
  if (aircraft.state === 'TAXI_IN' || aircraft.state === 'PUSHBACK' || aircraft.state === 'TAXI_OUT') return true;
  return aircraft.state === 'ROLLOUT' && aircraft.distance > aircraft.exitDistance - 2;
}

function pickTypeKey() {
  const roll = simRandom();
  if (roll < 0.52) return 'narrow';
  if (roll < 0.78) return 'prop';
  return 'wide';
}

function makeArrivalEntry() {
  const airline = pickFrom(simRandom, AIRLINES);
  const number = 100 + Math.floor(simRandom() * 440) * 2;
  const entry = {
    airline,
    number,
    flight: `${airline.code} ${number}`,
    typeKey: pickTypeKey(),
    origin: pickFrom(simRandom, CITIES),
    spawnAt: nextArrivalTime,
    sta: nextArrivalTime + 120,
  };
  nextArrivalTime += randomBetween(simRandom, 120, 175);
  return entry;
}
function refillSchedule() {
  while (scheduledArrivals.length < 6) scheduledArrivals.push(makeArrivalEntry());
}

function createAircraft(entry) {
  const type = TYPES[entry.typeKey];
  const idMaterial = createIdMaterial();
  const model = buildAircraftModel(type, entry.airline, idMaterial);
  scene.add(model.root);
  const destinationChoices = CITIES.filter((city) => city !== entry.origin);
  const aircraft = {
    id: nextAircraftId++,
    type,
    airline: entry.airline,
    arrivalFlight: entry.flight,
    departureFlight: `${entry.airline.code} ${entry.number + 1}`,
    origin: entry.origin,
    destination: pickFrom(simRandom, destinationChoices),
    sta: entry.sta,
    std: null,
    gateIndex: -1,
    state: 'INBOUND',
    stateTime: 0,
    position: new THREE.Vector3(),
    altitude: 0,
    yaw: 0,
    displayYaw: 0,
    pitch: 0,
    roll: 0,
    speed: 0,
    path: null,
    distance: 0,
    reverse: false,
    readySince: 0,
    holdLevel: -1,
    orbitAngle: 0,
    entryAngle: 0,
    timeline: {},
    blocker: null,
    blockDistance: Infinity,
    model,
    idMaterial,
  };
  aircraftList.push(aircraft);
  return aircraft;
}

function setState(aircraft, state) {
  aircraft.state = state;
  aircraft.stateTime = 0;
}

function freeGateIndexes() {
  return gates.filter((gate) => gate.reservedBy === null).map((gate) => gate.index);
}

function allocateHoldLevel() {
  const used = new Set(aircraftList.filter((aircraft) => aircraft.holdLevel >= 0).map((aircraft) => aircraft.holdLevel));
  let level = 0;
  while (used.has(level)) level++;
  return level;
}
const holdAltitude = (level) => FINAL_ALT + 5 * (level + 1);

function spawnArrival(entry) {
  const free = freeGateIndexes();
  const aircraft = createAircraft(entry);
  aircraft.gateIndex = pickFrom(simRandom, free);
  gates[aircraft.gateIndex].reservedBy = aircraft.id;
  aircraft.holdLevel = allocateHoldLevel();
  aircraft.entryAngle = randomBetween(simRandom, Math.PI * 0.6, Math.PI * 1.35);
  const distance = ORBIT.radius + 230;
  aircraft.position.set(ORBIT.x + Math.cos(aircraft.entryAngle) * distance, 0, ORBIT.z + Math.sin(aircraft.entryAngle) * distance);
  aircraft.altitude = holdAltitude(aircraft.holdLevel) + 6;
  aircraft.speed = 4.5;
  aircraft.yaw = Math.atan2(Math.sin(aircraft.entryAngle), -Math.cos(aircraft.entryAngle));
  aircraft.displayYaw = aircraft.yaw;
  setState(aircraft, 'INBOUND');
  return aircraft;
}

function scheduleArrivals() {
  refillSchedule();
  const next = scheduledArrivals[0];
  if (simTime < next.spawnAt) return;
  const airborneArrivals = aircraftList.filter((aircraft) => ['INBOUND', 'HOLDING', 'CLEARED'].includes(aircraft.state)).length;
  if (freeGateIndexes().length === 0 || airborneArrivals >= 4) return;
  scheduledArrivals.shift();
  spawnArrival(next);
}

function recordMovement(kind) {
  movements.push({ kind, time: simTime });
  while (movements.length && movements[0].time < simTime - 3600) movements.shift();
}

// --- Runway control -------------------------------------------------------
function earliest(list) {
  let best = null;
  for (const aircraft of list) if (!best || aircraft.readySince < best.readySince) best = aircraft;
  return best;
}
function waitingDeparture() {
  return earliest(aircraftList.filter((aircraft) => aircraft.state === 'HOLD_SHORT'));
}
function updateRunwayController() {
  if (!aircraftList.some((aircraft) => aircraft.state === 'CLEARED')) {
    const next = earliest(aircraftList.filter((aircraft) => aircraft.state === 'HOLDING'));
    if (next) {
      setState(next, 'CLEARED');
      next.holdLevel = -1;
    }
  }
  if (runway.owner) return;
  const departure = waitingDeparture();
  if (!departure) return;
  const cleared = aircraftList.find((aircraft) => aircraft.state === 'CLEARED');
  if (cleared && cleared.readySince < departure.readySince) return;
  runway.owner = departure;
  startTakeoff(departure);
}

// --- Air phases -------------------------------------------------------------
function updateInbound(aircraft, dt) {
  const targetX = ORBIT.x + Math.cos(aircraft.entryAngle) * ORBIT.radius;
  const targetZ = ORBIT.z + Math.sin(aircraft.entryAngle) * ORBIT.radius;
  const deltaX = targetX - aircraft.position.x;
  const deltaZ = targetZ - aircraft.position.z;
  const distance = Math.hypot(deltaX, deltaZ);
  const step = aircraft.speed * dt;
  aircraft.altitude = lerp(aircraft.altitude, holdAltitude(aircraft.holdLevel), clamp01(dt * 0.05));
  if (distance <= step) {
    aircraft.position.x = targetX;
    aircraft.position.z = targetZ;
    aircraft.orbitAngle = aircraft.entryAngle;
    aircraft.readySince = simTime;
    setState(aircraft, 'HOLDING');
    return;
  }
  aircraft.position.x += deltaX / distance * step;
  aircraft.position.z += deltaZ / distance * step;
  aircraft.yaw = Math.atan2(-deltaZ, deltaX);
  aircraft.displayYaw = approachAngle(aircraft.displayYaw, aircraft.yaw, dt * 0.6);
  aircraft.roll = lerp(aircraft.roll, 0, clamp01(dt));
}

function updateOrbit(aircraft, dt) {
  const angularSpeed = aircraft.speed / ORBIT.radius;
  const before = ((aircraft.orbitAngle + Math.PI / 2) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  aircraft.orbitAngle += angularSpeed * dt;
  const after = ((aircraft.orbitAngle + Math.PI / 2) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  aircraft.position.x = ORBIT.x + Math.cos(aircraft.orbitAngle) * ORBIT.radius;
  aircraft.position.z = ORBIT.z + Math.sin(aircraft.orbitAngle) * ORBIT.radius;
  aircraft.yaw = Math.atan2(-Math.cos(aircraft.orbitAngle), -Math.sin(aircraft.orbitAngle));
  aircraft.displayYaw = approachAngle(aircraft.displayYaw, aircraft.yaw, dt * 0.6);
  aircraft.roll = lerp(aircraft.roll, 0.32, clamp01(dt));
  const targetAltitude = aircraft.state === 'CLEARED' ? FINAL_ALT : holdAltitude(aircraft.holdLevel);
  aircraft.altitude += clamp(targetAltitude - aircraft.altitude, -0.8 * dt, 0.8 * dt);
  if (aircraft.state !== 'CLEARED') return;
  const crossedFinal = after < before;
  if (!crossedFinal || Math.abs(aircraft.altitude - FINAL_ALT) > 0.6 || runway.owner) return;
  const departure = waitingDeparture();
  if (departure && departure.readySince < aircraft.readySince) return;
  runway.owner = aircraft;
  startFinal(aircraft);
}

function startFinal(aircraft) {
  const gateX = GATE_X[aircraft.gateIndex];
  const standZ = NOSE_Z + aircraft.type.length / 2;
  const exitX = aircraft.type.key === 'wide' ? EXIT_FAR : EXIT_NEAR;
  aircraft.path = buildPath([
    { x: ORBIT.x, z: 0 }, { x: TOUCHDOWN_X, z: 0 }, { x: exitX, z: 0 }, { x: exitX, z: TAXIWAY_Z },
    { x: gateX, z: TAXIWAY_Z }, { x: gateX, z: LANE_Z }, { x: gateX, z: standZ },
  ], 3);
  aircraft.distance = 0;
  aircraft.touchdownDistance = TOUCHDOWN_X - ORBIT.x;
  aircraft.exitDistance = exitX - ORBIT.x - 3;
  aircraft.reverse = false;
  aircraft.roll = 0;
  setState(aircraft, 'FINAL');
}

function glideAltitude(aircraft) {
  const remaining = aircraft.touchdownDistance - aircraft.distance;
  if (remaining <= 0) return 0;
  const straight = FINAL_ALT * remaining / aircraft.touchdownDistance;
  if (remaining > 8) return straight;
  const flareStart = FINAL_ALT * 8 / aircraft.touchdownDistance;
  return flareStart * Math.pow(remaining / 8, 1.6);
}

function moveAlongPath(aircraft, dt, targetSpeed, acceleration, deceleration) {
  let target = targetSpeed;
  let braking = deceleration;
  if (aircraft.blocker) {
    target = 0;
    braking = Math.max(deceleration, 1.2);
  }
  if (aircraft.speed < target) aircraft.speed = Math.min(target, aircraft.speed + acceleration * dt);
  else aircraft.speed = Math.max(target, aircraft.speed - braking * dt);
  aircraft.distance = Math.min(aircraft.path.total, aircraft.distance + aircraft.speed * dt);
  const sample = samplePath(aircraft.path, aircraft.distance);
  aircraft.position.x = sample.x;
  aircraft.position.z = sample.z;
  aircraft.yaw = Math.atan2(-sample.dirZ, sample.dirX) + (aircraft.reverse ? Math.PI : 0);
  aircraft.displayYaw = aircraft.yaw;
}

function updateArrivalPath(aircraft, dt) {
  const distance = aircraft.distance;
  const remaining = aircraft.path.total - distance;
  if (aircraft.state === 'FINAL') {
    const slowdown = clamp01((distance - (aircraft.touchdownDistance - 30)) / 30);
    aircraft.speed = 4.5 - 0.7 * slowdown;
    aircraft.distance += aircraft.speed * dt;
    const sample = samplePath(aircraft.path, aircraft.distance);
    aircraft.position.x = sample.x;
    aircraft.position.z = sample.z;
    aircraft.yaw = Math.atan2(-sample.dirZ, sample.dirX);
    aircraft.displayYaw = approachAngle(aircraft.displayYaw, aircraft.yaw, dt * 0.8);
    aircraft.altitude = glideAltitude(aircraft);
    const flare = aircraft.touchdownDistance - aircraft.distance < 8;
    aircraft.pitch = lerp(aircraft.pitch, flare ? 0.12 : 0.05, clamp01(dt * 2));
    aircraft.roll = lerp(aircraft.roll, 0, clamp01(dt * 2));
    if (aircraft.distance >= aircraft.touchdownDistance) {
      aircraft.altitude = 0;
      recordMovement('landing');
      setState(aircraft, 'ROLLOUT');
    }
    return;
  }
  let target;
  if (distance < aircraft.exitDistance) target = Math.sqrt(1.44 + 2 * 0.09 * (aircraft.exitDistance - distance));
  else target = 1.2;
  target = Math.min(target, Math.sqrt(2 * 0.25 * remaining) + 0.03);
  moveAlongPath(aircraft, dt, target, 0.25, 0.4);
  aircraft.altitude = 0;
  aircraft.pitch = lerp(aircraft.pitch, 0, clamp01(dt * 1.5));
  if (aircraft.state === 'ROLLOUT' && distance > aircraft.exitDistance + 8) setState(aircraft, 'TAXI_IN');
  const clearOfRunway = aircraft.position.z < -(RUNWAY.halfWidth + aircraft.type.reach * 0.9 + 0.5);
  if (runway.owner === aircraft && distance > aircraft.exitDistance && clearOfRunway) runway.owner = null;
  if (aircraft.path.total - aircraft.distance < 0.02 && aircraft.speed < 0.08) dockAircraft(aircraft);
}

// --- Gate turnaround ----------------------------------------------------------
function dockAircraft(aircraft) {
  const gate = gates[aircraft.gateIndex];
  if (runway.owner === aircraft) runway.owner = null;
  aircraft.speed = 0;
  aircraft.altitude = 0;
  aircraft.pitch = 0;
  aircraft.position.set(gate.x, 0, NOSE_Z + aircraft.type.length / 2);
  aircraft.yaw = Math.PI / 2;
  aircraft.displayYaw = aircraft.yaw;
  aircraft.dockTime = simTime;
  aircraft.turnaroundTime = randomBetween(simRandom, 120, 240);
  aircraft.std = aircraft.dockTime + aircraft.turnaroundTime + 20;
  aircraft.timeline = {};
  gate.docked = aircraft;
  setState(aircraft, 'DOCKED');
}

function serviceSpot(kind, aircraft) {
  const gateX = GATE_X[aircraft.gateIndex];
  const type = aircraft.type;
  const standZ = NOSE_Z + type.length / 2;
  if (kind === 'fuel') return { x: gateX + type.span * 0.3 + 0.8, z: standZ + 1.4 };
  if (kind === 'baggage') return { x: gateX + type.radius + 1.7, z: standZ + type.length * 0.3 };
  return { x: gateX + type.radius + 1.3, z: NOSE_Z + type.length * 0.2 };
}
const depotFor = (gateX) => (gateX < -4 ? DEPOTS[0] : DEPOTS[1]);

function addVehicle(kind, path, gateIndex) {
  const model = buildVehicleModel(kind);
  scene.add(model.group);
  const start = samplePath(path, 0);
  const vehicle = {
    kind, model, path, distance: 0, speed: 0, mode: 'out', gateIndex,
    x: start.x, z: start.z, yaw: Math.atan2(-start.dirZ, start.dirX), displayYaw: 0,
    phase: simRandom(),
  };
  vehicle.displayYaw = vehicle.yaw;
  vehicles.push(vehicle);
  return vehicle;
}

function dispatchService(kind, aircraft) {
  const gateX = GATE_X[aircraft.gateIndex];
  const depot = depotFor(gateX);
  const spot = serviceSpot(kind, aircraft);
  const path = buildPath([depot, { x: gateX + 6.5, z: ROAD_Z }, { x: gateX + 6.5, z: spot.z }, spot], 1.5);
  return addVehicle(kind, path, aircraft.gateIndex);
}

function dispatchPushTug(aircraft) {
  const gateX = GATE_X[aircraft.gateIndex];
  const depot = depotFor(gateX);
  const path = buildPath([depot, { x: gateX + 2.5, z: ROAD_Z }, { x: gateX, z: ROAD_Z + 0.4 }, { x: gateX, z: NOSE_Z - 0.9 }], 1.2);
  return addVehicle('push', path, aircraft.gateIndex);
}

function recallVehicle(vehicle) {
  if (!vehicle || vehicle.mode === 'back') return;
  const gateX = GATE_X[vehicle.gateIndex];
  const depot = depotFor(gateX);
  const here = { x: vehicle.x, z: vehicle.z };
  let points;
  if (vehicle.kind === 'push') {
    points = [here, { x: here.x, z: -29 }, { x: here.x, z: ROAD_Z }, depot];
  } else if (vehicle.mode === 'parked') {
    points = [here, { x: here.x, z: here.z + 2.2 }, { x: gateX + 6.5, z: here.z + 2.2 }, { x: gateX + 6.5, z: ROAD_Z }, depot];
  } else {
    points = [here, depot];
  }
  vehicle.path = buildPath(points, 1.5);
  vehicle.distance = 0;
  vehicle.mode = 'back';
}

function updateVehicle(vehicle, dt) {
  if (vehicle.mode === 'parked' || vehicle.mode === 'attached') return;
  const remaining = vehicle.path.total - vehicle.distance;
  const target = Math.min(2.4, Math.sqrt(2 * 1.2 * remaining) + 0.15);
  vehicle.speed += clamp(target - vehicle.speed, -2 * dt, 1.2 * dt);
  vehicle.distance = Math.min(vehicle.path.total, vehicle.distance + vehicle.speed * dt);
  const sample = samplePath(vehicle.path, vehicle.distance);
  vehicle.x = sample.x;
  vehicle.z = sample.z;
  vehicle.yaw = Math.atan2(-sample.dirZ, sample.dirX);
  vehicle.displayYaw = approachAngle(vehicle.displayYaw, vehicle.yaw, dt * 4);
  if (vehicle.distance >= vehicle.path.total - 1e-3) {
    if (vehicle.mode === 'out') {
      vehicle.mode = 'parked';
      vehicle.speed = 0;
    } else {
      vehicle.mode = 'done';
    }
  }
}

function lanesClearForPushback(aircraft) {
  const gateX = GATE_X[aircraft.gateIndex];
  for (const other of aircraftList) {
    if (other === aircraft || !isOnGround(other) || other.state === 'DOCKED') continue;
    const deltaX = other.position.x - gateX;
    // A plane still on the lane east of this gate will taxi west through the pushback area.
    const onLane = Math.abs(other.position.z - LANE_Z) < 6;
    if (onLane && deltaX > -6 && ['PUSHBACK', 'STARTUP', 'TAXI_OUT'].includes(other.state)) return false;
    const deltaZ = other.position.z - LANE_Z;
    if (Math.abs(deltaZ) < 6 && deltaX > -9 && deltaX < 24) return false;
    if (Math.hypot(deltaX, other.position.z - (LANE_Z - 6)) < 9) return false;
  }
  return true;
}

function updateTurnaround(aircraft) {
  const gate = gates[aircraft.gateIndex];
  const elapsed = simTime - aircraft.dockTime;
  const total = aircraft.turnaroundTime;
  const timeline = aircraft.timeline;
  gate.goal = elapsed >= 2 && elapsed < total - 14 ? 1 : 0;
  if (elapsed >= 6 && !timeline.baggage) timeline.baggage = dispatchService('baggage', aircraft);
  if (elapsed >= 12 && !timeline.fuel) timeline.fuel = dispatchService('fuel', aircraft);
  if (elapsed >= total * 0.25 && !timeline.catering) timeline.catering = dispatchService('catering', aircraft);
  if (elapsed >= total * 0.6) recallVehicle(timeline.fuel);
  if (elapsed >= total * 0.68) recallVehicle(timeline.catering);
  if (elapsed >= total - 30) recallVehicle(timeline.baggage);
  if (elapsed >= total - 26 && !timeline.tug) timeline.tug = dispatchPushTug(aircraft);
  const tugReady = timeline.tug && timeline.tug.mode === 'parked';
  if (elapsed >= total && gate.extension <= 0.001 && tugReady && lanesClearForPushback(aircraft)) startPushback(aircraft);
}

function startPushback(aircraft) {
  const gateX = GATE_X[aircraft.gateIndex];
  const standZ = NOSE_Z + aircraft.type.length / 2;
  aircraft.path = buildPath([{ x: gateX, z: standZ }, { x: gateX, z: LANE_Z }, { x: gateX + 7, z: LANE_Z }], 4);
  aircraft.distance = 0;
  aircraft.speed = 0;
  aircraft.reverse = true;
  aircraft.timeline.tug.mode = 'attached';
  gates[aircraft.gateIndex].docked = null;
  setState(aircraft, 'PUSHBACK');
}

function updatePushback(aircraft, dt) {
  const remaining = aircraft.path.total - aircraft.distance;
  moveAlongPath(aircraft, dt, Math.min(0.45, Math.sqrt(2 * 0.15 * remaining) + 0.03), 0.1, 0.3);
  attachTug(aircraft);
  if (remaining < 0.01) {
    aircraft.reverse = false;
    aircraft.speed = 0;
    const tug = aircraft.timeline.tug;
    tug.mode = 'parked';
    recallVehicle(tug);
    gates[aircraft.gateIndex].reservedBy = null;
    setState(aircraft, 'STARTUP');
  }
}

function attachTug(aircraft) {
  const tug = aircraft.timeline.tug;
  if (!tug) return;
  const noseDirectionX = Math.cos(aircraft.yaw);
  const noseDirectionZ = -Math.sin(aircraft.yaw);
  const offset = aircraft.type.length / 2 + 0.7;
  tug.x = aircraft.position.x + noseDirectionX * offset;
  tug.z = aircraft.position.z + noseDirectionZ * offset;
  tug.yaw = aircraft.yaw + Math.PI;
  tug.displayYaw = tug.yaw;
}

// --- Departure ----------------------------------------------------------------
function startTaxiOut(aircraft) {
  const gateX = GATE_X[aircraft.gateIndex];
  aircraft.path = buildPath([
    { x: gateX + 7, z: LANE_Z }, { x: CONNECTOR_X, z: LANE_Z }, { x: CONNECTOR_X, z: TAXIWAY_Z },
    { x: HOLD.x, z: TAXIWAY_Z }, { x: HOLD.x, z: HOLD.z },
  ], 3);
  aircraft.distance = 0;
  setState(aircraft, 'TAXI_OUT');
}

function updateTaxiOut(aircraft, dt) {
  const remaining = aircraft.path.total - aircraft.distance;
  moveAlongPath(aircraft, dt, Math.min(1.2, Math.sqrt(2 * 0.25 * remaining) + 0.03), 0.2, 0.4);
  if (remaining < 0.02 && aircraft.speed < 0.08) {
    aircraft.speed = 0;
    aircraft.readySince = simTime;
    setState(aircraft, 'HOLD_SHORT');
  }
}

function startTakeoff(aircraft) {
  aircraft.path = buildPath([{ x: HOLD.x, z: HOLD.z }, { x: HOLD.x, z: 0 }, { x: 470, z: 0 }], 3);
  aircraft.distance = 0;
  aircraft.lineupDistance = 9.5;
  aircraft.liftoffDistance = null;
  setState(aircraft, 'TAKEOFF');
}

function updateTakeoff(aircraft, dt) {
  if (aircraft.distance < aircraft.lineupDistance) {
    aircraft.speed = Math.min(0.8, aircraft.speed + 0.3 * dt);
  } else {
    const acceleration = aircraft.liftoffDistance === null ? 0.12 : 0.08;
    aircraft.speed = Math.min(7, aircraft.speed + acceleration * dt);
  }
  aircraft.distance = Math.min(aircraft.path.total, aircraft.distance + aircraft.speed * dt);
  const sample = samplePath(aircraft.path, aircraft.distance);
  aircraft.position.x = sample.x;
  aircraft.position.z = sample.z;
  aircraft.yaw = Math.atan2(-sample.dirZ, sample.dirX);
  aircraft.displayYaw = aircraft.yaw;
  if (aircraft.liftoffDistance === null && aircraft.speed >= 4.5) {
    aircraft.liftoffDistance = aircraft.distance;
    recordMovement('takeoff');
  }
  if (aircraft.liftoffDistance !== null) {
    const climbed = aircraft.distance - aircraft.liftoffDistance;
    aircraft.altitude = climbed < 10 ? 0.007 * climbed * climbed : 0.7 + (climbed - 10) * 0.14;
    aircraft.pitch = lerp(aircraft.pitch, 0.15, clamp01(dt * 1.5));
    if (aircraft.altitude > 0.5 && aircraft.state === 'TAKEOFF') setState(aircraft, 'CLIMB');
  } else {
    aircraft.pitch = aircraft.speed > 4.1 ? lerp(aircraft.pitch, 0.06, clamp01(dt * 2)) : 0;
  }
  if (runway.owner === aircraft && aircraft.altitude > 2.5) runway.owner = null;
  if (aircraft.distance >= aircraft.path.total - 0.01) removeAircraft(aircraft);
}

function removeAircraft(aircraft) {
  if (runway.owner === aircraft) runway.owner = null;
  scene.remove(aircraft.model.root);
  aircraft.idMaterial.dispose();
  aircraft.model.exhausts.forEach((exhaust) => exhaust.material.dispose());
  aircraft.state = 'GONE';
  departedRecords.push({ flight: aircraft.departureFlight, destination: aircraft.destination, gateIndex: aircraft.gateIndex, std: aircraft.std, time: simTime });
  const index = aircraftList.indexOf(aircraft);
  if (index >= 0) aircraftList.splice(index, 1);
  if (followed === aircraft) setFollowed(null);
}

// --- Separation on the ground ------------------------------------------------------
function computeBlocking() {
  const groundAircraft = aircraftList.filter(isOnGround);
  for (const aircraft of aircraftList) {
    aircraft.blocker = null;
    aircraft.blockDistance = Infinity;
  }
  for (const aircraft of groundAircraft) {
    if (!isGroundMover(aircraft)) continue;
    const here = samplePath(aircraft.path, aircraft.distance);
    const start = aircraft.type.reach * 0.6;
    const end = start + 6;
    for (let ahead = start; ahead <= end && !aircraft.blocker; ahead += 1) {
      const along = aircraft.distance + ahead;
      if (along > aircraft.path.total + 0.5) break;
      const point = samplePath(aircraft.path, along);
      for (const other of groundAircraft) {
        if (other === aircraft) continue;
        const deltaX = other.position.x - point.x;
        const deltaZ = other.position.z - point.z;
        const limit = other.type.reach + aircraft.type.reach * 0.5 + 0.4;
        if (deltaX * deltaX + deltaZ * deltaZ >= limit * limit) continue;
        const relativeX = other.position.x - aircraft.position.x;
        const relativeZ = other.position.z - aircraft.position.z;
        if (relativeX * here.dirX + relativeZ * here.dirZ <= 0) continue;
        aircraft.blocker = other;
        aircraft.blockDistance = ahead;
        break;
      }
    }
  }
  for (const aircraft of groundAircraft) {
    const other = aircraft.blocker;
    if (!other || other.blocker !== aircraft) continue;
    const thisProceeds = aircraft.blockDistance > other.blockDistance || (aircraft.blockDistance === other.blockDistance && aircraft.id < other.id);
    if (thisProceeds) aircraft.blocker = null;
    else other.blocker = null;
  }
}

function updateAircraft(aircraft, dt) {
  aircraft.stateTime += dt;
  switch (aircraft.state) {
    case 'INBOUND': updateInbound(aircraft, dt); break;
    case 'HOLDING':
    case 'CLEARED': updateOrbit(aircraft, dt); break;
    case 'FINAL':
    case 'ROLLOUT':
    case 'TAXI_IN': updateArrivalPath(aircraft, dt); break;
    case 'DOCKED': updateTurnaround(aircraft); break;
    case 'PUSHBACK': updatePushback(aircraft, dt); break;
    case 'STARTUP': if (aircraft.stateTime > 6) startTaxiOut(aircraft); break;
    case 'TAXI_OUT': updateTaxiOut(aircraft, dt); break;
    case 'TAKEOFF':
    case 'CLIMB': updateTakeoff(aircraft, dt); break;
    default: break;
  }
}

function simulationStep(dt) {
  simTime += dt;
  scheduleArrivals();
  updateRunwayController();
  computeBlocking();
  for (const aircraft of [...aircraftList]) updateAircraft(aircraft, dt);
  for (const vehicle of vehicles) updateVehicle(vehicle, dt);
  for (let index = vehicles.length - 1; index >= 0; index--) {
    if (vehicles[index].mode === 'done') {
      scene.remove(vehicles[index].model.group);
      vehicles.splice(index, 1);
    }
  }
  for (const gate of gates) updateBridge(gate, dt);
  while (departedRecords.length && departedRecords[0].time < simTime - 60) departedRecords.shift();
}

// --- Opening state: a busy morning already underway ----------------------------
function seedOpeningTraffic() {
  refillSchedule();
  const openingGates = [0, 1, 2, 4, 5];
  openingGates.forEach((gateIndex, order) => {
    const entry = makeArrivalEntry();
    entry.sta = -randomBetween(simRandom, 60, 200);
    const aircraft = createAircraft(entry);
    aircraft.gateIndex = gateIndex;
    gates[gateIndex].reservedBy = aircraft.id;
    dockAircraft(aircraft);
    const elapsed = [70, 25, 100, 45, 4][order];
    aircraft.dockTime = simTime - elapsed;
    aircraft.std = aircraft.dockTime + aircraft.turnaroundTime + 20;
    gates[gateIndex].extension = elapsed > 10 ? 1 : 0;
  });
  scheduledArrivals.length = 0;
  nextArrivalTime = 4;
  refillSchedule();
  for (let step = 0; step < 200; step++) simulationStep(STEP);
}

// ---------------------------------------------------------------------------
// Day and night.
// ---------------------------------------------------------------------------
const colorScratch = new THREE.Color();
const COLORS = {
  daySkyTop: new THREE.Color(0x5d9be0), daySkyBottom: new THREE.Color(0xc4e2f2),
  duskSkyTop: new THREE.Color(0x3a4a8f), duskSkyBottom: new THREE.Color(0xf4a462),
  nightSkyTop: new THREE.Color(0x04060f), nightSkyBottom: new THREE.Color(0x141b38),
  sunHigh: new THREE.Color(0xfff1d6), sunLow: new THREE.Color(0xff9447), moon: new THREE.Color(0x8fa3d9),
  hemiDay: new THREE.Color(0xc0d8ef), hemiNight: new THREE.Color(0x2a3666), hemiDusk: new THREE.Color(0xe9a07a),
  groundDay: new THREE.Color(0x6b7a4a), groundNight: new THREE.Color(0x0d1222),
  windowDay: new THREE.Color(0x3a5066), windowNight: new THREE.Color(0xffc96a),
  towerDay: new THREE.Color(0x2f4a5f), towerNight: new THREE.Color(0xc8f0ff),
  cloudDay: new THREE.Color(0xfbf7ef), cloudNight: new THREE.Color(0x343d5c), cloudDusk: new THREE.Color(0xf6b38a),
  shadeDay: new THREE.Color(0xb7c4d8), shadeNight: new THREE.Color(0x1d2440),
};
let nightAmount = 0;
let skyPhase = 'sun';
function updateEnvironment() {
  const dayFraction = (DAY_START + simTime / DAY_LENGTH_SIM) % 1;
  const sunAngle = (dayFraction - 0.25) * Math.PI * 2;
  const elevation = Math.sin(sunAngle);
  const dayAmount = smoothstep(-0.1, 0.3, elevation);
  const duskAmount = clamp01(1 - Math.abs(elevation) / 0.32);
  nightAmount = 1 - smoothstep(-0.12, 0.08, elevation);
  skyPhase = elevation > 0.12 ? 'sun' : elevation > -0.1 ? 'dusk' : 'moon';

  const target = sunLight.target.position;
  if (elevation > 0) {
    const direction = new THREE.Vector3(Math.cos(sunAngle), Math.max(Math.sin(sunAngle), 0.22), 0.5).normalize();
    sunLight.position.copy(target).addScaledVector(direction, 300);
    sunLight.color.copy(COLORS.sunLow).lerp(COLORS.sunHigh, smoothstep(0, 0.45, elevation));
    sunLight.intensity = 2.8 * smoothstep(-0.02, 0.22, elevation);
  } else {
    const direction = new THREE.Vector3(-0.4, 0.85, -0.35).normalize();
    sunLight.position.copy(target).addScaledVector(direction, 300);
    sunLight.color.copy(COLORS.moon);
    sunLight.intensity = 0.55 * (1 - smoothstep(-0.25, 0, elevation));
  }
  hemisphereLight.color.copy(COLORS.hemiNight).lerp(COLORS.hemiDay, dayAmount).lerp(COLORS.hemiDusk, duskAmount * 0.35);
  hemisphereLight.groundColor.copy(COLORS.groundNight).lerp(COLORS.groundDay, dayAmount);
  hemisphereLight.intensity = lerp(1.1, 1.7, dayAmount);

  const skyTop = postMaterial.uniforms.skyTop.value;
  const skyBottom = postMaterial.uniforms.skyBottom.value;
  skyTop.copy(COLORS.nightSkyTop).lerp(COLORS.daySkyTop, dayAmount).lerp(COLORS.duskSkyTop, duskAmount * 0.6);
  skyBottom.copy(COLORS.nightSkyBottom).lerp(COLORS.daySkyBottom, dayAmount).lerp(COLORS.duskSkyBottom, duskAmount * 0.8);
  postMaterial.uniforms.uNight.value = nightAmount;

  for (const material of windowMaterials) {
    if (material) material.color.copy(COLORS.windowDay).lerp(COLORS.windowNight, nightAmount);
  }
  towerGlass.color.copy(COLORS.towerDay).lerp(COLORS.towerNight, nightAmount);
  for (const light of apronLights) light.intensity = nightAmount * 22;
  lightMaterial.uniforms.uNight.value = nightAmount;
  cloudUniforms.uLit.value.copy(COLORS.cloudNight).lerp(COLORS.cloudDay, dayAmount).lerp(COLORS.cloudDusk, duskAmount * 0.55);
  cloudUniforms.uShade.value.copy(COLORS.shadeNight).lerp(COLORS.shadeDay, dayAmount).lerp(COLORS.cloudDusk, duskAmount * 0.3);
}

// ---------------------------------------------------------------------------
// Visual sync from the simulation.
// ---------------------------------------------------------------------------
const ENGINE_STATES = new Set(['STARTUP', 'TAXI_OUT', 'HOLD_SHORT', 'TAKEOFF', 'CLIMB', 'ROLLOUT', 'TAXI_IN', 'FINAL', 'INBOUND', 'HOLDING', 'CLEARED', 'PUSHBACK']);
const vectorScratch = new THREE.Vector3();
let dynamicCount = 0;
function pushDynamicLight(position, hex, size) {
  if (dynamicCount >= DYNAMIC_LIGHT_LIMIT) return;
  const offset = dynamicCount * 3;
  dynamicPositions[offset] = position.x;
  dynamicPositions[offset + 1] = position.y;
  dynamicPositions[offset + 2] = position.z;
  colorScratch.setHex(hex);
  dynamicColors[offset] = colorScratch.r;
  dynamicColors[offset + 1] = colorScratch.g;
  dynamicColors[offset + 2] = colorScratch.b;
  dynamicSizes[dynamicCount] = size;
  dynamicCount++;
}

function syncVisuals() {
  dynamicCount = 0;
  const flashClock = simTime;
  for (const aircraft of aircraftList) {
    const model = aircraft.model;
    model.root.position.set(aircraft.position.x, aircraft.altitude, aircraft.position.z);
    model.root.rotation.y = aircraft.displayYaw;
    model.body.rotation.z = aircraft.pitch;
    model.body.rotation.x = aircraft.roll;
    model.root.updateMatrixWorld(true);
    const enginesOn = ENGINE_STATES.has(aircraft.state) && !(aircraft.state === 'PUSHBACK' && aircraft.distance < 3);
    let exhaustStrength = 0;
    if (aircraft.state === 'TAKEOFF') exhaustStrength = aircraft.distance > aircraft.lineupDistance ? 0.95 : 0.45;
    else if (aircraft.state === 'CLIMB') exhaustStrength = aircraft.altitude < 4 ? 0.7 : 0;
    else if (isOnGround(aircraft) && enginesOn) exhaustStrength = 0.38;
    for (const exhaust of model.exhausts) {
      exhaust.visible = exhaustStrength > 0;
      exhaust.material.uniforms.uStrength.value = exhaustStrength;
    }
    for (const prop of model.props) {
      prop.disc.visible = enginesOn;
      prop.blades.visible = !enginesOn;
    }
    const offsets = model.lightOffsets;
    const beaconOn = enginesOn || aircraft.state === 'DOCKED' && simTime - aircraft.dockTime > aircraft.turnaroundTime - 4;
    if (beaconOn && ((flashClock * 1.1 + aircraft.id * 0.37) % 1) < 0.18) {
      pushDynamicLight(model.body.localToWorld(vectorScratch.copy(offsets.beaconTop)), 0xff3020, 3);
      pushDynamicLight(model.body.localToWorld(vectorScratch.copy(offsets.beaconBottom)), 0xff3020, 3);
    }
    if (aircraft.state !== 'DOCKED') {
      pushDynamicLight(model.body.localToWorld(vectorScratch.copy(offsets.navLeft)), 0xff3b30, 2);
      pushDynamicLight(model.body.localToWorld(vectorScratch.copy(offsets.navRight)), 0x4cff6a, 2);
      pushDynamicLight(model.body.localToWorld(vectorScratch.copy(offsets.tail)), 0xffffff, 2);
    }
    const strobing = aircraft.altitude > 0.05 || (aircraft.state === 'TAKEOFF' && aircraft.distance > aircraft.lineupDistance);
    const strobePhase = (flashClock * 0.9 + aircraft.id * 0.21) % 1;
    if (strobing && (strobePhase < 0.05 || (strobePhase > 0.12 && strobePhase < 0.17))) {
      pushDynamicLight(model.body.localToWorld(vectorScratch.copy(offsets.navLeft)), 0xffffff, 4);
      pushDynamicLight(model.body.localToWorld(vectorScratch.copy(offsets.navRight)), 0xffffff, 4);
    }
  }
  for (const vehicle of vehicles) {
    vehicle.model.group.position.set(vehicle.x, 0, vehicle.z);
    vehicle.model.group.rotation.y = vehicle.displayYaw;
    if (((flashClock * 1.6 + vehicle.phase) % 1) < 0.3) {
      vectorScratch.set(vehicle.x, vehicle.model.beaconHeight, vehicle.z);
      pushDynamicLight(vectorScratch, 0xffa420, 2);
    }
  }
  if ((flashClock * 0.5) % 1 < 0.5) pushDynamicLight(vectorScratch.set(64, 18.9, -51), 0xff2a1a, 3);
  pushDynamicLight(vectorScratch.set(-100, 6.1, -43), 0xff2a1a, nightAmount > 0.3 ? 2 : 0);
  dynamicLightGeometry.setDrawRange(0, dynamicCount);
  dynamicLightGeometry.attributes.position.needsUpdate = true;
  dynamicLightGeometry.attributes.lightColor.needsUpdate = true;
  dynamicLightGeometry.attributes.size.needsUpdate = true;

  for (const cloud of clouds) {
    cloud.position.x = ((cloud.position.x + 300 + cloud.userData.drift * 0.016 * speedMultiplier * SIM_RATE) % 600) - 300;
  }
}

// ---------------------------------------------------------------------------
// Rendering passes.
// ---------------------------------------------------------------------------
const swappedMeshes = [];
const hiddenObjects = [];
function renderFrame() {
  // Pass 1: flat ids for the outline pass.
  swappedMeshes.length = 0;
  hiddenObjects.length = 0;
  scene.traverse((object) => {
    if (object.isPoints || object.userData.noId) {
      if (object.visible) {
        object.visible = false;
        hiddenObjects.push(object);
      }
      return;
    }
    if (object.isMesh) {
      swappedMeshes.push(object, object.material);
      object.material = object.userData.idMat || ID_ZERO;
    }
  });
  renderer.setClearColor(0x000000, 0);
  renderer.setRenderTarget(idTarget);
  renderer.render(scene, camera);
  for (let index = 0; index < swappedMeshes.length; index += 2) swappedMeshes[index].material = swappedMeshes[index + 1];
  for (const object of hiddenObjects) object.visible = true;

  // Pass 2: lit colour at low resolution.
  renderer.shadowMap.needsUpdate = true;
  renderer.setRenderTarget(colorTarget);
  renderer.render(scene, camera);

  // Pass 3: nearest neighbour upscale with outline and dither.
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCamera);
}

// ---------------------------------------------------------------------------
// Interface.
// ---------------------------------------------------------------------------
const elements = {
  clock: document.getElementById('clock'),
  skyIcon: document.getElementById('sky-icon'),
  ground: document.getElementById('stat-ground'),
  air: document.getElementById('stat-air'),
  moves: document.getElementById('stat-moves'),
  arrivals: document.getElementById('arrivals'),
  departures: document.getElementById('departures'),
  board: document.getElementById('board'),
  follow: document.getElementById('follow'),
  followFlight: document.getElementById('follow-flight'),
  followAirline: document.getElementById('follow-airline'),
  followType: document.getElementById('follow-type'),
  followGate: document.getElementById('follow-gate'),
  followState: document.getElementById('follow-state'),
  followAlt: document.getElementById('follow-alt'),
  followSpeed: document.getElementById('follow-speed'),
  followStop: document.getElementById('follow-stop'),
  tag: document.getElementById('tag'),
  hint: document.getElementById('hint'),
};

const STATE_LABELS = {
  INBOUND: 'Inbound', HOLDING: 'Holding', CLEARED: 'Cleared to land', FINAL: 'On final', ROLLOUT: 'Landing roll',
  TAXI_IN: 'Taxi to gate', DOCKED: 'At gate', PUSHBACK: 'Pushback', STARTUP: 'Engine start', TAXI_OUT: 'Taxi out',
  HOLD_SHORT: 'Holding short', TAKEOFF: 'Takeoff roll', CLIMB: 'Climbing',
};

function formatClock(seconds) {
  const total = Math.floor(START_CLOCK + seconds);
  const hours = Math.floor(total / 3600) % 24;
  const minutes = Math.floor(total / 60) % 60;
  return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
}

function arrivalStatus(aircraft) {
  switch (aircraft.state) {
    case 'INBOUND': return ['Inbound', 'down', 'c-blue'];
    case 'HOLDING': return ['Holding', 'diamond', 'c-amber'];
    case 'CLEARED': return ['Approach', 'down', 'c-blue'];
    case 'FINAL': return ['Final', 'down', 'c-green'];
    case 'ROLLOUT': return ['Landed', 'down', 'c-green'];
    case 'TAXI_IN': return ['Taxi in', 'dot', 'c-green'];
    default: return ['At gate', 'dot', 'c-green'];
  }
}
function departureStatus(aircraft) {
  switch (aircraft.state) {
    case 'DOCKED': return simTime - aircraft.dockTime > aircraft.turnaroundTime - 20 ? ['Closing', 'ring', 'c-amber'] : ['Boarding', 'ring', 'c-text'];
    case 'PUSHBACK':
    case 'STARTUP': return ['Pushback', 'dot', 'c-amber'];
    case 'TAXI_OUT': return ['Taxiing', 'up', 'c-amber'];
    case 'HOLD_SHORT': return ['Waiting', 'diamond', 'c-amber'];
    case 'TAKEOFF': return ['Takeoff', 'up', 'c-green'];
    default: return ['Airborne', 'up', 'c-green'];
  }
}

function rowHtml(row) {
  const [label, shape, colorClass] = row.status;
  const classes = [row.id ? 'live' : '', followed && row.id === followed.id ? 'followed' : ''].join(' ').trim();
  return `<tr class="${classes}" data-id="${row.id || ''}"><td class="time">${row.time}</td><td>${row.flight}</td>`
    + `<td class="city">${row.city}</td><td>${row.gate}</td>`
    + `<td><span class="status ${colorClass}"><span class="ic ${shape}"></span>${label}</span></td></tr>`;
}

function updateBoard() {
  const arrivals = [];
  for (const aircraft of aircraftList) {
    const arriving = ['INBOUND', 'HOLDING', 'CLEARED', 'FINAL', 'ROLLOUT', 'TAXI_IN'].includes(aircraft.state);
    const justArrived = aircraft.state === 'DOCKED' && simTime - aircraft.dockTime < 40;
    if (!arriving && !justArrived) continue;
    arrivals.push({ sort: aircraft.sta, id: aircraft.id, time: formatClock(aircraft.sta), flight: aircraft.arrivalFlight, city: aircraft.origin, gate: GATE_NAMES[aircraft.gateIndex], status: arrivalStatus(aircraft) });
  }
  for (const entry of scheduledArrivals) {
    const delayed = simTime > entry.spawnAt + 20;
    arrivals.push({ sort: entry.sta, id: 0, time: formatClock(entry.sta), flight: entry.flight, city: entry.origin, gate: '--', status: delayed ? ['Delayed', 'square', 'c-red'] : ['Scheduled', 'square', 'c-muted'] });
  }
  arrivals.sort((first, second) => first.sort - second.sort);

  const departures = [];
  for (const aircraft of aircraftList) {
    const departing = ['DOCKED', 'PUSHBACK', 'STARTUP', 'TAXI_OUT', 'HOLD_SHORT', 'TAKEOFF', 'CLIMB'].includes(aircraft.state);
    if (!departing || aircraft.std === null) continue;
    departures.push({ sort: aircraft.std, id: aircraft.id, time: formatClock(aircraft.std), flight: aircraft.departureFlight, city: aircraft.destination, gate: GATE_NAMES[aircraft.gateIndex], status: departureStatus(aircraft) });
  }
  for (const record of departedRecords) {
    departures.push({ sort: record.std - 1e5, id: 0, time: formatClock(record.std), flight: record.flight, city: record.destination, gate: GATE_NAMES[record.gateIndex], status: ['Departed', 'up', 'c-muted'] });
  }
  departures.sort((first, second) => first.sort - second.sort);
  const empty = '<tr class="empty"><td>No flights</td></tr>';
  elements.arrivals.innerHTML = arrivals.slice(0, 5).map(rowHtml).join('') || empty;
  elements.departures.innerHTML = departures.slice(0, 5).map(rowHtml).join('') || empty;
}

function updateStats() {
  let onGround = 0;
  let inAir = 0;
  for (const aircraft of aircraftList) {
    if (isOnGround(aircraft)) onGround++;
    else inAir++;
  }
  elements.clock.textContent = formatClock(simTime);
  elements.skyIcon.className = skyPhase;
  elements.ground.textContent = onGround;
  elements.air.textContent = inAir;
  const windowSeconds = Math.max(900, Math.min(3600, simTime));
  const recent = movements.filter((movement) => movement.time >= simTime - windowSeconds).length;
  elements.moves.textContent = Math.round(recent / windowSeconds * 3600);
}

function updateFollowCard() {
  if (!followed) return;
  const aircraft = followed;
  const afterArrival = ['DOCKED', 'PUSHBACK', 'STARTUP', 'TAXI_OUT', 'HOLD_SHORT', 'TAKEOFF', 'CLIMB'].includes(aircraft.state);
  elements.followFlight.textContent = afterArrival ? aircraft.departureFlight : aircraft.arrivalFlight;
  elements.followAirline.textContent = afterArrival ? `${aircraft.airline.name} to ${aircraft.destination}` : `${aircraft.airline.name} from ${aircraft.origin}`;
  elements.followType.textContent = aircraft.type.code;
  elements.followGate.textContent = GATE_NAMES[aircraft.gateIndex];
  elements.followState.textContent = STATE_LABELS[aircraft.state] || aircraft.state;
  elements.followAlt.textContent = aircraft.altitude > 0.05 ? `${Math.round(aircraft.altitude * 230 / 10) * 10} ft` : 'Ground';
  elements.followSpeed.textContent = `${Math.round(aircraft.speed * 31)} kt`;
}

let followed = null;
let zoomGoal = null;
function setFollowed(aircraft) {
  followed = aircraft;
  elements.follow.hidden = !aircraft;
  elements.tag.hidden = !aircraft;
  if (aircraft) {
    zoomGoal = Math.max(camera.zoom, 2.2);
    updateFollowCard();
  }
  updateBoard();
}
elements.followStop.addEventListener('click', () => setFollowed(null));
window.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') setFollowed(null);
});
elements.board.addEventListener('click', (event) => {
  const row = event.target.closest('tr[data-id]');
  if (!row || !row.dataset.id) return;
  const aircraft = aircraftList.find((candidate) => candidate.id === Number(row.dataset.id));
  if (aircraft) setFollowed(aircraft);
});

function selectSpeed(button) {
  speedMultiplier = Number(button.dataset.speed);
  for (const other of document.querySelectorAll('#speed button')) other.setAttribute('aria-pressed', String(other === button));
}
document.getElementById('speed').addEventListener('click', (event) => {
  const button = event.target.closest('button[data-speed]');
  if (button) selectSpeed(button);
});
{
  const requestedSpeed = new URLSearchParams(location.search).get('speed');
  const button = document.querySelector(`#speed button[data-speed="${requestedSpeed}"]`);
  if (button) selectSpeed(button);
}

function projectToScreen(position) {
  vectorScratch.copy(position).project(camera);
  return {
    x: (vectorScratch.x + 1) / 2 * renderWidth * pixelScale,
    y: window.innerHeight - (vectorScratch.y + 1) / 2 * renderHeight * pixelScale,
    visible: vectorScratch.z > -1 && vectorScratch.z < 1,
  };
}

let pointerStart = null;
canvas.addEventListener('pointerdown', (event) => {
  pointerStart = { x: event.clientX, y: event.clientY, time: performance.now() };
});
canvas.addEventListener('pointerup', (event) => {
  if (!pointerStart) return;
  const moved = Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y);
  const quick = performance.now() - pointerStart.time < 500;
  pointerStart = null;
  if (moved > 6 || !quick) return;
  let best = null;
  let bestDistance = 30;
  const point = new THREE.Vector3();
  for (const aircraft of aircraftList) {
    point.set(aircraft.position.x, aircraft.altitude + aircraft.type.gear + aircraft.type.radius, aircraft.position.z);
    const screen = projectToScreen(point);
    const distance = Math.hypot(screen.x - event.clientX, screen.y - event.clientY);
    if (screen.visible && distance < bestDistance) {
      best = aircraft;
      bestDistance = distance;
    }
  }
  setFollowed(best);
});

const followTarget = new THREE.Vector3();
function updateCamera(dt) {
  if (followed) {
    followTarget.set(followed.position.x, followed.altitude, followed.position.z);
    const before = controls.target.clone();
    controls.target.lerp(followTarget, 1 - Math.exp(-dt * 4));
    camera.position.add(controls.target.clone().sub(before));
    const tagPoint = followTarget.clone();
    tagPoint.y += followed.type.gear + followed.type.radius * 2 + 0.6;
    const screen = projectToScreen(tagPoint);
    elements.tag.style.left = `${screen.x}px`;
    elements.tag.style.top = `${screen.y - 8}px`;
    elements.tag.textContent = elements.followFlight.textContent;
  }
  if (zoomGoal !== null) {
    camera.zoom = lerp(camera.zoom, zoomGoal, 1 - Math.exp(-dt * 3));
    camera.updateProjectionMatrix();
    if (Math.abs(camera.zoom - zoomGoal) < 0.01) zoomGoal = null;
  }
  controls.update(dt);
  lightMaterial.uniforms.uScale.value = clamp(camera.zoom, 0.7, 2.5);
}
controls.addEventListener('start', () => {
  zoomGoal = null;
  elements.hint.style.opacity = '0';
});

// ---------------------------------------------------------------------------
// Build and run.
// ---------------------------------------------------------------------------
buildGround();
buildTerminal();
buildTower();
buildHangar();
buildFuelFarm();
buildTrees();
buildParkingLot();
buildWindsock();
buildBridges();
buildClouds();
buildStaticLights();
resize();
seedOpeningTraffic();

let lastTime = performance.now();
let interfaceTimer = 0;
let boardTimer = 0;
const startTime = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  const simDelta = dt * SIM_RATE * speedMultiplier;
  const steps = Math.max(1, Math.ceil(simDelta / STEP));
  for (let step = 0; step < steps; step++) simulationStep(simDelta / steps);
  sharedTime.value = (now - startTime) / 1000;
  postMaterial.uniforms.uTime.value = sharedTime.value;
  updateEnvironment();
  syncVisuals();
  updateCamera(dt);
  renderFrame();
  interfaceTimer -= dt;
  boardTimer -= dt;
  if (interfaceTimer <= 0) {
    interfaceTimer = 0.2;
    updateStats();
    updateFollowCard();
  }
  if (boardTimer <= 0) {
    boardTimer = 0.5;
    updateBoard();
  }
  if (!window.sceneReady) {
    window.sceneReady = true;
    setTimeout(() => { elements.hint.style.opacity = '0'; }, 7000);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
